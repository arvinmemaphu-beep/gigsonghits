    <!-- ============================================================
      SCALE / FRETBOARD EXPLORER — paste this whole block right
      before the closing </body> tag ng iyong index.html
      (after mo yung dulo ng existing <script> ng app).
      Standalone ito — hindi nito hinahawakan ang mga variable
      o functions ng orihinal na app, kaya safe i-paste kahit saan
      sa loob ng <body>.
    ============================================================ -->
    <script>
        (function () {
            "use strict";

            var FE_NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            var FE_TUNING = ['E', 'A', 'D', 'G', 'B', 'E']; // low E (string 6) -> high e (string 1)
            var FE_STRING_LABELS = ['E', 'A', 'D', 'G', 'B', 'e'];
            var FE_FRETS = 15;
            var FE_MARKERS = { 3: 1, 5: 1, 7: 1, 9: 1, 12: 2, 15: 1 }; // 1 = single dot, 2 = double dot

            var FE_SCALES = [
                { group: 'Common', key: 'major', name: 'Major', intervals: [0, 2, 4, 5, 7, 9, 11] },
                { group: 'Common', key: 'minor', name: 'Minor', intervals: [0, 2, 3, 5, 7, 8, 10] },
                { group: 'Common', key: 'majpent', name: 'Major Pentatonic', intervals: [0, 2, 4, 7, 9] },
                { group: 'Common', key: 'minpent', name: 'Minor Pentatonic', intervals: [0, 3, 5, 7, 10] },
                { group: 'Common', key: 'blues', name: 'Blues', intervals: [0, 3, 5, 6, 7, 10] },
                { group: 'Modes', key: 'ionian', name: 'Ionian (Mode 1)', intervals: [0, 2, 4, 5, 7, 9, 11] },
                { group: 'Modes', key: 'dorian', name: 'Dorian (Mode 2)', intervals: [0, 2, 3, 5, 7, 9, 10] },
                { group: 'Modes', key: 'phrygian', name: 'Phrygian (Mode 3)', intervals: [0, 1, 3, 5, 7, 8, 10] },
                { group: 'Modes', key: 'lydian', name: 'Lydian (Mode 4)', intervals: [0, 2, 4, 6, 7, 9, 11] },
                { group: 'Modes', key: 'mixolydian', name: 'Mixolydian (Mode 5)', intervals: [0, 2, 4, 5, 7, 9, 10] },
                { group: 'Modes', key: 'aeolian', name: 'Aeolian (Mode 6)', intervals: [0, 2, 3, 5, 7, 8, 10] },
                { group: 'Modes', key: 'locrian', name: 'Locrian (Mode 7)', intervals: [0, 1, 3, 5, 6, 8, 10] }
            ];

            var feState = { root: 'G', scaleKey: 'major' };

            function feEscape(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

            function injectStyles() {
                var css =
                    '#fe-fab{position:fixed;right:18px;bottom:18px;z-index:80;width:52px;height:52px;border-radius:50%;' +
                    'background:var(--gold,#E8A33D);color:var(--on-accent);border:none;font-size:22px;box-shadow:0 8px 20px rgba(0,0,0,0.4);' +
                    'display:flex;align-items:center;justify-content:center;cursor:pointer;}' +
                    '#fe-fab:hover{background:var(--gold-light,#f2b559);}' +
                    '#fe-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:90;display:none;align-items:center;justify-content:center;padding:16px;}' +
                    '#fe-overlay.open{display:flex;}' +
                    '.fe-panel{background:var(--surface,#1C1815);border:1px solid var(--line,#34291f);border-radius:12px;' +
                    'max-width:920px;width:100%;max-height:92vh;overflow:auto;padding:18px 18px 22px;box-shadow:0 20px 60px rgba(0,0,0,0.5);' +
                    'font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;}' +
                    '.fe-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}' +
                    '.fe-header h2{margin:0;font-size:18px;color:var(--text,#F2EDE4);letter-spacing:0.5px;}' +
                    '#fe-close{background:var(--surface-2,#251F1A);border:1px solid var(--line,#34291f);color:var(--text,#F2EDE4);' +
                    'width:30px;height:30px;border-radius:6px;font-size:14px;cursor:pointer;}' +
                    '#fe-close:hover{border-color:var(--gold-dim,#8a662a);color:var(--gold,#E8A33D);}' +
                    '.fe-controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}' +
                    '.fe-controls label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted,#9a8f80);}' +
                    '.fe-controls select{background:var(--surface-2,#251F1A);border:1px solid var(--line,#34291f);color:var(--text,#F2EDE4);' +
                    'border-radius:6px;padding:8px 10px;font-size:13px;min-width:170px;}' +
                    '.fe-board-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line,#34291f);border-radius:8px;background:#171310;padding:10px 4px;}' +
                    '.fe-legend{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--muted,#9a8f80);align-items:center;flex-wrap:wrap;}' +
                    '.fe-dot-key{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle;}' +
                    '.fe-dot-key.fe-root{background:var(--gold,#E8A33D);}' +
                    '.fe-dot-key.fe-note{background:var(--teal,#4FA8A0);}' +
                    '@media(max-width:600px){.fe-controls select{min-width:130px;}}';
                var style = document.createElement('style');
                style.textContent = css;
                document.head.appendChild(style);
            }

            function computeNote(openNote, fret) {
                var idx = (FE_NOTES.indexOf(openNote) + fret) % 12;
                return FE_NOTES[idx];
            }

            function scaleIntervals() {
                for (var i = 0; i < FE_SCALES.length; i++) { if (FE_SCALES[i].key === feState.scaleKey) return FE_SCALES[i].intervals; }
                return FE_SCALES[0].intervals;
            }

            function noteRole(note) {
                var rootIdx = FE_NOTES.indexOf(feState.root);
                var noteIdx = FE_NOTES.indexOf(note);
                var diff = (noteIdx - rootIdx + 12) % 12;
                if (diff === 0) return 'root';
                if (scaleIntervals().indexOf(diff) !== -1) return 'note';
                return 'none';
            }

            function renderFretboardSVG() {
                var order = [5, 4, 3, 2, 1, 0]; // high e string first (row 0) down to low E (row 5), tab convention
                var cellW = 44, rowH = 34, leftPad = 48, topPad = 14, bottomPad = 24;
                var width = leftPad + (FE_FRETS + 1) * cellW + 14;
                var height = topPad + order.length * rowH + bottomPad;

                var svg = '<svg viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '" xmlns="http://www.w3.org/2000/svg">';

                // fret wires
                for (var f = 0; f <= FE_FRETS; f++) {
                    var x = leftPad + f * cellW - cellW / 2;
                    var isNut = f === 0;
                    svg += '<line x1="' + x + '" y1="' + topPad + '" x2="' + x + '" y2="' + (topPad + order.length * rowH - rowH) + '" ' +
                        'stroke="' + (isNut ? '#F2EDE4' : '#4a4034') + '" stroke-width="' + (isNut ? 4 : 1) + '"></line>';
                }

                // position markers (below the board, under the fret column)
                Object.keys(FE_MARKERS).forEach(function (fretStr) {
                    var fret = parseInt(fretStr, 10);
                    if (fret > FE_FRETS) return;
                    var cx = leftPad + fret * cellW;
                    var cy = topPad + order.length * rowH - rowH + 14;
                    var dots = FE_MARKERS[fret];
                    if (dots === 1) {
                        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="#4a4034"></circle>';
                    } else {
                        svg += '<circle cx="' + (cx - 6) + '" cy="' + cy + '" r="3" fill="#4a4034"></circle>';
                        svg += '<circle cx="' + (cx + 6) + '" cy="' + cy + '" r="3" fill="#4a4034"></circle>';
                    }
                    svg += '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="10" fill="#9a8f80" font-family="Courier New, monospace">' + fret + '</text>';
                });

                // strings + notes
                for (var row = 0; row < order.length; row++) {
                    var stringIdx = order[row];
                    var openNote = FE_TUNING[stringIdx];
                    var y = topPad + row * rowH;

                    // string line
                    svg += '<line x1="' + (leftPad - cellW / 2) + '" y1="' + y + '" x2="' + (leftPad + FE_FRETS * cellW) + '" y2="' + y + '" ' +
                        'stroke="#5a5044" stroke-width="' + (2 - row / order.length) + '"></line>';

                    // string label at the left
                    svg += '<text x="' + (leftPad - cellW / 2 - 10) + '" y="' + (y + 4) + '" text-anchor="end" font-size="12" ' +
                        'fill="#9a8f80" font-family="Courier New, monospace">' + FE_STRING_LABELS[stringIdx] + '</text>';

                    for (var fret = 0; fret <= FE_FRETS; fret++) {
                        var note = computeNote(openNote, fret);
                        var role = noteRole(note);
                        if (role === 'none') continue;
                        var cx = leftPad + fret * cellW;
                        var fill = role === 'root' ? '#E8A33D' : '#4FA8A0';
                        var textColor = role === 'root' ? '#181410' : '#0c1a18';
                        svg += '<circle cx="' + cx + '" cy="' + y + '" r="10" fill="' + fill + '" stroke="#181410" stroke-width="1.5"></circle>';
                        svg += '<text x="' + cx + '" y="' + (y + 4) + '" text-anchor="middle" font-size="10" font-weight="700" ' +
                            'fill="' + textColor + '" font-family="Courier New, monospace">' + note + '</text>';
                    }
                }

                svg += '</svg>';
                return svg;
            }

            function renderPanelBody() {
                var wrap = document.getElementById('fe-board-wrap');
                if (wrap) wrap.innerHTML = renderFretboardSVG();
            }

            function buildRootOptions() {
                return FE_NOTES.map(function (n) {
                    return '<option value="' + n + '"' + (n === feState.root ? ' selected' : '') + '>' + n + '</option>';
                }).join('');
            }

            function buildScaleOptions() {
                var groups = { Common: [], Modes: [] };
                FE_SCALES.forEach(function (s) { groups[s.group].push(s); });
                var html = '';
                Object.keys(groups).forEach(function (g) {
                    html += '<optgroup label="' + g + '">';
                    groups[g].forEach(function (s) {
                        html += '<option value="' + s.key + '"' + (s.key === feState.scaleKey ? ' selected' : '') + '>' + feEscape(s.name) + '</option>';
                    });
                    html += '</optgroup>';
                });
                return html;
            }

            function buildOverlay() {
                var overlay = document.createElement('div');
                overlay.id = 'fe-overlay';
                overlay.innerHTML =
                    '<div class="fe-panel">' +
                    '<div class="fe-header"><h2>\uD83C\uDFB8 Scale / Fretboard Explorer</h2><button id="fe-close">\u2715</button></div>' +
                    '<div class="fe-controls">' +
                    '<label>Root Note<select id="fe-root">' + buildRootOptions() + '</select></label>' +
                    '<label>Scale / Mode<select id="fe-scale">' + buildScaleOptions() + '</select></label>' +
                    '</div>' +
                    '<div class="fe-board-wrap" id="fe-board-wrap"></div>' +
                    '<div class="fe-legend">' +
                    '<span><span class="fe-dot-key fe-root"></span>Root note</span>' +
                    '<span><span class="fe-dot-key fe-note"></span>Scale note</span>' +
                    '</div>' +
                    '</div>';
                document.body.appendChild(overlay);

                document.getElementById('fe-close').addEventListener('click', closePanel);
                overlay.addEventListener('click', function (e) { if (e.target === overlay) closePanel(); });
                document.getElementById('fe-root').addEventListener('change', function (e) {
                    feState.root = e.target.value;
                    renderPanelBody();
                });
                document.getElementById('fe-scale').addEventListener('change', function (e) {
                    feState.scaleKey = e.target.value;
                    renderPanelBody();
                });

                renderPanelBody();
            }

            function openPanel() {
                var overlay = document.getElementById('fe-overlay');
                if (!overlay) { buildOverlay(); overlay = document.getElementById('fe-overlay'); }
                overlay.classList.add('open');
            }

            function closePanel() {
                var overlay = document.getElementById('fe-overlay');
                if (overlay) overlay.classList.remove('open');
            }

            function init() {
                injectStyles();
                var fab = document.createElement('button');
                fab.id = 'fe-fab';
                fab.title = 'Scale / Fretboard Explorer';
                fab.innerHTML = '\uD83C\uDFB8';
                fab.addEventListener('click', openPanel);
                document.body.appendChild(fab);
                // If a song is already open at load time, start hidden — the app's
                // render() keeps it in sync from here on.
                if (document.querySelector('.song-title-row, .editor-wrap')) {
                    fab.style.display = 'none';
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
