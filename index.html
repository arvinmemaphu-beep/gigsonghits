<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gig Song Hits</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F0D0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gig Hits">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
  :root{
    --bg: #0F0D0B;
    --surface: #1C1815;
    --surface-2: #251F1A;
    --line: #34291f;
    --gold: #E8A33D;
    --gold-dim: #8a662a;
    --gold-light: #f2b559;
    --gold-rgb: 232,163,61;
    --teal: #4FA8A0;
    --teal-rgb: 79,168,160;
    --text: #F2EDE4;
    --muted: #9a8f80;
    --danger: #c96256;
    --on-accent: #181410;
  }
  /* ---- Color themes: applied via data-theme on <html> ---- */
  html[data-theme="daylight"]{
    --bg: #F7F3EC;
    --surface: #FFFFFF;
    --surface-2: #F1EAD9;
    --line: #E1D6BF;
    --gold: #B8792E;
    --gold-dim: #8a662a;
    --gold-light: #cf9247;
    --gold-rgb: 184,121,46;
    --teal: #1F8A82;
    --teal-rgb: 31,138,130;
    --text: #241C14;
    --muted: #79695A;
    --danger: #B23A2E;
    --on-accent: #FFFFFF;
  }
  html[data-theme="ocean"]{
    --bg: #0A1420;
    --surface: #122236;
    --surface-2: #1A3049;
    --line: #274865;
    --gold: #4EA1D4;
    --gold-dim: #336E90;
    --gold-light: #78bce4;
    --gold-rgb: 78,161,212;
    --teal: #3FD1C4;
    --teal-rgb: 63,209,196;
    --text: #EAF2FA;
    --muted: #8FA6BC;
    --danger: #E0665A;
    --on-accent: #0A1420;
  }
  html[data-theme="crimson"]{
    --bg: #180A0A;
    --surface: #261313;
    --surface-2: #321818;
    --line: #4A2424;
    --gold: #E8604E;
    --gold-dim: #8F362C;
    --gold-light: #f18978;
    --gold-rgb: 232,96,78;
    --teal: #E8B23D;
    --teal-rgb: 232,178,61;
    --text: #F7E9E6;
    --muted: #B08A85;
    --danger: #FF6B57;
    --on-accent: #180A0A;
  }
  html[data-theme="forest"]{
    --bg: #0A1710;
    --surface: #12261A;
    --surface-2: #183422;
    --line: #244A32;
    --gold: #4ED48A;
    --gold-dim: #2F8F5D;
    --gold-light: #79e3a8;
    --gold-rgb: 78,212,138;
    --teal: #E8C33D;
    --teal-rgb: 232,195,61;
    --text: #EAFBF0;
    --muted: #8FBBA0;
    --danger: #E0665A;
    --on-accent: #0A1710;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); height:100%; }
  body{
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% -10%, rgba(var(--gold-rgb), 0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(var(--teal-rgb), 0.08), transparent 40%);
  }
  #root{ min-height:100vh; }
  ::selection{ background: var(--gold); color:#141210; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--surface); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--gold-dim); }

  .app{ display:grid; grid-template-columns: 280px 1fr; height:100vh; height:100dvh; }
  @media (max-width: 800px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ display:none; }
    .sidebar.open{ display:flex; position:fixed; inset:0; z-index:40; height:100vh; height:100dvh; width:100vw; }
  }

  .sidebar{ background: var(--surface); border-right: 1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  .brand{ padding: 18px 16px 14px 16px; border-bottom: 1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .brand-mark{ display:flex; align-items:baseline; gap:6px; }
  .brand-mark .bolt{ color:var(--gold); font-size:20px; }
  .brand h1{ margin:0; font-size:20px; letter-spacing:1px; font-weight:700; text-transform:uppercase; }
  .brand p{ margin:4px 0 0; font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
  .brand-tuner-btn{ background:var(--gold); color:var(--on-accent); border:none; border-radius:7px; padding:8px 10px; font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap; flex-shrink:0; }
  .brand-btn-row{ display:flex; gap:6px; flex-shrink:0; }
  .brand-theme-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:7px; width:34px; height:34px; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand-theme-btn:hover{ border-color:var(--gold-dim); }
  .trademark{ position:fixed; bottom:8px; right:12px; font-size:10px; letter-spacing:2px; color:var(--gold-dim); text-transform:uppercase; z-index:5; pointer-events:none; opacity:0.85; }
  .theme-modal{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px 18px; width:280px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .theme-modal h3{ margin:0 0 4px; font-size:16px; color:var(--text); letter-spacing:0.5px; }
  .theme-modal .theme-sub{ margin:0 0 16px; font-size:11px; color:var(--muted); letter-spacing:0.5px; }
  .theme-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:16px; }
  .theme-swatch{ background: var(--surface-2); border:2px solid var(--line); border-radius:9px; padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .theme-swatch.active{ border-color: var(--gold); }
  .theme-swatch .dots{ display:flex; gap:4px; }
  .theme-swatch .dot{ width:14px; height:14px; border-radius:50%; }
  .theme-swatch .name{ font-size:11px; color:var(--text); letter-spacing:0.5px; }
  .theme-modal .close-btn{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:9px 20px; border-radius:6px; font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .theme-modal .close-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }

  .setlist-head{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px 8px; }
  .setlist-head span{ font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  .new-btn{ background: var(--gold); color:var(--on-accent); border:none; border-radius:4px; width:24px; height:24px; font-size:16px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; }
  .new-btn:hover{ background:var(--gold-light); }

  .song-list{ overflow-y:auto; flex:1; padding: 4px 8px 12px; }
  .song-item{ padding:10px 10px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; gap:2px; border:1px solid transparent; margin-bottom:3px; }
  .song-item:hover{ background: var(--surface-2); }
  .song-item.active{ background: rgba(var(--gold-rgb), 0.10); border-color: var(--gold-dim); }
  .song-item .t{ font-size:14px; font-weight:500; color:var(--text); }
  .song-item .k{ font-size:11px; color:var(--teal); letter-spacing:1px; }
  .empty-hint{ padding: 20px 16px; color:var(--muted); font-size:12px; line-height:1.6; }

  .folder-card{ display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-bottom:5px; }
  .folder-card:hover{ background: var(--surface-2); border-color: var(--line); }
  .folder-card .ico{ font-size:18px; }
  .folder-card .info{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .folder-card .name{ font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-card .count{ font-size:11px; color:var(--muted); letter-spacing:0.5px; }
  .folder-card.all{ background: rgba(var(--teal-rgb), 0.08); border-color: rgba(var(--teal-rgb), 0.25); }
  .folder-card.all .ico{ color: var(--teal); }
  .folder-actions{ display:flex; gap:4px; flex-shrink:0; }
  .folder-action-btn{ background:transparent; border:1px solid var(--line); color:var(--muted); width:26px; height:26px; border-radius:5px; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .folder-action-btn:hover{ border-color: var(--gold-dim); color: var(--gold); background: rgba(var(--gold-rgb), 0.08); }
  .folder-action-btn.danger:hover{ border-color: var(--danger); color: var(--danger); background: rgba(201,98,86,0.10); }
  .folder-card.renaming{ cursor:default; }
  .rename-folder-input{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); border-radius:5px; padding:6px 8px; font-size:13px; }
  .rename-folder-input:focus{ outline:none; border-color: var(--gold); }

  .search-row{ position:relative; padding: 8px 12px 6px; }
  .search-row input[type="search"]{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 30px 8px 10px; font-size:13px; }
  .search-row input[type="search"]::-webkit-search-cancel-button{ display:none; }
  .search-row input[type="search"]:focus{ outline:none; border-color:var(--gold-dim); }
  .search-row input[type="search"]::placeholder{ color:var(--muted); }
  .search-clear{ position:absolute; right:18px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); font-size:13px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .search-clear:hover{ color:var(--gold); background:rgba(var(--gold-rgb), 0.12); }

  .folder-header{ display:flex; align-items:center; gap:8px; padding: 12px 12px 8px; }
  .back-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:28px; height:28px; border-radius:6px; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .back-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .folder-header .fname{ font-size:14px; font-weight:600; letter-spacing:0.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-header .fcount{ font-size:11px; color:var(--muted); }

  .add-folder-row{ display:flex; gap:6px; padding: 8px 10px 4px; }
  .add-folder-row input{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:7px 8px; font-size:12px; }
  .add-folder-row input:focus{ outline:none; border-color:var(--gold-dim); }
  .add-folder-row button{ background:var(--gold); color:var(--on-accent); border:none; border-radius:5px; padding:0 10px; font-size:11px; font-weight:700; }
  .add-folder-row .cancel-x{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }

  .sidebar-foot{ border-top:1px solid var(--line); padding:10px; display:flex; gap:8px; background:var(--surface); position:sticky; bottom:0; flex-shrink:0; }
  .foot-btn{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:9px 4px; border-radius:5px; }
  .foot-btn:hover{ border-color: var(--gold-dim); color:var(--gold); }

  .main{ display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding: 10px 18px; border-bottom:1px solid var(--line); background:var(--surface); }
  .mobile-toggle{ display:none; background:none; border:1px solid var(--line); color:var(--text); border-radius:5px; width:34px; height:34px; }
  @media (max-width:800px){ .mobile-toggle{ display:block; } }

  .tool-group{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px; }
  .tool-btn{ background:transparent; border:none; color:var(--text); width:30px; height:30px; border-radius:5px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .tool-btn:hover{ background: rgba(var(--gold-rgb), 0.15); color:var(--gold); }
  .tool-btn.on{ background: var(--gold); color:var(--on-accent); }
  .tool-btn.wide{ width:auto; padding:0 10px; font-size:11px; letter-spacing:1px; }
  .key-display{ min-width:52px; text-align:center; font-family:'Courier New',monospace; font-weight:700; color:var(--gold); font-size:13px; letter-spacing:1px; }

  .spacer{ flex:1; }
  .label-sm{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-right:2px; }
  .speed-slider{ width:80px; accent-color: var(--gold); }
  .fontsize-slider{ width:70px; accent-color: var(--teal); }

  .icon-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 12px; font-size:11px; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .icon-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }

  .stage{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding: 28px 40px 200px; touch-action: pan-y; }
  @media (max-width:800px){ .stage{ padding: 20px 16px 200px; } }

  .song-title-row{ display:flex; align-items:baseline; gap:14px; margin-bottom:4px; flex-wrap:wrap; }
  .main-title{ font-size:30px; font-weight:700; letter-spacing:0.5px; }
  input.title-input{ background:none; border:none; color:var(--text); font-family:inherit; font-size:30px; font-weight:700; letter-spacing:0.5px; padding:2px 0; border-bottom:2px solid transparent; max-width: 100%; width:100%; }
  input.title-input:focus{ outline:none; border-bottom-color: var(--gold-dim); }
  .song-meta{ display:flex; gap:16px; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin-bottom:22px; align-items:center; }
  .song-meta input{ background:none; border:none; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; width:60px; border-bottom:1px dashed var(--line); }
  .song-meta input:focus{ outline:none; color:var(--teal); }
  .bpm-input{ background: var(--surface-2) !important; border:1px solid var(--teal) !important; color: var(--teal) !important; border-radius:6px; padding:6px 8px !important; width:56px !important; }
  .bpm-input:focus{ outline:none; border-color: var(--teal) !important; color: var(--text) !important; }
  .folder-select{ background: var(--surface-2); border:1px solid var(--gold-dim); color: var(--gold); font-family:inherit; font-size:12px; letter-spacing:0.5px; text-transform:uppercase; padding:6px 8px; border-radius:6px; max-width:150px; }
  .folder-select:focus{ outline:none; border-color: var(--gold); }
  .folder-new-row{ display:inline-flex; gap:6px; align-items:center; }
  .folder-new-row input{ background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); border-radius:5px; padding:6px 8px; font-size:12px; text-transform:none; letter-spacing:normal; width:110px; }
  .folder-new-row button{ background:var(--gold); color:var(--on-accent); border:none; border-radius:5px; padding:6px 9px; font-size:11px; font-weight:700; }
  .folder-new-row .cancel-x{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); padding:6px 9px; }

  .chart{ font-family: 'Roboto Mono', 'DejaVu Sans Mono', 'Consolas', 'Menlo', monospace; line-height: 2.15; white-space: normal; overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
  .chord-line{ color: var(--gold); font-weight:700; letter-spacing:0.5px; }
  .lyric-line{ color: var(--text); }
  .chord-tok{ background: rgba(var(--gold-rgb), 0.14); color:var(--gold); padding:1px 5px; border-radius:4px; display:inline-block; margin-right:2px; font-weight:700; cursor:pointer; transition: background 0.12s, transform 0.12s; }
  .chord-tok:hover{ background: rgba(var(--gold-rgb), 0.32); transform: translateY(-1px); }
  .blank-line{ height: 0.6em; }
  /* Chord+lyric pairing: each chord is grouped with the exact syllable/word it sits
     above into one atomic flex unit, so when the line wraps (narrow screen, pinch
     zoom, bigger font size) the chord always stays glued to its correct syllable
     instead of the chord row and lyric row drifting apart independently. */
  .chord-pair-line{ display:flex; flex-wrap:wrap; align-items:flex-end; row-gap:6px; column-gap:2px; margin:0; max-width:100%; }
  .cw-unit{ display:inline-flex; flex-direction:column; align-items:flex-start; max-width:100%; }
  .cw-chord{ min-height:1.3em; line-height:1.3; color:var(--gold); font-weight:700; letter-spacing:0.5px; overflow-wrap:break-word; word-break:break-word; }
  .cw-lyric{ line-height:1.3; color:var(--text); overflow-wrap:break-word; word-break:break-word; }
  .cw-marker{ color:var(--muted); font-weight:700; }

  .chord-modal{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 24px 18px; width:220px; text-align:center; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .chord-modal h3{ margin:0 0 2px; font-size:24px; color:var(--gold); letter-spacing:0.5px; }
  .chord-modal .approx-note{ margin:0 0 10px; font-size:10px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; }
  .chord-modal .diagram-wrap{ display:flex; justify-content:center; margin: 6px 0 14px; }
  .chord-modal .close-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:8px 20px; border-radius:6px; font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .chord-modal .close-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .chord-modal .inst-toggle{ display:flex; justify-content:center; gap:6px; margin:0 0 10px; }
  .chord-modal .inst-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:5px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
  .chord-modal .inst-btn:hover{ border-color:var(--gold-dim); }
  .chord-modal .inst-btn.on{ background:var(--gold); border-color:var(--gold); color:var(--on-accent); font-weight:700; }

  .tuner-modal{ background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px 28px 22px; width:420px; max-width:92vw; text-align:center; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .tuner-modal h3{ margin:0 0 12px; font-size:18px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text); }
  .tuner-inst-toggle{ display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:4px; margin-bottom:16px; }
  .tuner-inst-toggle button{ flex:1; background:transparent; border:none; color:var(--muted); padding:9px 4px; border-radius:6px; font-size:13px; letter-spacing:1px; text-transform:uppercase; font-weight:600; }
  .tuner-inst-toggle button.on{ background:var(--gold); color:var(--on-accent); }
  .tuner-readout{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:18px 12px 14px; margin-bottom:14px; min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .tuner-gauge-wrap{ position:relative; width:240px; max-width:100%; margin:0 auto; }
  .tuner-gauge-svg{ width:100%; height:auto; display:block; overflow:visible; }
  .tuner-gauge-note{ position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); font-size:52px; font-weight:800; color:var(--gold); line-height:1; font-family:'Roboto Mono',monospace; }
  .tuner-gauge-note.flat{ color:#f2c94c; }
  .tuner-gauge-note.sharp{ color:#e5484d; }
  .tuner-gauge-note.in-tune{ color:#3fd66b; }
  .tuner-gauge-note.in-tune{ animation: tunerPulse 0.6s ease-in-out; }
  @keyframes tunerPulse{ 0%{ transform:translateX(-50%) scale(1); } 40%{ transform:translateX(-50%) scale(1.12); } 100%{ transform:translateX(-50%) scale(1); } }
  .tuner-needle-line{ stroke:var(--muted); transition: transform 0.28s ease-out, stroke 0.25s linear; transform-origin: 110px 110px; }
  .tuner-needle-line.in-tune{ stroke:#3fd66b; }
  .tuner-needle-line.flat{ stroke:#f2c94c; }
  .tuner-needle-line.sharp{ stroke:#e5484d; }
  circle.tuner-needle-line{ fill:var(--muted); transition: fill 0.25s linear; }
  circle.tuner-needle-line.in-tune{ fill:#3fd66b; }

                // Confirmation "ding" only once the reading holds truly steady in-tune
                // for a solid stretch (not just a quick pass-through while tuning up from
                // way off) \u2014 avoids a false beep from a momentary/noisy green blip,
                // mirroring how a physical clip-on tuner lights up/rings when locked in.
                if (stateClass === 'in-tune') {
                    tunerInTuneStreak++;
                    if (tunerInTuneStreak >= 7 && !tunerChimePlayed) {
                        tunerChimePlayed = true;
                        playInTuneChime();
                    }
                } else {
                    tunerInTuneStreak = 0;
                    tunerChimePlayed = false;
                }

                document.querySelectorAll('.tuner-string-btn').forEach(function (btn) {
                    if (nearest && btn.getAttribute('data-string') === nearest.name) {
                        btn.classList.add('active-string');
                    } else {
                        btn.classList.remove('active-string');
                    }
                });
            }

            function playReferenceTone(freq) {
                stopReferenceTone();
                try {
                    var AC = window.AudioContext || window.webkitAudioContext;
                    if (!tunerAudioCtx || tunerAudioCtx.state === 'closed') tunerAudioCtx = new AC();
                    var osc = tunerAudioCtx.createOscillator();
                    var gain = tunerAudioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.value = 0.0001;
                    osc.connect(gain);
                    gain.connect(tunerAudioCtx.destination);
                    var now = tunerAudioCtx.currentTime;
                    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
                    osc.start(now);
                    osc.stop(now + 1.5);
                    tunerRefOsc = osc;
                    tunerRefOscTimeout = setTimeout(function () { tunerRefOsc = null; }, 1550);
                } catch (e) { }
            }

            function stopReferenceTone() {
                if (tunerRefOscTimeout) { clearTimeout(tunerRefOscTimeout); tunerRefOscTimeout = null; }
                if (tunerRefOsc) { try { tunerRefOsc.stop(); } catch (e) { } tunerRefOsc = null; }
            }

            // Short two-note "ding" played once a reading has held steady in-tune,
            // like the confirmation beep/light on a physical clip-on tuner. Louder
            // and fuller than the reference tone so it clearly stands out as the
            // "you're in tune now" signal.
            function playInTuneChime() {
                try {
                    var AC = window.AudioContext || window.webkitAudioContext;
                    if (!tunerAudioCtx || tunerAudioCtx.state === 'closed') tunerAudioCtx = new AC();
                    var ctx = tunerAudioCtx;
                    var now = ctx.currentTime;
                    [[1046.50, now], [1568.00, now + 0.09]].forEach(function (pair) {
                        var osc = ctx.createOscillator();
                        var gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = pair[0];
                        gain.gain.value = 0.0001;
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        var t = pair[1];
                        gain.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
                        osc.start(t);
                        osc.stop(t + 0.51);
                    });
                } catch (e) { }
            }

            function getActiveSong() {
                if (!state.songs) return null;
                for (var i = 0; i < state.songs.length; i++) { if (state.songs[i].id === state.activeId) return state.songs[i]; }
                return null;
            }

            // Local (device) storage: this is the primary store so the app works fully
            // offline / standalone (installed PWA or APK), where window.storage is not available.
            var LS_PREFIX = 'gigsonghits:';
            function lsGet(key) {
                try {
                    var raw = localStorage.getItem(LS_PREFIX + key);
                    return raw === null ? null : { key: key, value: raw };
                } catch (e) { return null; }
            }
            function lsSet(key, value) {
                try { localStorage.setItem(LS_PREFIX + key, value); return { key: key, value: value }; }
                catch (e) { return null; }
            }
            function lsDelete(key) {
                try { localStorage.removeItem(LS_PREFIX + key); return { key: key, deleted: true }; }
                catch (e) { return null; }
            }

            // Claude-artifact storage (window.storage) is used opportunistically as an extra
            // sync layer when this file happens to run inside a Claude.ai preview; it is never
            // required, so the app works the same standalone (browser, PWA, APK).
            async function safeStorageGet(key) {
                var local = lsGet(key);
                if (local) return local;
                try {
                    if (window.storage) {
                        var r = await window.storage.get(key);
                        if (r) return r;
                    }
                } catch (e) { }
                return null;
            }
            async function safeStorageSet(key, value) {
                var res = lsSet(key, value);
                try { if (window.storage) await window.storage.set(key, value); } catch (e) { }
                return res;
            }
            async function safeStorageDelete(key) {
                var res = lsDelete(key);
                try { if (window.storage) await window.storage.delete(key); } catch (e) { }
                return res;
            }

            async function persistIndex(list) {
                await safeStorageSet('song-index', JSON.stringify(list.map(function (s) { return s.id; })));
            }
            async function persistSong(song) {
                await safeStorageSet('song:' + song.id, JSON.stringify(song));
            }
            async function persistFolderList() {
                await safeStorageSet('folder-list', JSON.stringify(state.folderList));
            }

            function applyThemeToDocument(themeId) {
                if (themeId && themeId !== 'default') {
                    document.documentElement.setAttribute('data-theme', themeId);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            }

            async function setTheme(themeId) {
                state.theme = themeId;
                state.themeModalOpen = false;
                applyThemeToDocument(themeId);
                await safeStorageSet('theme', themeId);
                render();
            }

            function setChordInstrument(instrument) {
                if (instrument !== 'guitar' && instrument !== 'ukulele') return;
                state.chordInstrument = instrument;
                try { localStorage.setItem('gigsonghits:chordInstrument', instrument); } catch (e) { }
                render();
            }

            async function loadTheme() {
                var saved = null;
                try { saved = localStorage.getItem('gigsonghits:theme'); } catch (e) { }
                if (!saved) {
                    var r = await safeStorageGet('theme');
                    if (r && r.value) saved = r.value;
                }
                if (saved) {
                    state.theme = saved;
                    applyThemeToDocument(saved);
                }
            }

            // Union of the persisted folder list and any folder names in use by songs,
            // so a folder never "disappears" even if it wasn't explicitly created first.
            function getFolders() {
                var names = state.folderList.slice();
                state.songs.forEach(function (s) {
                    var f = s.folder || 'Gig';
                    if (names.indexOf(f) === -1) names.push(f);
                });
                return names;
            }

            async function ensureFolder(name) {
                var trimmed = (name || '').trim();
                if (!trimmed) return;
                if (state.folderList.indexOf(trimmed) === -1) {
                    state.folderList.push(trimmed);
                    await persistFolderList();
                }
            }

            async function loadSongs() {
                var flRes = await safeStorageGet('folder-list');
                try {
                    var fl = flRes && flRes.value ? JSON.parse(flRes.value) : null;
                    if (fl && fl.length) state.folderList = fl;
                    else await persistFolderList(); // seed defaults on first run
                } catch (e) { await persistFolderList(); }

                var idxRes = await safeStorageGet('song-index');
                var ids = [];
                try { ids = idxRes && idxRes.value ? JSON.parse(idxRes.value) : []; } catch (e) { ids = []; }

                if (!ids || ids.length === 0) {
                    var id = uid();
                    var song = { id: id, title: "Ate", key: "G", bpm: "", folder: "Gig", body: SAMPLE_BODY };
                    await persistSong(song);
                    await persistIndex([song]);
                    state.songs = [song];
                    state.activeId = null;
                    render();
                    return;
                }

                var loaded = [];
                for (var i = 0; i < ids.length; i++) {
                    var r = await safeStorageGet('song:' + ids[i]);
                    if (r && r.value) {
                        try {
                            var parsed = JSON.parse(r.value);
                            if (!parsed.folder) parsed.folder = 'Gig'; // migrate older songs saved before folders existed
                            loaded.push(parsed);
                        } catch (e) { }
                    }
                }
                if (loaded.length === 0) {
                    var id2 = uid();
                    var song2 = { id: id2, title: "Ate", key: "G", bpm: "", folder: "Gig", body: SAMPLE_BODY };
                    loaded = [song2];
                    await persistSong(song2);
                    await persistIndex(loaded);
                }
                state.songs = loaded;
                state.activeId = null;
                render();
            }

            function showToast(msg) {
                var el = document.getElementById('toast');
                if (!el) return;
                el.textContent = msg;
                el.style.display = 'block';
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2200);
            }

            async function updateActiveSong(patch) {
                var song = getActiveSong();
                if (!song) return;
                Object.assign(song, patch);
                await persistSong(song);
            }

            async function createSong() {
                var wasAllSongs = state.currentFolder === null && state.sidebarView === 'folderSongs';
                var targetFolder = state.currentFolder || 'Gig';
                var song = { id: uid(), title: "Untitled Song", key: "C", bpm: "", folder: targetFolder, body: "[C]Type your lyrics and [G]chords here\nUse brackets like [Am] before the [F]syllable" };
                state.songs.unshift(song);
                state.activeId = song.id;
                state.mode = 'edit';
                state.transposeSteps = 0;
                state.sidebarView = 'folderSongs';
                if (!wasAllSongs) state.currentFolder = targetFolder;
                await ensureFolder(targetFolder);
                await persistSong(song);
                await persistIndex(state.songs);
                render();
                focusTitleInput();
            }

            async function deleteSong(id) {
                state.songs = state.songs.filter(function (s) { return s.id !== id; });
                await safeStorageDelete('song:' + id);
                await persistIndex(state.songs);
                if (state.activeId === id) {
                    state.activeId = state.songs.length ? state.songs[0].id : null;
                    state.transposeSteps = 0;
                }
                state.confirmDelete = null;
                render();
                showToast('Song removed');
            }

            function selectSong(id) {
                state.activeId = id;
                state.mode = 'view';
                state.transposeSteps = 0;
                state.sidebarOpen = false;
                state.autoScroll = false;
                state.scrollStarted = false;
                state.editorNewFolder = false;
                stopAutoScroll();
                stopCountdown();
                var s = getActiveSong();
                if (s) {
                    // Per-song memory: restore the speed and count-in last used with this song
                    // (falls back to BPM-derived speed for songs without saved settings).
                    if (typeof s.scrollSpeed === 'number' && s.scrollSpeed >= 1 && s.scrollSpeed <= 15) {
                        state.scrollSpeed = s.scrollSpeed;
                    } else {
                        var sp = computeScrollSpeedFromBpm(s.bpm);
                        if (sp) state.scrollSpeed = sp;
                    }
                    if (typeof s.countIn === 'number' && s.countIn >= 0 && s.countIn <= 15) {
                        state.countInSeconds = s.countIn;
                    }
                }
                render();
            }

            function openFolder(name) {
                state.currentFolder = name === '__all__' ? null : name;
                state.sidebarView = 'folderSongs';
                render();
            }

            // Used when a song is tapped from the cross-folder search results shown at
            // the folders root — lands the sidebar inside that song's folder so the
            // view stays coherent if the search box is cleared afterwards.
            function selectSongFromSearch(id, folder) {
                state.currentFolder = folder;
                state.sidebarView = 'folderSongs';

            function backToFolders() {
                state.sidebarView = 'folders';
                state.addingFolder = false;
                render();
            }

            // ---- Sidebar search (All Songs + Folders) ----
            function buildSearchRowHtml() {
                var q = state.searchQuery || '';
                var html = '  <div class="search-row"><input type="search" id="sidebar-search" placeholder="\uD83D\uDD0D Maghanap ng kanta o folder..." value="' + escapeHtml(q) + '" autocomplete="off" />';
                if (q) html += '<button class="search-clear" id="btn-search-clear" title="I-clear">\u2715</button>';
                html += '</div>';
                return html;
            }

            function buildSidebarListHtml() {
                var q = (state.searchQuery || '').trim().toLowerCase();
                var html = '';
                if (state.sidebarView === 'folders') {
                    if (q) {
                        var matches = state.songs.filter(function (s) {
                            return (s.title || '').toLowerCase().indexOf(q) !== -1 ||
                                (s.key || '').toLowerCase().indexOf(q) !== -1 ||
                                (s.folder || 'Gig').toLowerCase().indexOf(q) !== -1;
                        });
                        if (matches.length === 0) {
                            html += '<div class="empty-hint">Walang nahanap na kantang tugma sa \u201c' + escapeHtml(state.searchQuery.trim()) + '\u201d.</div>';

                                var s = matches[i];
