                                html += '  <span class="t">' + escapeHtml(s.title || 'Untitled') + '</span>';
                                html += '  <span class="k">Key ' + escapeHtml(s.key || '\u2014') + ' \u00b7 \uD83D\uDCC1 ' + escapeHtml(s.folder || 'Gig') + '</span>';
                                html += '</div>';
                            }
                        }
                        return html;
                    }
                    var folders = getFolders();
                    var totalCount = state.songs.length;
                    html += '    <div class="folder-card all" data-folder="__all__"><span class="ico">\uD83C\uDFB5</span><div class="info"><span class="name">All Songs</span><span class="count">' + totalCount + ' song' + (totalCount === 1 ? '' : 's') + '</span></div></div>';
                    folders.forEach(function (f) {
                        var count = state.songs.filter(function (s) { return (s.folder || 'Gig') === f; }).length;
                        if (state.renamingFolder === f) {
                            html += '    <div class="folder-card renaming" data-folder="' + escapeHtml(f) + '"><span class="ico">\uD83D\uDCC1</span><input id="rename-folder-input" class="rename-folder-input" value="' + escapeHtml(f) + '" maxlength="40" /><div class="folder-actions"><button class="folder-action-btn" data-rename-confirm="' + escapeHtml(f) + '" title="Save">\u2713</button><button class="folder-action-btn" data-rename-cancel="1" title="Cancel">\u2715</button></div></div>';
                        } else {
                            html += '    <div class="folder-card" data-folder="' + escapeHtml(f) + '"><span class="ico">\uD83D\uDCC1</span><div class="info"><span class="name">' + escapeHtml(f) + '</span><span class="count">' + count + ' song' + (count === 1 ? '' : 's') + '</span></div><div class="folder-actions"><button class="folder-action-btn" data-rename="' + escapeHtml(f) + '" title="Rename">\u270E</button><button class="folder-action-btn danger" data-delfolder="' + escapeHtml(f) + '" title="Delete">\uD83D\uDDD1\uFE0F</button></div></div>';
                        }
                    });
                    return html;
                }

                var folderSongs = state.currentFolder ? state.songs.filter(function (s) { return (s.folder || 'Gig') === state.currentFolder; }) : state.songs;
                if (q) {
                    folderSongs = folderSongs.filter(function (s) {
                        return (s.title || '').toLowerCase().indexOf(q) !== -1 || (s.key || '').toLowerCase().indexOf(q) !== -1;
                    });
                }
                if (folderSongs.length === 0) {
                    html += '<div class="empty-hint">' + (q ? 'Walang nahanap na kantang tugma sa \u201c' + escapeHtml(state.searchQuery.trim()) + '\u201d.' : 'Wala pang kanta dito. Pindutin ang + para gumawa, o mag-import ng file sa ibaba.') + '</div>';
                } else {
                    for (var j = 0; j < folderSongs.length; j++) {
                        var s2 = folderSongs[j];
                        html += '<div class="song-item' + (s2.id === state.activeId ? ' active' : '') + '" data-id="' + s2.id + '">';
                        html += '  <span class="t">' + escapeHtml(s2.title || 'Untitled') + '</span>';
                        html += '  <span class="k">Key ' + escapeHtml(s2.key || '\u2014') + (s2.bpm ? ' \u00b7 ' + escapeHtml(s2.bpm) + ' bpm' : '') + '</span>';
                        html += '</div>';
                    }
                }
                return html;
            }

            // Rebuilds just the #sidebar-list contents (and the search box's clear
            // button + the folder header's song count) so typing in the search input
            // never re-renders the input itself and never loses focus/cursor position.
            function refreshSidebarList() {
                var listEl = document.getElementById('sidebar-list');
                if (!listEl) return;
                listEl.innerHTML = buildSidebarListHtml();
                bindSidebarListHandlers();

                var searchRow = document.querySelector('.search-row');
                if (searchRow) {
                    var existingClear = document.getElementById('btn-search-clear');
                    var shouldHaveClear = !!(state.searchQuery && state.searchQuery.length);
                    if (shouldHaveClear && !existingClear) {
                        var btn = document.createElement('button');
                        btn.className = 'search-clear'; btn.id = 'btn-search-clear'; btn.title = 'I-clear'; btn.textContent = '\u2715';
                        btn.onclick = function () { state.searchQuery = ''; render(); var si = document.getElementById('sidebar-search'); if (si) si.focus(); };
                        searchRow.appendChild(btn);
                    } else if (!shouldHaveClear && existingClear) {
                        existingClear.remove();
                    }
                }

                if (state.sidebarView === 'folderSongs') {
                    var fcountEl = document.querySelector('.folder-header .fcount');
                    if (fcountEl) {
                        var q = (state.searchQuery || '').trim().toLowerCase();
                        var all = state.currentFolder ? state.songs.filter(function (s) { return (s.folder || 'Gig') === state.currentFolder; }) : state.songs;
                        var shown = q ? all.filter(function (s) { return (s.title || '').toLowerCase().indexOf(q) !== -1 || (s.key || '').toLowerCase().indexOf(q) !== -1; }) : all;
                        fcountEl.textContent = shown.length;
                    }
                }
            }

            // Click handlers for elements inside #sidebar-list — split out from
            // attachHandlers() so refreshSidebarList() can rebind after a soft update.
            function bindSidebarListHandlers() {
                var byId = function (id) { return document.getElementById(id); };

                var folderCards = document.querySelectorAll('.folder-card');
                folderCards.forEach(function (el) {
                    if (el.classList.contains('renaming')) return;
                    el.onclick = function () { openFolder(el.getAttribute('data-folder')); };
                });

                var renameBtns = document.querySelectorAll('[data-rename]');
                renameBtns.forEach(function (btn) {
                    btn.onclick = function (e) { e.stopPropagation(); startRenameFolder(btn.getAttribute('data-rename')); };
                });
                var delFolderBtns = document.querySelectorAll('[data-delfolder]');
                delFolderBtns.forEach(function (btn) {
                    btn.onclick = function (e) { e.stopPropagation(); requestDeleteFolder(btn.getAttribute('data-delfolder')); };
                });
                var renameConfirmBtns = document.querySelectorAll('[data-rename-confirm]');
                renameConfirmBtns.forEach(function (btn) {
                    btn.onclick = function (e) {
                        e.stopPropagation();
                        var inp = byId('rename-folder-input');
                        renameFolder(btn.getAttribute('data-rename-confirm'), inp ? inp.value : '');
                    };
                });
                var renameCancelBtns = document.querySelectorAll('[data-rename-cancel]');
                renameCancelBtns.forEach(function (btn) {
                    btn.onclick = function (e) { e.stopPropagation(); cancelRenameFolder(); };
                });
                var renameFolderInput = byId('rename-folder-input');
                if (renameFolderInput) {
                    renameFolderInput.onclick = function (e) { e.stopPropagation(); };
                    renameFolderInput.onkeydown = function (e) {
                        if (e.key === 'Enter') { e.preventDefault(); renameFolder(state.renamingFolder, renameFolderInput.value); }
                        if (e.key === 'Escape') { cancelRenameFolder(); }
                    };
                }

                var items = document.querySelectorAll('.song-item');
                items.forEach(function (el) {
                    el.onclick = function () {
                        var sf = el.getAttribute('data-search-folder');
                        if (sf) selectSongFromSearch(el.getAttribute('data-id'), sf);
                        else selectSong(el.getAttribute('data-id'));
                    };
                });
            }

            async function confirmAddFolder() {
                var input = document.getElementById('new-folder-input');
                if (!input) return;
                var name = input.value.trim();
                if (!name) { state.addingFolder = false; render(); return; }
                await ensureFolder(name);
                state.addingFolder = false;
                render();
                showToast('Folder "' + name + '" added');
            }

            function startRenameFolder(name) {
                state.renamingFolder = name;
                state.addingFolder = false;
                render();
                setTimeout(function () {
                    var inp = document.getElementById('rename-folder-input');
                    if (inp) { inp.focus(); inp.select(); }
                }, 30);
            }

            function cancelRenameFolder() {
                state.renamingFolder = null;
                render();
            }

            // Renaming updates the folder-list entry (or merges into an existing folder of
            // the target name) and re-tags every song currently filed under the old name.
            async function renameFolder(oldName, newName) {
                var trimmed = (newName || '').trim();
                if (!trimmed || trimmed === oldName) { state.renamingFolder = null; render(); return; }

                var idx = state.folderList.indexOf(oldName);
                if (idx !== -1) {
                    if (state.folderList.indexOf(trimmed) === -1) {
                        state.folderList[idx] = trimmed;
                    } else {
                        // Target name already exists as a folder — merge by dropping the old entry.
                        state.folderList.splice(idx, 1);
                    }
                } else {
                    await ensureFolder(trimmed);
                }
                await persistFolderList();

                for (var i = 0; i < state.songs.length; i++) {
                    var s = state.songs[i];
                    if ((s.folder || 'Gig') === oldName) {
                        s.folder = trimmed;
                        await persistSong(s);
                    }
                }
                if (state.currentFolder === oldName) state.currentFolder = trimmed;
                state.renamingFolder = null;
                render();
                showToast('Napalitan ang pangalan sa "' + trimmed + '"');
            }

            function requestDeleteFolder(name) {
                state.confirmDeleteFolder = name;
                render();
            }

            function cancelDeleteFolder() {
                state.confirmDeleteFolder = null;
                render();
            }

            // Deleting a folder never deletes songs — any song still filed under it gets
            // moved to "Gig" so nothing accidentally disappears.
            async function deleteFolderConfirmed() {
                var name = state.confirmDeleteFolder;
                if (!name) return;
                var moved = 0;
                for (var i = 0; i < state.songs.length; i++) {
                    var s = state.songs[i];
                    if ((s.folder || 'Gig') === name && name !== 'Gig') {
                        s.folder = 'Gig';
                        moved++;
                        await persistSong(s);
                    }
                }
                state.folderList = state.folderList.filter(function (f) { return f !== name; });
                await persistFolderList();
                if (state.currentFolder === name) state.currentFolder = null;
                state.confirmDeleteFolder = null;
                render();
                showToast(moved > 0 ? ('Tinanggal ang folder. ' + moved + ' kanta inilipat sa "Gig"') : 'Tinanggal ang folder');
            }

            async function handleImportFile(e) {
                var file = e.target.files[0];
                if (!file) return;
                var name = file.name || '';
                var targetFolder = state.currentFolder || 'Gig';

                try {
                    if (/\.json$/i.test(name)) {
                        var jsonText = await file.text();
                        var jsonResult = await importContentAsSong(jsonText, name, 'application/json', state.currentFolder);
                        if (jsonResult.kind === 'multi' && jsonResult.firstId) {
                            state.activeId = jsonResult.firstId; state.mode = 'view'; state.transposeSteps = 0;
                        }
                        state.sidebarView = 'folderSongs';
                        state.currentFolder = targetFolder;
                        render();
                        showToast('\u2713 Na-import ang ' + jsonResult.count + ' kanta mula sa JSON');
                    } else if (/\.(docx|pptx)$/i.test(name)) {
                        var buf = await file.arrayBuffer();
                        var parsed = await parseOfficeBuffer(buf, name);
                        var officeTitle = parsed.title || name.replace(/\.(docx|pptx)$/i, '');
                        var officeResult = await addSingleSongToApp(officeTitle, parsed.text, null, state.currentFolder);
                        state.activeId = officeResult.id; state.mode = 'view'; state.transposeSteps = 0;
                        state.sidebarView = 'folderSongs';
                        state.currentFolder = targetFolder;
                        render();
                        showToast('\u2713 Na-import na: "' + officeTitle + '"');
                    } else if (/\.html?$/i.test(name)) {
                        var htmlText = await file.text();
                        var extracted = extractTextFromHtml(htmlText);
                        var htmlTitle = extracted.title || name.replace(/\.html?$/i, '');
                        if (!extracted.text || !extracted.text.trim()) throw new Error('empty');
                        var htmlResult = await addSingleSongToApp(htmlTitle, extracted.text, null, state.currentFolder);
                        state.activeId = htmlResult.id; state.mode = 'view'; state.transposeSteps = 0;
                        state.sidebarView = 'folderSongs';
                        state.currentFolder = targetFolder;
                        render();
                        showToast('\u2713 Na-import na: "' + htmlTitle + '"');
                    } else {
                        // Plain text / chord-sheet fallback: .txt, .cho, .chopro, .crd, or unknown.
                        var text = await file.text();
                        var title = name.replace(/\.(txt|cho|chopro|crd)$/i, '');
                        var result = await addSingleSongToApp(title, text, null, state.currentFolder);
                        state.activeId = result.id; state.mode = 'view'; state.transposeSteps = 0;
                        state.sidebarView = 'folderSongs';
                        state.currentFolder = targetFolder;
                        render();
                        showToast('\u2713 Na-import na: "' + title + '"');
                    }
                } catch (err) {
                    var msg = 'Hindi ma-import ang file.';
                    if (err && err.message === 'jszip-missing') msg = 'Hindi pa handa ang Word/PowerPoint reader, subukan ulit pagkatapos ng ilang segundo.';
                    else if (err && err.message === 'bad-office-file') msg = 'Hindi ma-basa ang Word file na ito, baka sira o hindi tunay na .docx.';
                    else if (err && err.message === 'unsupported-office') msg = 'Hindi supported ang file type na ito.';
                    else if (err && err.message === 'empty') msg = 'Walang laman ang file na ito.';
                    else if (err && err.message === 'invalid-json') msg = 'Hindi valid na JSON setlist ang file na ito.';
                    showToast(msg);
                }
                e.target.value = '';
            }

            function openUrlImport() {
                state.urlImportOpen = true;
                state.urlImportError = null;
                render();
                focusUrlInput();
            }

            function closeUrlImport() {
                state.urlImportOpen = false;
                state.urlImportBusy = false;
                state.urlImportError = null;
                render();
            }

            function focusUrlInput() {
                setTimeout(function () {
                    var el = document.getElementById('url-import-input');
                    if (el) el.focus();
                }, 30);
            }

            function filenameFromUrl(url) {
                try {
                    var urlObj = new URL(url);
                    var parts = urlObj.pathname.split('/').filter(Boolean);
                    if (parts.length) {
                        var last = decodeURIComponent(parts[parts.length - 1]).replace(/\.(txt|cho|chopro|crd|html?)$/i, '');
                        if (last) return last;
                    }
                } catch (e) { }
                return 'Imported Song';
            }

            function decodeHtmlEntities(str) {
                var ta = document.createElement('textarea');
                ta.innerHTML = str;
                return ta.value;
            }

            function extractTextFromHtml(html) {
                var titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
                var pageTitle = titleMatch ? decodeHtmlEntities(titleMatch[1]).trim() : null;
                var cleaned = html
                    .replace(/<head[\s\S]*?<\/head>/i, '')
                    .replace(/<script[\s\S]*?<\/script>/gi, '')
                    .replace(/<style[\s\S]*?<\/style>/gi, '')
                    .replace(/<!--[\s\S]*?-->/g, '');
                // Preserve line breaks for block-level elements before stripping tags
                cleaned = cleaned.replace(/<br\s*\/?>/gi, '\n');
                cleaned = cleaned.replace(/<\/(p|div|li|tr|h[1-6]|pre|section|article)>/gi, '\n');
                cleaned = cleaned.replace(/<[^>]+>/g, '');
                cleaned = decodeHtmlEntities(cleaned);
                cleaned = cleaned.replace(/\r\n/g, '\n');
                cleaned = cleaned.split('\n').map(function (l) { return l.replace(/[ \t]+$/, ''); }).join('\n');
                cleaned = cleaned.replace(/[ \t]{2,}/g, ' ');
                cleaned = cleaned.replace(/\n{3,}/g, '\n\n').trim();
                return { text: cleaned, title: pageTitle };
            }

            async function addSingleSongToApp(title, bodyText, sourceUrl, targetFolderOverride) {
                var targetFolder = (targetFolderOverride !== undefined ? targetFolderOverride : state.currentFolder) || 'Gig';
                var song = { id: uid(), title: title, key: "C", bpm: "", folder: targetFolder, body: bodyText.replace(/\s+$/, ''), sourceUrl: sourceUrl };
                state.songs.push(song);
                await ensureFolder(targetFolder);
                await persistSong(song);
                await persistIndex(state.songs);
                return { kind: 'single', title: title, id: song.id };
            }

            // Shared import logic: given fetched text + the URL/content-type it came from,
            // adds either a whole setlist (JSON) or a single song (txt/html) to state.songs.
            // Used by both the direct URL importer and the GitHub folder browser below.
            async function importContentAsSong(text, url, contentTypeHeader, targetFolderOverride) {
                var looksLikeJson = /\.json(\?|#|$)/i.test(url) || /^\s*[\{\[]/.test(text);
                if (looksLikeJson) {
                    var data = null;
                    try { data = JSON.parse(text); } catch (e) { data = null; }
                    if (data) {
                        var incomingSongs = Array.isArray(data.songs) ? data.songs : (Array.isArray(data) ? data : null);
                        if (incomingSongs && incomingSongs.length) {
                            var targetFolder = targetFolderOverride !== undefined ? targetFolderOverride : state.currentFolder;
                            var addedCount = 0;
                            var firstAddedId = null;
                            for (var i = 0; i < incomingSongs.length; i++) {
                                var s = incomingSongs[i];
                                if (!s || !s.title) continue;
                                var folderForSong = targetFolder || s.folder || 'Gig';
                                var song = { id: uid(), title: s.title || 'Untitled', key: s.key || 'C', bpm: s.bpm || '', folder: folderForSong, body: s.body || '' };
                                state.songs.push(song);
                                await ensureFolder(folderForSong);
                                await persistSong(song);
                                if (!firstAddedId) firstAddedId = song.id;
                                addedCount++;
                            }
                            if (Array.isArray(data.folderList)) {
                                data.folderList.forEach(function (f) { if (state.folderList.indexOf(f) === -1) state.folderList.push(f); });
                                await persistFolderList();
                            }
                            await persistIndex(state.songs);
                            return { kind: 'multi', count: addedCount, firstId: firstAddedId };
                        }
                    }
                    if (/\.json(\?|#|$)/i.test(url)) throw new Error('invalid-json');
                }

                var contentType = contentTypeHeader || '';
                var looksLikeHtml = /\.html?(\?|#|$)/i.test(url) || /text\/html/i.test(contentType) || /^\s*<!doctype html|^\s*<html/i.test(text);
                var title = filenameFromUrl(url);
                var bodyText = text;
                if (looksLikeHtml) {
                    var extracted = extractTextFromHtml(text);
                    bodyText = extracted.text;
                    if (extracted.title) title = extracted.title;
                    if (!bodyText || !bodyText.trim()) throw new Error('empty');
                }
                return addSingleSongToApp(title, bodyText, url, targetFolderOverride);
            }

            // ---- Word (.docx) / PowerPoint (.pptx) reading ----
            function xmlUnescape(str) {
                return str.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
            }

            function docxXmlToText(xml) {
                var s = xml
                    .replace(/<w:tab\s*\/?>/gi, '\t')
                    .replace(/<w:br\s*\/?>/gi, '\n')
                    .replace(/<\/w:p>/gi, '\n');
                s = s.replace(/<[^>]+>/g, '');
                s = xmlUnescape(s);
                s = s.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
                return s;
            }

            function pptxXmlToText(xml) {
                var s = xml.replace(/<\/a:p>/gi, '\n');
                s = s.replace(/<[^>]+>/g, '');
                s = xmlUnescape(s);
                s = s.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
                return s;
            }

            // Core parser: given raw bytes + a filename/URL (used only to tell docx vs
            // pptx apart), returns { text, title }. Works the same whether the bytes
            // came from fetch() or from a local file picker.
            async function parseOfficeBuffer(buf, nameOrUrl) {
                if (typeof window.JSZip === 'undefined') {
                    throw new Error('jszip-missing');
                }
                var zip = await window.JSZip.loadAsync(buf);
                var isDocx = /\.docx(\?|#|$)/i.test(nameOrUrl);
                var isPptx = /\.pptx(\?|#|$)/i.test(nameOrUrl);
                var text = '';
                var title = null;

                if (isDocx) {
                    var docFile = zip.file('word/document.xml');
                    if (!docFile) throw new Error('bad-office-file');
                    var docXml = await docFile.async('string');
                    text = docxXmlToText(docXml);
                    var coreFile = zip.file('docProps/core.xml');
                    if (coreFile) {
                        var coreXml = await coreFile.async('string');
                        var m = coreXml.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i);
                        if (m && m[1].trim()) title = xmlUnescape(m[1].trim());
                    }
                } else if (isPptx) {
                    var slideNames = Object.keys(zip.files).filter(function (name) { return /^ppt\/slides\/slide\d+\.xml$/.test(name); });
                    slideNames.sort(function (a, b) {
                        var na = parseInt(a.match(/slide(\d+)\.xml/)[1], 10);
                        var nb = parseInt(b.match(/slide(\d+)\.xml/)[1], 10);
                        return na - nb;
                    });
                    var slideTexts = [];
                    for (var i = 0; i < slideNames.length; i++) {
                        var sXml = await zip.file(slideNames[i]).async('string');
                        var t = pptxXmlToText(sXml);
                        if (t.trim()) slideTexts.push(t.trim());
                    }
                    text = slideTexts.join('\n\n');
                } else {
                    throw new Error('unsupported-office');
                }

                if (!text || !text.trim()) throw new Error('empty');
                return { text: text, title: title };
            }

            async function importOfficeFileFromUrl(url, targetFolderOverride) {
                var res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var buf = await res.arrayBuffer();
                var parsed = await parseOfficeBuffer(buf, url);
                var title = parsed.title || filenameFromUrl(url);
                return addSingleSongToApp(title, parsed.text, url, targetFolderOverride);
            }

            // ---- GitHub "browse a folder, pick what to import" ----
            function encodeApiPath(path) {
                return path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
            }

            // Recognizes GitHub folder links in either form:
            //   https://github.com/{owner}/{repo}/tree/{branch}/{path...}
            //   https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path.../ or no extension}
            function parseGithubFolderUrl(url) {
                try {
                    var u = new URL(url);
                    if (u.hostname === 'github.com') {
                        var parts = u.pathname.split('/').filter(Boolean);
                        if (parts.length >= 2) {
                            var owner = parts[0], repo = parts[1];
                            if (parts.length === 2) {
                                return { owner: owner, repo: repo, branch: null, path: '' };
                            }
                            if (parts[2] === 'tree' && parts.length >= 4) {
                                return { owner: owner, repo: repo, branch: parts[3], path: parts.slice(4).join('/') };
                            }
                        }
                        return null;
                    }
                    if (u.hostname === 'raw.githubusercontent.com') {
                        var rparts = u.pathname.split('/').filter(Boolean);
                        if (rparts.length >= 3) {
                            var rowner = rparts[0], rrepo = rparts[1], rbranch = rparts[2];
                            var rpathParts = rparts.slice(3);
                            var endsWithSlash = /\/$/.test(u.pathname);
                            var lastSeg = rpathParts.length ? rpathParts[rpathParts.length - 1] : '';
                            var hasExtension = /\.[a-z0-9]{1,6}$/i.test(lastSeg);
                            if (endsWithSlash || !hasExtension) {
                                return { owner: rowner, repo: rrepo, branch: rbranch, path: rpathParts.join('/') };
                            }
                        }
                        return null;
                    }
                    return null;
                } catch (e) { return null; }
            }

            async function fetchGithubFolder(owner, repo, branch, path) {
                var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + encodeApiPath(path) + (branch ? ('?ref=' + encodeURIComponent(branch)) : '');
                var res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
                if (!res.ok) {
                    if (res.status === 404) throw new Error('not-found');
                    throw new Error('HTTP ' + res.status);
                }
                var data = await res.json();
                if (!Array.isArray(data)) throw new Error('not-a-folder');
                // Folders first, then files, alphabetically within each group.
                data.sort(function (a, b) {
                    if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                    return a.name.localeCompare(b.name);
                });
                return data;
            }

            async function openFolderBrowse(owner, repo, branch, path) {
                state.folderBrowseOpen = true;
                state.folderBrowseBusy = true;
                state.folderBrowseError = null;
                state.folderBrowseOwner = owner;
                state.folderBrowseRepo = repo;
                state.folderBrowseBranch = branch;
                state.folderBrowsePath = path || '';
                state.folderBrowseEntries = null;
                render();
                try {
                    var entries = await fetchGithubFolder(owner, repo, branch, path || '');
                    state.folderBrowseEntries = entries;
                    state.folderBrowseBusy = false;
                    render();
                } catch (err) {
                    state.folderBrowseBusy = false;
                    state.folderBrowseError = (err && err.message === 'not-found') ? 'Walang nahanap na folder dito.' : 'Hindi ma-load ang folder listing.';
                    render();
                }
            }

            function folderBrowseNavigateInto(entry) {
                if (entry.type !== 'dir') return;
                openFolderBrowse(state.folderBrowseOwner, state.folderBrowseRepo, state.folderBrowseBranch, entry.path);
            }

            function folderBrowseGoUp() {
                var parts = (state.folderBrowsePath || '').split('/').filter(Boolean);
                parts.pop();
                openFolderBrowse(state.folderBrowseOwner, state.folderBrowseRepo, state.folderBrowseBranch, parts.join('/'));
            }

            function closeFolderBrowse() {
                state.folderBrowseOpen = false;
                state.folderBrowseEntries = null;
                state.folderBrowseError = null;
                state.folderBrowseImportedPaths = {};
                render();
            }

            async function importFolderFileEntry(entry) {
                try {
                    var result;
                    if (/\.(docx|pptx)$/i.test(entry.name)) {
                        result = await importOfficeFileFromUrl(entry.download_url, state.currentFolder);
                    } else {
                        var res = await fetch(entry.download_url);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        var text = await res.text();
                        var contentType = '';
                        try { contentType = res.headers.get('content-type') || ''; } catch (e) { }
                        result = await importContentAsSong(text, entry.download_url, contentType, state.currentFolder);
                    }
                    state.folderBrowseImportedPaths[entry.path] = true;
                    render();
                    showToast(result.kind === 'multi' ? ('\u2713 Na-import ang ' + result.count + ' kanta mula sa "' + entry.name + '"') : ('\u2713 Na-import na: "' + result.title + '"'));
                } catch (err) {
                    showToast('Hindi ma-import ang "' + entry.name + '"');
                }
            }

            function openConfirmImportAllFolder() {
                if (!state.folderBrowseEntries) return;
                var pending = state.folderBrowseEntries.filter(function (e) { return e.type === 'file' && !state.folderBrowseImportedPaths[e.path]; });
                if (!pending.length) { showToast('Wala nang natitirang kanta na i-i-import dito.'); return; }
                state.folderBrowseConfirmAllOpen = true;
                render();
            }
            function cancelConfirmImportAllFolder() {
                state.folderBrowseConfirmAllOpen = false;
                render();
            }
            function confirmImportAllFolder() {
                state.folderBrowseConfirmAllOpen = false;
                importAllInFolder();
            }

            async function importAllInFolder() {
                if (!state.folderBrowseEntries) return;
                state.folderBrowseImportingAll = true;
                render();
                var files = state.folderBrowseEntries.filter(function (e) { return e.type === 'file'; });
                var totalAdded = 0;
                for (var i = 0; i < files.length; i++) {
                    var entry = files[i];
                    if (state.folderBrowseImportedPaths[entry.path]) continue;
                    try {
                        var result;
                        if (/\.(docx|pptx)$/i.test(entry.name)) {
                            result = await importOfficeFileFromUrl(entry.download_url, state.currentFolder);
                        } else {
                            var res = await fetch(entry.download_url);
                            if (!res.ok) continue;
                            var text = await res.text();
                            var contentType = '';
                            try { contentType = res.headers.get('content-type') || ''; } catch (e) { }
                            result = await importContentAsSong(text, entry.download_url, contentType, state.currentFolder);
                        }
                        state.folderBrowseImportedPaths[entry.path] = true;
                        totalAdded += (result.kind === 'multi' ? result.count : 1);
                    } catch (e) { /* skip file that failed, continue with the rest */ }
                }
                state.folderBrowseImportingAll = false;
                render();
                showToast('\u2713 Na-import ang ' + totalAdded + ' kanta mula sa folder!');
                setTimeout(function () {
                    if (state.folderBrowseOpen) closeFolderBrowse();
                }, 900);
            }

            async function handleImportFromUrl() {
                var input = document.getElementById('url-import-input');
                var url = input ? input.value.trim() : '';
                if (!url) { state.urlImportError = 'Maglagay muna ng link.'; render(); focusUrlInput(); return; }
                if (!/^https?:\/\//i.test(url)) { state.urlImportError = 'Kailangan magsimula sa http:// o https://'; render(); focusUrlInput(); return; }

                // If this looks like a link to a GitHub *folder* rather than a single file,
                // open the folder browser (list + pick) instead of trying to fetch it directly.
                var folderRef = parseGithubFolderUrl(url);
                if (folderRef) {
                    state.urlImportOpen = false;
                    state.urlImportBusy = false;
                    state.urlImportValue = '';
                    state.urlImportError = null;
                    openFolderBrowse(folderRef.owner, folderRef.repo, folderRef.branch, folderRef.path);
                    return;
                }

                state.urlImportValue = url;
                state.urlImportBusy = true;
                state.urlImportError = null;
                render();

                var isOfficeFile = /\.(docx|pptx)(\?|#|$)/i.test(url);

                try {
                    var result;
                    if (isOfficeFile) {
                        result = await importOfficeFileFromUrl(url, state.currentFolder);
                    } else {
                        var res = await fetch(url);
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        var text = await res.text();
                        if (!text || !text.trim()) throw new Error('empty');
                        var contentType = '';
                        try { contentType = (res.headers && res.headers.get) ? (res.headers.get('content-type') || '') : ''; } catch (e) { }
                        result = await importContentAsSong(text, url, contentType, state.currentFolder);
                    }

                    if (result.kind === 'single') { state.activeId = result.id; state.mode = 'view'; state.transposeSteps = 0; }
                    else if (result.firstId) { state.activeId = result.firstId; state.mode = 'view'; state.transposeSteps = 0; }
                    state.sidebarView = 'folderSongs';

                    state.urlImportOpen = false;
                    state.urlImportBusy = false;
                    state.urlImportValue = '';
                    render();
                    showToast(result.kind === 'multi' ? ('\u2713 Na-import ang ' + result.count + ' kanta mula sa link!') : ('\u2713 Na-import mula sa link: "' + result.title + '"'));
                } catch (err) {
                    state.urlImportBusy = false;
                    var msg = 'Hindi ma-fetch ang link.';
                    if (err && err.message === 'empty') {
                        msg = 'Walang laman ang file sa link na ibinigay.';
                    } else if (err && err.message === 'invalid-json') {
                        msg = 'Mukhang JSON file ito pero hindi ito valid na setlist (walang "songs" list).';
                    } else if (err && err.message === 'jszip-missing') {
                        msg = 'Hindi pa handa ang Word/PowerPoint reader, subukan ulit pagkatapos ng ilang segundo.';
                    } else if (err && err.message === 'bad-office-file') {
                        msg = 'Hindi ma-basa ang Word file na ito, baka sira o hindi tunay na .docx.';
                    } else if (err && err.message === 'unsupported-office') {
                        msg = 'Hindi supported ang file type na ito.';
                    } else if (err && /Failed to fetch|NetworkError|TypeError/i.test(err.message || '')) {
                        msg = 'Hindi ma-access ang link. Baka naka-block ng CORS ang website, private ang file, o walang internet.';
                    } else if (err && err.message) {
                        msg = 'Hindi ma-fetch: ' + err.message;
                    }
                    state.urlImportError = msg;
                    render();
                    focusUrlInput();
                }
            }

            function handleExport() {
                var song = getActiveSong();
                if (!song) return;
                var body = transposeSongBody(song.body, state.transposeSteps);
                var keyDisp = song.key ? transposeChordToken(song.key, state.transposeSteps) : '';
                var header = song.title + (keyDisp ? ' - Key of ' + keyDisp : '') + '\n\n';
                var blob = new Blob([header + body], { type: 'text/plain' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = (song.title || 'song').replace(/[^a-z0-9\-_ ]/gi, '').trim() + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Exported as .txt');
            }

            function handleExportJSON() {
                var data = {
                    app: 'Gig Song Hits',
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    folderList: state.folderList,
                    songs: state.songs
                };
                var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'gig-song-hits-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Na-export ang buong setlist (JSON)');
            }

            function handleImportJSONFile(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = async function (ev) {
                    try {
                        var data = JSON.parse(ev.target.result);
                        var incomingSongs = Array.isArray(data.songs) ? data.songs : (Array.isArray(data) ? data : null);
                        if (!incomingSongs) throw new Error('invalid');
                        var addedCount = 0;
                        for (var i = 0; i < incomingSongs.length; i++) {
                            var s = incomingSongs[i];
                            if (!s || !s.title) continue;
                            var song = {
                                id: uid(),
                                title: s.title || 'Untitled',
                                key: s.key || 'C',
                                bpm: s.bpm || '',
                                folder: s.folder || 'Gig',
                                body: s.body || ''
                            };
                            state.songs.push(song);
                            await ensureFolder(song.folder);
                            await persistSong(song);
                            addedCount++;
                        }
                        if (Array.isArray(data.folderList)) {
                            data.folderList.forEach(function (f) { if (state.folderList.indexOf(f) === -1) state.folderList.push(f); });
                            await persistFolderList();
                        }
                        await persistIndex(state.songs);
                        render();
                        showToast('Na-import ang ' + addedCount + ' kanta mula sa JSON');
                    } catch (err) {
                        showToast('Hindi ma-import: invalid JSON file');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ---- Share-a-folder-via-link ----
            function b64EncodeUnicode(str) {
                return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (_, p1) { return String.fromCharCode('0x' + p1); }));
            }
            function b64DecodeUnicode(str) {
                return decodeURIComponent(Array.prototype.map.call(atob(str), function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
            }

            function parseSharedFromUrl() {
                try {
                    var params = new URLSearchParams(window.location.search);
                    var raw = params.get('share');
                    if (!raw) return null;
                    var json = b64DecodeUnicode(raw);
                    var data = JSON.parse(json);
                    if (!data || !Array.isArray(data.songs) || !data.songs.length) return null;
                    return { folder: data.folder || 'Shared', songs: data.songs };
                } catch (e) { return null; }
            }

            function buildShareUrlForFolder(folderName) {
                var songsToShare = folderName === null
                    ? state.songs
                    : state.songs.filter(function (s) { return (s.folder || 'Gig') === folderName; });

                var payload = {
                    folder: folderName || 'All Songs',
                    songs: songsToShare.map(function (s) { return { title: s.title, key: s.key, bpm: s.bpm, body: s.body }; })
                };
                var encoded = b64EncodeUnicode(JSON.stringify(payload));
                var base = window.location.origin + window.location.pathname;
                return base + '?share=' + encoded;
            }

            function stopAutoScroll() {
                if (scrollAnimId) clearInterval(scrollAnimId);
                scrollAnimId = null;
            }

            var userTouchingStage = false;

            // Auto-scroll runs on a plain setInterval "tick" rather than
            // requestAnimationFrame. Mobile browsers commonly pause/throttle rAF
            // callbacks while the user has a finger actively dragging a DIFFERENT
            // control on the page (like the speed slider), to keep that drag
            // gesture smooth — which is exactly what caused the "hangs when I
            // change speed" bug. setInterval isn't tied to the paint/gesture
            // pipeline that way, so it keeps ticking through a slider drag.
            function startAutoScroll() {
                stopAutoScroll();
                var lastTs = performance.now();
                var lastEl = null;
                var pos = null;
                scrollAnimId = setInterval(function () {
                    if (!state.autoScroll) { stopAutoScroll(); return; }
                    var ts = performance.now();
                    // Re-fetch the stage element every tick (instead of once, up front) so
                    // that if anything re-renders #root in between — replacing the old
                    // <div id="stage"> with a new one — this loop doesn't keep quietly
                    // scrolling a detached, invisible copy of it.
                    var el = document.getElementById('stage');
                    if (!el) { return; }
                    if (el !== lastEl) { lastEl = el; pos = el.scrollTop; lastTs = ts; return; }
                    var dt = (ts - lastTs) / 1000;
                    lastTs = ts;
                    if (userTouchingStage) {
                        // Fully hands-off while the user is scrolling manually.
                        pos = el.scrollTop;
                        return;
                    }
                    var pxPerSec = 2 + state.scrollSpeed * state.scrollSpeed * 0.6; // wide range: ~2.6px/s (super slow) to ~137px/s (super fast, max 15)
                    pos += pxPerSec * dt;
                    el.scrollTop = pos;
                    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 2) {
                        state.autoScroll = false;
                        renderToolbarOnly();
                        stopAutoScroll();
                        return;
                    }
                }, 30);
            }

            function toggleAutoScroll() {
                if (state.autoScroll) {
                    // Pausing keeps scrollStarted=true, so pressing play again just resumes.
                    state.autoScroll = false;
                    stopAutoScroll();
                    renderToolbarOnly();
                    return;
                }
                if (state.countdownRemaining != null) {
                    // Already counting down — treat a second click as cancel.
                    stopCountdown();
                    render();
                    return;
                }
                if (state.scrollStarted) {
                    // Resuming after a pause — no need to count in again.
                    state.autoScroll = true;
                    startAutoScroll();
                    renderToolbarOnly();
                    return;
                }
                startCountdown();
            }

            function startCountdown() {
                stopCountdown();
                if (!state.countInSeconds || state.countInSeconds <= 0) {
                    state.autoScroll = true;
                    state.scrollStarted = true;
                    startAutoScroll();
                    renderToolbarOnly();
                    return;
                }
                state.countdownRemaining = state.countInSeconds;
                render();
                countdownTimerId = setInterval(function () {
                    state.countdownRemaining -= 1;
                    if (state.countdownRemaining <= 0) {
                        clearInterval(countdownTimerId);
                        countdownTimerId = null;
                        state.countdownRemaining = null;
                        state.autoScroll = true;
                        state.scrollStarted = true;
                        render();
                        startAutoScroll();
                    } else {
                        var numEl = document.getElementById('countdown-number');
                        if (numEl) numEl.textContent = state.countdownRemaining;
                    }
                }, 1000);
            }

            function stopCountdown() {
                if (countdownTimerId) { clearInterval(countdownTimerId); countdownTimerId = null; }
                state.countdownRemaining = null;
            }

            // ---- Mobile/PWA back-button handling ----
            // Without this, an installed PWA (or in-app webview) has no browser history
            // of its own, so the very first hardware "back" press closes the whole app
            // no matter where the user is in the UI. We push one history entry per
            // "level" the user is nested into (a folder opened, edit mode, a modal, the
            // mobile sidebar overlay) and pop the matching UI state back off on
            // popstate, so back only exits the app once you're already at the root.
            var _navLevel = 0;
            var _navReady = false;
            var _inPopstate = false;

            function hasOverlayOpen() {
                return !!(state.chordModal || state.confirmDelete || state.confirmDeleteFolder ||
                    state.urlImportOpen || state.sharedModalOpen || state.shareModalOpen ||
                    state.folderBrowseOpen || state.editorNewFolder || state.renamingFolder || state.addingFolder);
            }

            function computeNavLevel() {
                var c = hasOverlayOpen() ? 1 : 0;
                var d = state.sidebarOpen ? 1 : 0;
                var b = state.mode === 'edit' ? 1 : 0;
                var a = state.sidebarView === 'folderSongs' ? 1 : 0;
                return c + d + b + a;
            }

            // Closes exactly one "level", in the same priority used by computeNavLevel()
            // (overlay > mobile sidebar > edit mode > folder view), so a single back
            // press always undoes a single visible change.
            function closeTopOverlay() {
                if (state.chordModal) { state.chordModal = null; return; }
                if (state.confirmDelete) { state.confirmDelete = null; return; }
                if (state.confirmDeleteFolder) { state.confirmDeleteFolder = null; return; }
                if (state.urlImportOpen) { state.urlImportOpen = false; state.urlImportBusy = false; state.urlImportError = null; return; }
                if (state.sharedModalOpen) { state.sharedModalOpen = false; return; }
                if (state.shareModalOpen) { state.shareModalOpen = false; return; }
                if (state.folderBrowseOpen) { state.folderBrowseOpen = false; return; }
                if (state.editorNewFolder) { state.editorNewFolder = false; return; }
                if (state.renamingFolder) { state.renamingFolder = null; return; }
                if (state.addingFolder) { state.addingFolder = false; return; }
                if (state.sidebarOpen) { state.sidebarOpen = false; return; }
                if (state.mode === 'edit') { state.mode = 'view'; return; }
                if (state.sidebarView === 'folderSongs') { state.sidebarView = 'folders'; return; }
            }

            function syncNavHistory() {
                var newLevel = computeNavLevel();
                if (!_navReady) {
                    _navLevel = newLevel;
                    _navReady = true;
                    try { history.replaceState({ gsh: newLevel }, ''); } catch (e) { }
                    return;
                }
                if (_inPopstate) { _navLevel = newLevel; return; }
                var diff = newLevel - _navLevel;
                if (diff > 0) {
                    for (var i = 0; i < diff; i++) { try { history.pushState({ gsh: _navLevel + i + 1 }, ''); } catch (e) { } }
                    _navLevel = newLevel;
                } else if (diff < 0) {
                    _navLevel = newLevel;
                    for (var j = 0; j < -diff; j++) { try { history.back(); } catch (e) { } }
                }
            }

            window.addEventListener('popstate', function () {
                _inPopstate = true;
                closeTopOverlay();
                _navLevel = computeNavLevel();
                render();
                _inPopstate = false;
            });

                // Touch handling on the lyrics area does two things:
                // 1) Tracks whether the user currently has a finger down, so autoscroll
                //    (see startAutoScroll) steps aside and lets manual scrolling take over.
                // 2) Two-finger pinch resizes the font directly (native browser pinch-zoom
                //    is blocked via touch-action:pan-y in CSS, so this replaces it).
                var stageEl = byId('stage');
                if (stageEl) {
                    var pinchStartDist = null;
                    var pinchStartFont = null;
                    function touchDist(touches) {
                        var dx = touches[0].clientX - touches[1].clientX;
                        var dy = touches[0].clientY - touches[1].clientY;
                        return Math.sqrt(dx * dx + dy * dy);
                    }
                    stageEl.addEventListener('touchstart', function (e) {
                        userTouchingStage = true;
                        if (e.touches.length === 2) {
                            e.preventDefault();
                            pinchStartDist = touchDist(e.touches);
                            pinchStartFont = state.fontSize;
                        }
                    }, { passive: false });
                    stageEl.addEventListener('touchmove', function (e) {
                        if (e.touches.length === 2) {
                            e.preventDefault();
                            if (!pinchStartDist) {
                                pinchStartDist = touchDist(e.touches);
                                pinchStartFont = state.fontSize;
                                return;
                            }
                            var newDist = touchDist(e.touches);
                            var ratio = newDist / pinchStartDist;
                            var newSize = Math.round(pinchStartFont * ratio);
                            newSize = Math.max(12, Math.min(36, newSize));
                            if (newSize !== state.fontSize) {
                                state.fontSize = newSize;
                                var chart = document.querySelector('.chart');
                                if (chart) chart.style.fontSize = state.fontSize + 'px';
                                var editBodyEl = byId('edit-body');
                                var editBackdropEl = byId('edit-body-backdrop');
                                if (editBodyEl) editBodyEl.style.fontSize = state.fontSize + 'px';
                                if (editBackdropEl) editBackdropEl.style.fontSize = state.fontSize + 'px';
                                var slider = byId('range-font');
                                if (slider) slider.value = state.fontSize;
                            }
                        }
                    }, { passive: false });
                    stageEl.addEventListener('touchend', function (e) {
                        if (e.touches.length < 2) { pinchStartDist = null; pinchStartFont = null; }
                        if (e.touches.length === 0) { userTouchingStage = false; }
                    }, { passive: true });
                    stageEl.addEventListener('touchcancel', function (e) {
                        pinchStartDist = null; pinchStartFont = null; userTouchingStage = false;
                    }, { passive: true });
                }

                if (byId('btn-toggle-mode')) byId('btn-toggle-mode').onclick = function () {
                    state.mode = state.mode === 'edit' ? 'view' : 'edit';
                    state.editorNewFolder = false;

                if (byId('btn-shared-confirmall-cancel')) byId('btn-shared-confirmall-cancel').onclick = cancelConfirmImportAllShared;
                if (byId('btn-shared-confirmall-yes')) byId('btn-shared-confirmall-yes').onclick = confirmImportAllShared;
                if (byId('shared-confirmall-overlay')) byId('shared-confirmall-overlay').onclick = function (e) { if (e.target.id === 'shared-confirmall-overlay') cancelConfirmImportAllShared(); };
                var fbNavBtns = document.querySelectorAll('[data-navdir]');

                var fbImportBtns = document.querySelectorAll('.fb-import-btn');

                if (byId('btn-export')) byId('btn-export').onclick = handleExport;
                if (byId('btn-delete')) byId('btn-delete').onclick = function () { state.confirmDelete = state.activeId; render(); };
                if (byId('btn-cancel-delete')) byId('btn-cancel-delete').onclick = function () { state.confirmDelete = null; render(); };
                if (byId('btn-confirm-delete')) byId('btn-confirm-delete').onclick = function () { deleteSong(state.confirmDelete); };
                if (byId('confirm-overlay')) byId('confirm-overlay').onclick = function (e) { if (e.target.id === 'confirm-overlay') { state.confirmDelete = null; render(); } };

                if (byId('btn-close-chord')) byId('btn-close-chord').onclick = function () { state.chordModal = null; render(); };
                if (byId('chord-overlay')) byId('chord-overlay').onclick = function (e) { if (e.target.id === 'chord-overlay') { state.chordModal = null; render(); } };

                var instGtr = byId('btn-inst-guitar');
                if (instGtr) instGtr.onclick = function () { setChordInstrument('guitar'); };
                var instUke = byId('btn-inst-ukulele');
                if (instUke) instUke.onclick = function () { setChordInstrument('ukulele'); };

                var modalGtr = byId('btn-modal-guitar');
                if (modalGtr) modalGtr.onclick = function () { setChordInstrument('guitar'); };
                var modalUke = byId('btn-modal-ukulele');
                if (modalUke) modalUke.onclick = function () { setChordInstrument('ukulele'); };

                var editTitle = byId('edit-title');
                if (editTitle) {
                    editTitle.oninput = function (e) { updateActiveSong({ title: e.target.value }); refreshSidebarLabelsSoft(); };
                }
                var editKey = byId('edit-key');
                if (editKey) editKey.oninput = function (e) { updateActiveSong({ key: e.target.value }); refreshSidebarLabelsSoft(); };
                var editBpm = byId('edit-bpm');
                if (editBpm) editBpm.oninput = function (e) {
                    var sp = computeScrollSpeedFromBpm(e.target.value);
                    var bpmPatch = { bpm: e.target.value };
                    if (sp) bpmPatch.scrollSpeed = sp;
                    updateActiveSong(bpmPatch);
                    refreshSidebarLabelsSoft();
                    if (sp) {
                        state.scrollSpeed = sp;
                        var slider = byId('range-speed');
                        if (slider) slider.value = sp;
                    }
                };
                var editFolder = byId('edit-folder');
                if (editFolder) editFolder.onchange = async function (e) {
                    var val = e.target.value;
                    if (val === '__new__') {
                        state.editorNewFolder = true;
                        render();
                        var nf = byId('edit-folder-new-input');
                        if (nf) nf.focus();
                        return;
                    }
                    val = val.trim() || 'Gig';
                    await updateActiveSong({ folder: val });
                    await ensureFolder(val);
                    state.currentFolder = val;
                    render();
                };
                var newFolderConfirmBtn = byId('btn-editor-newfolder-confirm');
                if (newFolderConfirmBtn) newFolderConfirmBtn.onclick = async function () {
                    var inp = byId('edit-folder-new-input');
                    var val = inp ? inp.value.trim() : '';
                    if (!val) { state.editorNewFolder = false; render(); return; }
                    await updateActiveSong({ folder: val });
                    await ensureFolder(val);
                    state.currentFolder = val;
                    state.editorNewFolder = false;
                    render();
                    showToast('Folder "' + val + '" added');
                };
                var newFolderCancelBtn = byId('btn-editor-newfolder-cancel');
                if (newFolderCancelBtn) newFolderCancelBtn.onclick = function () { state.editorNewFolder = false; render(); };
                var editFolderNewInput = byId('edit-folder-new-input');
                if (editFolderNewInput) {
                    editFolderNewInput.onkeydown = function (e) {
                        if (e.key === 'Enter') { e.preventDefault(); newFolderConfirmBtn.click(); }
                        if (e.key === 'Escape') { state.editorNewFolder = false; render(); }
                    };
                }
                var editBody = byId('edit-body');
                var editBodyBackdrop = byId('edit-body-backdrop');
                if (editBody) {
                    editBody.oninput = function (e) {
                        updateActiveSong({ body: e.target.value });
                        if (editBodyBackdrop) editBodyBackdrop.innerHTML = renderEditorHtml(e.target.value);
                    };
                    editBody.onscroll = function () {
                        if (editBodyBackdrop) {
                            editBodyBackdrop.scrollTop = editBody.scrollTop;
                            editBodyBackdrop.scrollLeft = editBody.scrollLeft;
                        }
                    };
                    // Keep the backdrop's box the same size as the textarea as the user drags its resize handle.
                    if (editBodyBackdrop && window.ResizeObserver) {
                        var editBodyResizeObs = new ResizeObserver(function () {
                            editBodyBackdrop.style.height = editBody.offsetHeight + 'px';
                        });
                        editBodyResizeObs.observe(editBody);
                    }
                }

                if (state.autoScroll) startAutoScroll();
            }

            function refreshSidebarLabelsSoft() {
                var song = getActiveSong();
                if (!song) return;
                var el = document.querySelector('.song-item[data-id="' + song.id + '"]');
                if (el) {
                    var t = el.querySelector('.t');
                    var k = el.querySelector('.k');
                    if (t) t.textContent = song.title || 'Untitled';
                    if (k) k.textContent = 'Key ' + (song.key || '\u2014') + (song.bpm ? ' \u00b7 ' + song.bpm + ' bpm' : '');
                }
            }

            document.addEventListener('click', function (e) {
                var el = e.target;
                if (el && el.classList && el.classList.contains('chord-tok')) {
                    state.chordModal = el.getAttribute('data-chord');
                    render();
                }
            });

            var _sharedFromUrl = parseSharedFromUrl();
            if (_sharedFromUrl) {
                state.sharedPreview = _sharedFromUrl;
                state.sharedModalOpen = true;
            }

            loadTheme();
            loadSongs();

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function () { });
                });
            }
        })();
