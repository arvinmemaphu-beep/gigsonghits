<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gig Song Hits</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F0D0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gig Hits">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F0D0B;
    --surface: #1C1815;
    --surface-2: #251F1A;
    --line: #34291f;
    --gold: #E8A33D;
    --gold-dim: #8a662a;
    --teal: #4FA8A0;
    --text: #F2EDE4;
    --muted: #9a8f80;
    --danger: #c96256;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); height:100%; }
  body{
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% -10%, rgba(232,163,61,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(79,168,160,0.08), transparent 40%);
  }
  #root{ min-height:100vh; }
  ::selection{ background: var(--gold); color:#141210; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--surface); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--gold-dim); }

  .app{ display:grid; grid-template-columns: 280px 1fr; height:100vh; height:100dvh; }
  @media (max-width: 800px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ display:none; }
    .sidebar.open{ display:flex; position:fixed; inset:0; z-index:40; height:100vh; height:100dvh; width:100vw; }
  }

  .sidebar{ background: var(--surface); border-right: 1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  .brand{ padding: 18px 16px 14px 16px; border-bottom: 1px solid var(--line); }
  .brand-mark{ display:flex; align-items:baseline; gap:6px; }
  .brand-mark .bolt{ color:var(--gold); font-size:20px; }
  .brand h1{ margin:0; font-size:20px; letter-spacing:1px; font-weight:700; text-transform:uppercase; }
  .brand p{ margin:4px 0 0; font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
  .trademark{ position:fixed; bottom:8px; right:12px; font-size:10px; letter-spacing:2px; color:var(--gold-dim); text-transform:uppercase; z-index:5; pointer-events:none; opacity:0.85; }

  .setlist-head{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px 8px; }
  .setlist-head span{ font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  .new-btn{ background: var(--gold); color:#181410; border:none; border-radius:4px; width:24px; height:24px; font-size:16px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; }
  .new-btn:hover{ background:#f2b559; }

  .song-list{ overflow-y:auto; flex:1; padding: 4px 8px 12px; }
  .song-item{ padding:10px 10px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; gap:2px; border:1px solid transparent; margin-bottom:3px; }
  .song-item:hover{ background: var(--surface-2); }
  .song-item.active{ background: rgba(232,163,61,0.10); border-color: var(--gold-dim); }
  .song-item .t{ font-size:14px; font-weight:500; color:var(--text); }
  .song-item .k{ font-size:11px; color:var(--teal); letter-spacing:1px; }
  .empty-hint{ padding: 20px 16px; color:var(--muted); font-size:12px; line-height:1.6; }

  .folder-card{ display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-bottom:5px; }
  .folder-card:hover{ background: var(--surface-2); border-color: var(--line); }
  .folder-card .ico{ font-size:18px; }
  .folder-card .info{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .folder-card .name{ font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-card .count{ font-size:11px; color:var(--muted); letter-spacing:0.5px; }
  .folder-card.all{ background: rgba(79,168,160,0.08); border-color: rgba(79,168,160,0.25); }
  .folder-card.all .ico{ color: var(--teal); }
  .folder-actions{ display:flex; gap:4px; flex-shrink:0; }
  .folder-action-btn{ background:transparent; border:1px solid var(--line); color:var(--muted); width:26px; height:26px; border-radius:5px; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .folder-action-btn:hover{ border-color: var(--gold-dim); color: var(--gold); background: rgba(232,163,61,0.08); }
  .folder-action-btn.danger:hover{ border-color: var(--danger); color: var(--danger); background: rgba(201,98,86,0.10); }
  .folder-card.renaming{ cursor:default; }
  .rename-folder-input{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); border-radius:5px; padding:6px 8px; font-size:13px; }
  .rename-folder-input:focus{ outline:none; border-color: var(--gold); }

  .folder-header{ display:flex; align-items:center; gap:8px; padding: 12px 12px 8px; }
  .back-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:28px; height:28px; border-radius:6px; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .back-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .folder-header .fname{ font-size:14px; font-weight:600; letter-spacing:0.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-header .fcount{ font-size:11px; color:var(--muted); }

  .add-folder-row{ display:flex; gap:6px; padding: 8px 10px 4px; }
  .add-folder-row input{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:7px 8px; font-size:12px; }
  .add-folder-row input:focus{ outline:none; border-color:var(--gold-dim); }
  .add-folder-row button{ background:var(--gold); color:#181410; border:none; border-radius:5px; padding:0 10px; font-size:11px; font-weight:700; }
  .add-folder-row .cancel-x{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }

  .sidebar-foot{ border-top:1px solid var(--line); padding:10px; display:flex; gap:8px; background:var(--surface); position:sticky; bottom:0; flex-shrink:0; }
  .foot-btn{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:9px 4px; border-radius:5px; }
  .foot-btn:hover{ border-color: var(--gold-dim); color:var(--gold); }

  .main{ display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding: 10px 18px; border-bottom:1px solid var(--line); background:var(--surface); }
  .mobile-toggle{ display:none; background:none; border:1px solid var(--line); color:var(--text); border-radius:5px; width:34px; height:34px; }
  @media (max-width:800px){ .mobile-toggle{ display:block; } }

  .tool-group{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px; }
  .tool-btn{ background:transparent; border:none; color:var(--text); width:30px; height:30px; border-radius:5px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .tool-btn:hover{ background: rgba(232,163,61,0.15); color:var(--gold); }
  .tool-btn.on{ background: var(--gold); color:#181410; }
  .tool-btn.wide{ width:auto; padding:0 10px; font-size:11px; letter-spacing:1px; }
  .key-display{ min-width:52px; text-align:center; font-family:'Courier New',monospace; font-weight:700; color:var(--gold); font-size:13px; letter-spacing:1px; }

  .spacer{ flex:1; }
  .label-sm{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-right:2px; }
  .speed-slider{ width:80px; accent-color: var(--gold); }
  .fontsize-slider{ width:70px; accent-color: var(--teal); }

  .icon-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 12px; font-size:11px; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .icon-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }

  .stage{ flex:1; overflow-y:auto; overflow-x:hidden; padding: 28px 40px 200px; touch-action: pan-y; }
  @media (max-width:800px){ .stage{ padding: 20px 16px 200px; } }

  .song-title-row{ display:flex; align-items:baseline; gap:14px; margin-bottom:4px; flex-wrap:wrap; }
  .main-title{ font-size:30px; font-weight:700; letter-spacing:0.5px; }
  input.title-input{ background:none; border:none; color:var(--text); font-family:inherit; font-size:30px; font-weight:700; letter-spacing:0.5px; padding:2px 0; border-bottom:2px solid transparent; max-width: 100%; width:100%; }
  input.title-input:focus{ outline:none; border-bottom-color: var(--gold-dim); }
  .song-meta{ display:flex; gap:16px; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin-bottom:22px; align-items:center; }
  .song-meta input{ background:none; border:none; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; width:60px; border-bottom:1px dashed var(--line); }
  .song-meta input:focus{ outline:none; color:var(--teal); }
  .bpm-input{ background: var(--surface-2) !important; border:1px solid var(--teal) !important; color: var(--teal) !important; border-radius:6px; padding:6px 8px !important; width:56px !important; }
  .bpm-input:focus{ outline:none; border-color: var(--teal) !important; color: var(--text) !important; }
  .folder-select{ background: var(--surface-2); border:1px solid var(--gold-dim); color: var(--gold); font-family:inherit; font-size:12px; letter-spacing:0.5px; text-transform:uppercase; padding:6px 8px; border-radius:6px; max-width:150px; }
  .folder-select:focus{ outline:none; border-color: var(--gold); }
  .folder-new-row{ display:inline-flex; gap:6px; align-items:center; }
  .folder-new-row input{ background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); border-radius:5px; padding:6px 8px; font-size:12px; text-transform:none; letter-spacing:normal; width:110px; }
  .folder-new-row button{ background:var(--gold); color:#181410; border:none; border-radius:5px; padding:6px 9px; font-size:11px; font-weight:700; }
  .folder-new-row .cancel-x{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); padding:6px 9px; }

  .chart{ font-family: 'Roboto Mono', 'DejaVu Sans Mono', 'Consolas', 'Menlo', monospace; line-height: 2.15; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
  .chord-line{ color: var(--gold); font-weight:700; letter-spacing:0.5px; }
  .lyric-line{ color: var(--text); }
  .chord-tok{ background: rgba(232,163,61,0.14); color:var(--gold); padding:1px 5px; border-radius:4px; display:inline-block; margin-right:2px; font-weight:700; cursor:pointer; transition: background 0.12s, transform 0.12s; }
  .chord-tok:hover{ background: rgba(232,163,61,0.32); transform: translateY(-1px); }
  .blank-line{ height: 0.6em; }

  .chord-modal{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 24px 18px; width:220px; text-align:center; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .chord-modal h3{ margin:0 0 2px; font-size:24px; color:var(--gold); letter-spacing:0.5px; }
  .chord-modal .approx-note{ margin:0 0 10px; font-size:10px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; }
  .chord-modal .diagram-wrap{ display:flex; justify-content:center; margin: 6px 0 14px; }
  .chord-modal .close-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:8px 20px; border-radius:6px; font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .chord-modal .close-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }

  .editor-wrap{ display:flex; flex-direction:column; gap:10px; }
  .editor{ width:100%; min-height: 420px; background: var(--surface); border:1px solid var(--line); border-radius:8px; color: var(--text); font-family:'Courier New',monospace; font-size:14px; line-height:1.8; padding:16px; resize:vertical; }
  .editor:focus{ outline:none; border-color: var(--gold-dim); }
  .editor-hint{ color:var(--muted); font-size:12px; line-height:1.6; }
  .editor-hint code{ background:var(--surface-2); padding:1px 5px; border-radius:3px; color:var(--teal); }

  .empty-stage{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:14px; }
  .empty-stage .big{ font-size:44px; }
  .empty-stage h2{ margin:0; color:var(--text); font-weight:600; letter-spacing:1px; }
  .empty-stage p{ margin:0; font-size:13px; max-width:320px; line-height:1.6; }

  .file-input{ display:none; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); padding: 10px 18px; border-radius:8px; font-size:13px; letter-spacing:0.5px; z-index:60; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:70; }
  .countdown-badge{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:70; background: var(--gold); border:2px solid #f2b559; border-radius:16px; padding:14px 28px; text-align:center; box-shadow: 0 12px 32px rgba(0,0,0,0.5); display:flex; align-items:center; gap:16px; animation: countdownPulse 1s ease-in-out infinite; }
  @keyframes countdownPulse{ 0%,100%{ transform:translateX(-50%) scale(1); } 50%{ transform:translateX(-50%) scale(1.04); } }
  .countdown-label{ font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:#4a3611; font-weight:700; }
  .countdown-number{ font-size:56px; font-weight:800; color:#181410; line-height:1; }
  .countdown-badge .close-btn{ background:#181410; border:1px solid #181410; color:var(--gold); padding:6px 14px; border-radius:6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  .countdown-badge .close-btn:hover{ background:#241c14; }
  .confirm-box{ background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px 22px; max-width:320px; text-align:center; }
  .confirm-box p{ margin:0 0 16px; font-size:14px; color:var(--text); line-height:1.5; }
  .confirm-row{ display:flex; gap:10px; }
  .confirm-row button{ flex:1; padding:9px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .confirm-row .danger-btn{ background:var(--danger); border-color:var(--danger); color:#fff; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#9a8f80;">Loading your setlist…</div>
</div>
<div class="trademark">MEMAPHU™ · v11</div>

<script>
(function(){
  "use strict";

  var NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var FLAT_TO_SHARP = { Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#', Cb:'B', Fb:'E' };

  function normalizeRoot(root){ return FLAT_TO_SHARP[root] || root; }

  function transposeChordToken(token, steps){
    var m = token.match(/^([A-G](?:#|b)?)(.*)$/);
    if(!m) return token;
    var root = m[1], rest = m[2];
    var bass = '';
    var slashIdx = rest.indexOf('/');
    if(slashIdx !== -1){ bass = rest.slice(slashIdx); rest = rest.slice(0, slashIdx); }
    var norm = normalizeRoot(root);
    var idx = NOTES.indexOf(norm);
    if(idx === -1) return token;
    idx = (idx + steps % 12 + 12) % 12;
    var newRoot = NOTES[idx];
    var newBass = bass;
    if(bass){
      var bm = bass.match(/^\/([A-G](?:#|b)?)(.*)$/);
      if(bm){
        var bn = normalizeRoot(bm[1]);
        var bi = NOTES.indexOf(bn);
        if(bi !== -1){ bi = (bi + steps % 12 + 12) % 12; newBass = '/' + NOTES[bi] + bm[2]; }
      }
    }
    return newRoot + rest + newBass;
  }

  var CHORD_TOKEN_RE = /\[([^\]]+)\]/g;
  var CHORD_WORD_RE = /^[A-G](#|b)?[a-zA-Z0-9#b+\-]*(\/[A-G](#|b)?[a-zA-Z0-9#b+\-]*)?$/;
  var CHORD_WORD_GLOBAL_RE = /([A-G](?:#|b)?[a-zA-Z0-9#b+\-]*(?:\/[A-G](?:#|b)?[a-zA-Z0-9#b+\-]*)?)/g;
  // Tokens that commonly sit alongside chords in a chord line (bar separators like
  // "|", dashes, repeat counts like "x2"/"4x", or a section label like "Intro:")
  // shouldn't count against the line when deciding if it's a chord line.
  var FILLER_TOKEN_RE = /^[|xX\u00d7\-\u2013\u20140-9]+$/;
  var LABEL_TOKEN_RE = /^[A-Za-z]+:$/;

  function isLikelyChordLine(line){
    var trimmed = line.trim();
    if(!trimmed) return false;
    var tokens = trimmed.split(/\s+/);
    var relevant = 0;
    var chordish = 0;
    for(var i=0;i<tokens.length;i++){
      var tok = tokens[i];
      if(FILLER_TOKEN_RE.test(tok) || LABEL_TOKEN_RE.test(tok)) continue;
      relevant++;
      if(CHORD_WORD_RE.test(tok)) chordish++;
    }
    if(relevant === 0) return false;
    return (chordish / relevant) >= 0.6;
  }

  function transposeSongBody(body, steps){
    if(steps === 0) return body;
    var lines = body.split('\n');
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(/\[([^\]]+)\]/.test(line)){
        lines[i] = line.replace(/\[([^\]]+)\]/g, function(m, chord){ return '[' + transposeChordToken(chord, steps) + ']'; });
      } else if(isLikelyChordLine(line)){
        lines[i] = line.replace(CHORD_WORD_GLOBAL_RE, function(m){ return transposeChordToken(m, steps); });
      }
    }
    return lines.join('\n');
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderChartHtml(body){
    var lines = body.split('\n');
    var html = '';
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(line.trim() === ''){ html += '<div class="blank-line">&nbsp;</div>'; continue; }
      if(/\[([^\]]+)\]/.test(line)){
        var replaced = escapeHtml(line).replace(/\[([^\]]+)\]/g, function(m, chord){ return '<span class="chord-tok" data-chord="' + escapeHtml(chord) + '">' + chord + '</span>'; });
        html += '<div class="lyric-line">' + replaced + '</div>';
      } else if(isLikelyChordLine(line)){
        var replacedLine = escapeHtml(line).replace(CHORD_WORD_GLOBAL_RE, function(m){
          return '<span class="chord-tok" data-chord="' + escapeHtml(m) + '">' + m + '</span>';
        });
        html += '<div class="chord-line">' + replacedLine + '</div>';
      } else {
        html += '<div class="lyric-line">' + escapeHtml(line) + '</div>';
      }
    }
    return html;
  }

  // ---- Chord diagram engine ----
  // Hardcoded open-position shapes for natural roots (nicest, most familiar fingerings)
  var OPEN_SHAPES = {
    'C':      [-1,3,2,0,1,0],
    'Cmaj7':  [-1,3,2,0,0,0],
    'C7':     [-1,3,2,3,1,0],
    'D':      [-1,-1,0,2,3,2],
    'Dm':     [-1,-1,0,2,3,1],
    'D7':     [-1,-1,0,2,1,2],
    'E':      [0,2,2,1,0,0],
    'Em':     [0,2,2,0,0,0],
    'E7':     [0,2,0,1,0,0],
    'Emaj7':  [0,2,1,1,0,0],
    'Em7':    [0,2,0,0,0,0],
    'F':      [1,3,3,2,1,1],
    'Fmaj7':  [-1,-1,3,2,1,0],
    'G':      [3,2,0,0,0,3],
    'G7':     [3,2,0,0,0,1],
    'A':      [-1,0,2,2,2,0],
    'Am':     [-1,0,2,2,1,0],
    'A7':     [-1,0,2,0,2,0],
    'Am7':    [-1,0,2,0,1,0],
    'B':      [-1,2,4,4,4,2],
    'Bm':     [-1,2,4,4,3,2],
    'B7':     [-1,2,1,2,0,2]
  };
  // Movable E-shape barre templates (root note played on low-E string, open = E itself)
  var BARRE_TEMPLATES = {
    'maj':  [0,2,2,1,0,0],
    'm':    [0,2,2,0,0,0],
    '7':    [0,2,0,1,0,0],
    'maj7': [0,2,1,1,0,0],
    'm7':   [0,2,0,0,0,0],
    'sus4': [0,2,2,2,0,0],
    'sus2': [0,2,4,1,0,-1]
  };

  function normalizeQuality(rawSuffix){
    var s = (rawSuffix || '').toLowerCase();
    if(s === '') return { key: 'maj', exact: true };
    if(/^maj7/.test(s)) return { key: 'maj7', exact: true };
    if(/^(m7|min7|\-7)/.test(s)) return { key: 'm7', exact: true };
    if(/^sus4/.test(s)) return { key: 'sus4', exact: true };
    if(/^sus2/.test(s)) return { key: 'sus2', exact: true };
    if(/^(m|min)(?!aj)/.test(s)) return { key: 'm', exact: true };
    if(/^7/.test(s)) return { key: '7', exact: true };
    if(/^dim/.test(s)) return { key: 'm', exact: false };
    if(/^aug/.test(s)) return { key: 'maj', exact: false };
    if(/^m/.test(s)) return { key: 'm7', exact: false };
    return { key: '7', exact: false };
  }

  function getChordShape(chordToken){
    var m = chordToken.match(/^([A-G](?:#|b)?)(.*)$/);
    if(!m) return null;
    var rawRoot = m[1];
    var rest = m[2];
    // strip bass note for shape purposes
    var slashIdx = rest.indexOf('/');
    var suffix = slashIdx !== -1 ? rest.slice(0, slashIdx) : rest;
    var root = normalizeRoot(rawRoot);
    var q = normalizeQuality(suffix);

    // Try hardcoded open shape first (only for natural-letter roots without # )
    var naturalKey = rawRoot.length === 1 ? rawRoot : null;
    if(naturalKey){
      var tableKey = naturalKey + (q.key === 'maj' ? '' : q.key);
      if(OPEN_SHAPES[tableKey]){
        return { frets: OPEN_SHAPES[tableKey], exact: q.exact, label: chordToken };
      }
    }
    // Fallback: algorithmic barre chord (E-shape), shifted by semitone distance from E
    var template = BARRE_TEMPLATES[q.key] || BARRE_TEMPLATES['maj'];
    var idxRoot = NOTES.indexOf(root);
    var idxE = NOTES.indexOf('E');
    var offset = (idxRoot - idxE + 12) % 12;
    var frets = template.map(function(f){ return f === -1 ? -1 : f + offset; });
    return { frets: frets, exact: q.exact, label: chordToken };
  }

  function chordDiagramSVG(shape){
    var frets = shape.frets;
    var positives = frets.filter(function(f){ return f > 0; });
    var maxFret = positives.length ? Math.max.apply(null, positives) : 0;
    var startFret = (maxFret <= 4) ? 1 : Math.min.apply(null, positives);
    var numFretsShown = 4;
    var w = 160, h = 190;
    var leftPad = 26, topPad = 34, gridW = 108, gridH = 120;
    var stringGap = gridW / 5;
    var fretGap = gridH / numFretsShown;

    var svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

    // backing card
    svg += '<rect x="4" y="4" width="' + (w-8) + '" height="' + (h-8) + '" rx="10" fill="#251F1A" stroke="#3a2f24" stroke-width="1"></rect>';

    // faint fretboard wood-tone panel behind the grid
    svg += '<rect x="' + (leftPad-6) + '" y="' + (topPad-6) + '" width="' + (gridW+12) + '" height="' + (gridH+12) + '" rx="4" fill="#171310"></rect>';

    // string labels (x / o) above nut, only meaningful when showing from fret 1
    for(var s=0; s<6; s++){
      var x = leftPad + s * stringGap;
      var f = frets[s];
      var mark = '';
      if(startFret === 1){
        if(f === -1) mark = 'x';
        else if(f === 0) mark = 'o';
      } else if(f === -1){
        mark = 'x';
      }
      if(mark){
        svg += '<text x="' + x + '" y="' + (topPad - 10) + '" text-anchor="middle" font-size="12" fill="#9a8f80" font-family="Courier New, monospace">' + mark + '</text>';
      }
    }

    // position label if not starting at nut
    if(startFret !== 1){
      svg += '<text x="' + (leftPad - 18) + '" y="' + (topPad + fretGap/2 + 4) + '" text-anchor="middle" font-size="11" fill="#E8A33D" font-family="Courier New, monospace">' + startFret + 'fr</text>';
    }

    // nut or top line
    svg += '<rect x="' + leftPad + '" y="' + topPad + '" width="' + gridW + '" height="' + (startFret === 1 ? 4 : 2) + '" fill="' + (startFret === 1 ? '#F2EDE4' : '#5a5044') + '"></rect>';

    // fret lines
    for(var fr=0; fr<=numFretsShown; fr++){
      var y = topPad + fr * fretGap;
      svg += '<line x1="' + leftPad + '" y1="' + y + '" x2="' + (leftPad+gridW) + '" y2="' + y + '" stroke="#4a4034" stroke-width="1"></line>';
    }
    // string lines
    for(var st=0; st<6; st++){
      var sx = leftPad + st * stringGap;
      svg += '<line x1="' + sx + '" y1="' + topPad + '" x2="' + sx + '" y2="' + (topPad+gridH) + '" stroke="#4a4034" stroke-width="1"></line>';
    }

    // detect barre: same fret value repeated across 3+ adjacent strings (excluding -1)
    var barreFretVal = null, barreStart = -1, barreEnd = -1;
    for(var b=0;b<6;b++){
      if(frets[b] > 0){
        var runEnd = b;
        while(runEnd+1 < 6 && frets[runEnd+1] === frets[b]) runEnd++;
        if(runEnd - b >= 3){ barreFretVal = frets[b]; barreStart = b; barreEnd = runEnd; break; }
      }
    }
    if(barreFretVal !== null){
      var relFret = barreFretVal - startFret + 1;
      var by = topPad + (relFret - 0.5) * fretGap;
      var bx1 = leftPad + barreStart * stringGap;
      var bx2 = leftPad + barreEnd * stringGap;
      svg += '<line x1="' + bx1 + '" y1="' + by + '" x2="' + bx2 + '" y2="' + by + '" stroke="#E8A33D" stroke-width="10" stroke-linecap="round" opacity="0.85"></line>';
    }

    // dots for fretted notes
    for(var d=0; d<6; d++){
      var fv = frets[d];
      if(fv > 0){
        var isPartOfBarre = barreFretVal !== null && fv === barreFretVal && d >= barreStart && d <= barreEnd;
        if(isPartOfBarre) continue;
        var dx = leftPad + d * stringGap;
        var relF = fv - startFret + 1;
        var dy = topPad + (relF - 0.5) * fretGap;
        svg += '<circle cx="' + dx + '" cy="' + dy + '" r="9" fill="#181410" opacity="0.6"></circle>';
        svg += '<circle cx="' + dx + '" cy="' + dy + '" r="8" fill="#E8A33D"></circle>';
        svg += '<circle cx="' + (dx-2.5) + '" cy="' + (dy-2.5) + '" r="2" fill="#f7d9a3" opacity="0.7"></circle>';
      }
    }

    svg += '</svg>';
    return svg;
  }

  // Maps a song's BPM to a 1-10 auto-scroll speed so faster songs scroll faster

  function computeScrollSpeedFromBpm(bpmVal){
    var n = parseInt(bpmVal, 10);
    if(!n || isNaN(n) || n <= 0) return null;
    var speed = Math.round(n / 20);
    return Math.max(1, Math.min(10, speed));
  }

  // Local (device) storage: this is the primary store so the app works fully
  // offline / standalone (installed PWA or APK), where window.storage is not available.
  var LS_PREFIX = 'gigsonghits:';
  function lsGet(key){
    try{
      var raw = localStorage.getItem(LS_PREFIX + key);
      return raw === null ? null : { key: key, value: raw };
    }catch(e){ return null; }
  }
  function lsSet(key, value){
    try{ localStorage.setItem(LS_PREFIX + key, value); return { key: key, value: value }; }
    catch(e){ return null; }
  }
  function lsDelete(key){
    try{ localStorage.removeItem(LS_PREFIX + key); return { key: key, deleted: true }; }
    catch(e){ return null; }
  }

  // Claude-artifact storage (window.storage) is used opportunistically as an extra
  // sync layer when this file happens to run inside a Claude.ai preview; it is never
  // required, so the app works the same standalone (browser, PWA, APK).
  async function safeStorageGet(key){
    var local = lsGet(key);
    if(local) return local;
    try{
      if(window.storage){
        var r = await window.storage.get(key);
        if(r) return r;
      }
    }catch(e){}
    return null;
  }
  async function safeStorageSet(key, value){
    var res = lsSet(key, value);
    try{ if(window.storage) await window.storage.set(key, value); }catch(e){}
    return res;
  }
  async function safeStorageDelete(key){
    var res = lsDelete(key);
    try{ if(window.storage) await window.storage.delete(key); }catch(e){}
    return res;
  }

  async function persistIndex(list){
    await safeStorageSet('song-index', JSON.stringify(list.map(function(s){ return s.id; })));
  }
  async function persistSong(song){
    await safeStorageSet('song:' + song.id, JSON.stringify(song));
  }
  async function persistFolderList(){
    await safeStorageSet('folder-list', JSON.stringify(state.folderList));
  }

  // Union of the persisted folder list and any folder names in use by songs,
  // so a folder never "disappears" even if it wasn't explicitly created first.
  function getFolders(){
    var names = state.folderList.slice();
    state.songs.forEach(function(s){
      var f = s.folder || 'Gig';
      if(names.indexOf(f) === -1) names.push(f);
    });
    return names;
  }

  async function ensureFolder(name){
    var trimmed = (name || '').trim();
    if(!trimmed) return;
    if(state.folderList.indexOf(trimmed) === -1){
      state.folderList.push(trimmed);
      await persistFolderList();
    }
  }

  async function loadSongs(){
    var flRes = await safeStorageGet('folder-list');
    try{
      var fl = flRes && flRes.value ? JSON.parse(flRes.value) : null;
      if(fl && fl.length) state.folderList = fl;
      else await persistFolderList(); // seed defaults on first run
    }catch(e){ await persistFolderList(); }

    var idxRes = await safeStorageGet('song-index');
    var ids = [];
    try{ ids = idxRes && idxRes.value ? JSON.parse(idxRes.value) : []; }catch(e){ ids = []; }

    if(!ids || ids.length === 0){
      var id = uid();
      var song = { id: id, title: "Ate", key: "G", bpm: "", folder: "Gig", body: SAMPLE_BODY };
      await persistSong(song);
      await persistIndex([song]);
      state.songs = [song];
      state.activeId = id;
      render();
      return;
    }

    var loaded = [];
    for(var i=0;i<ids.length;i++){
      var r = await safeStorageGet('song:' + ids[i]);
      if(r && r.value){
        try{
          var parsed = JSON.parse(r.value);
          if(!parsed.folder) parsed.folder = 'Gig'; // migrate older songs saved before folders existed
          loaded.push(parsed);
        }catch(e){}
      }
    }
    if(loaded.length === 0){
      var id2 = uid();
      var song2 = { id: id2, title: "Ate", key: "G", bpm: "", folder: "Gig", body: SAMPLE_BODY };
      loaded = [song2];
      await persistSong(song2);
      await persistIndex(loaded);
    }
    state.songs = loaded;
    state.activeId = loaded[0].id;
    var initSpeed = computeScrollSpeedFromBpm(loaded[0].bpm);
    if(initSpeed) state.scrollSpeed = initSpeed;
    render();
  }

  // Renaming updates the folder-list entry (or merges into an existing folder of
  // the target name) and re-tags every song currently filed under the old name.
  async function renameFolder(oldName, newName){
    var trimmed = (newName || '').trim();
    if(!trimmed || trimmed === oldName){ state.renamingFolder = null; render(); return; }

    var idx = state.folderList.indexOf(oldName);
    if(idx !== -1){
      if(state.folderList.indexOf(trimmed) === -1){
        state.folderList[idx] = trimmed;
      } else {
        // Target name already exists as a folder — merge by dropping the old entry.
        state.folderList.splice(idx, 1);
      }
    } else {
      await ensureFolder(trimmed);
    }
    await persistFolderList();

    for(var i=0;i<state.songs.length;i++){
      var s = state.songs[i];
      if((s.folder || 'Gig') === oldName){
        s.folder = trimmed;
        await persistSong(s);
      }
    }
    if(state.currentFolder === oldName) state.currentFolder = trimmed;
    state.renamingFolder = null;
    render();
    showToast('Napalitan ang pangalan sa "' + trimmed + '"');
  }

  // Deleting a folder never deletes songs — any song still filed under it gets
  // moved to "Gig" so nothing accidentally disappears.
  async function deleteFolderConfirmed(){
    var name = state.confirmDeleteFolder;
    if(!name) return;
    var moved = 0;
    for(var i=0;i<state.songs.length;i++){
      var s = state.songs[i];
      if((s.folder || 'Gig') === name && name !== 'Gig'){
        s.folder = 'Gig';
        moved++;
        await persistSong(s);
      }
    }
    state.folderList = state.folderList.filter(function(f){ return f !== name; });
    await persistFolderList();
    if(state.currentFolder === name) state.currentFolder = null;
    state.confirmDeleteFolder = null;
    render();
    showToast(moved > 0 ? ('Tinanggal ang folder. ' + moved + ' kanta inilipat sa "Gig"') : 'Tinanggal ang folder');
  }

  function handleImportFile(e){

      var text = ev.target.result;
      var title = file.name.replace(/\.(txt|cho|chopro|crd)$/i, '');
      var targetFolder = state.currentFolder || 'Gig';
      var song = { id: uid(), title: title, key: "C", bpm: "", folder: targetFolder, body: text.replace(/\s+$/,'') };
      state.songs.unshift(song);
      state.activeId = song.id;
      state.mode = 'view';
      state.transposeSteps = 0;
      state.sidebarView = 'folderSongs';
      state.currentFolder = targetFolder;
      await ensureFolder(targetFolder);
      await persistSong(song);
      await persistIndex(state.songs);
      render();
      showToast('Imported "' + title + '"');

    reader.readAsText(file);

  function filenameFromUrl(url){
    try{
      var urlObj = new URL(url);
      var parts = urlObj.pathname.split('/').filter(Boolean);
      if(parts.length){
        var last = decodeURIComponent(parts[parts.length - 1]).replace(/\.(txt|cho|chopro|crd)$/i, '');
        if(last) return last;
      }
    }catch(e){}
    return 'Imported Song';
  }

  async function handleImportFromUrl(){
    var input = document.getElementById('url-import-input');
    var url = input ? input.value.trim() : '';
    if(!url){ state.urlImportError = 'Maglagay muna ng link.'; render(); focusUrlInput(); return; }
    if(!/^https?:\/\//i.test(url)){ state.urlImportError = 'Kailangan magsimula sa http:// o https://'; render(); focusUrlInput(); return; }

    state.urlImportValue = url;
    state.urlImportBusy = true;
    state.urlImportError = null;
    render();

    try{
      var res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var text = await res.text();
      if(!text || !text.trim()) throw new Error('empty');

      var title = filenameFromUrl(url);
      var targetFolder = state.currentFolder || 'Gig';
      var song = { id: uid(), title: title, key: "C", bpm: "", folder: targetFolder, body: text.replace(/\s+$/, ''), sourceUrl: url };

      state.songs.unshift(song);
      state.activeId = song.id;
      state.mode = 'view';
      state.transposeSteps = 0;
      state.sidebarView = 'folderSongs';
      state.currentFolder = targetFolder;
      await ensureFolder(targetFolder);
      await persistSong(song);
      await persistIndex(state.songs);

      state.urlImportOpen = false;
      state.urlImportBusy = false;
      state.urlImportValue = '';
      render();
      showToast('Na-import mula sa link: "' + title + '"');
    }catch(err){
      state.urlImportBusy = false;
      var msg = 'Hindi ma-fetch ang link.';
      if(err && err.message === 'empty'){
        msg = 'Walang laman ang file sa link na ibinigay.';
      } else if(err && /Failed to fetch|NetworkError|TypeError/i.test(err.message || '')){
        msg = 'Hindi ma-access ang link. Baka naka-block ng CORS ang website, private ang file, o walang internet.';
      } else if(err && err.message){
        msg = 'Hindi ma-fetch: ' + err.message;
      }
      state.urlImportError = msg;
      render();
      focusUrlInput();
    }
  }

  function handleExport(){
    var song = getActiveSong();
    if(!song) return;
    var body = transposeSongBody(song.body, state.transposeSteps);
    var keyDisp = song.key ? transposeChordToken(song.key, state.transposeSteps) : '';
    var header = song.title + (keyDisp ? ' - Key of ' + keyDisp : '') + '\n\n';
    var blob = new Blob([header + body], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (song.title || 'song').replace(/[^a-z0-9\-_ ]/gi,'').trim() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Exported as .txt');
  }

  function handleExportJSON(){

      songs: state.songs
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'gig-song-hits-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Na-export ang buong setlist (JSON)');
  }

  function handleImportJSONFile(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        var incomingSongs = Array.isArray(data.songs) ? data.songs : (Array.isArray(data) ? data : null);
        if(!incomingSongs) throw new Error('invalid');
        var addedCount = 0;
        for(var i=0;i<incomingSongs.length;i++){
          var s = incomingSongs[i];
          if(!s || !s.title) continue;
          var song = {
            id: uid(),
            title: s.title || 'Untitled',
            key: s.key || 'C',
            bpm: s.bpm || '',
            folder: s.folder || 'Gig',
            body: s.body || ''
          };
          state.songs.push(song);
          await ensureFolder(song.folder);
          await persistSong(song);
          addedCount++;
        }
        if(Array.isArray(data.folderList)){
          data.folderList.forEach(function(f){ if(state.folderList.indexOf(f) === -1) state.folderList.push(f); });
          await persistFolderList();
        }
        await persistIndex(state.songs);
        render();
        showToast('Na-import ang ' + addedCount + ' kanta mula sa JSON');
      }catch(err){
        showToast('Hindi ma-import: invalid JSON file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function stopAutoScroll(){
    if(scrollAnimId) cancelAnimationFrame(scrollAnimId);
    scrollAnimId = null;
  }

  var userTouchingStage = false;

  function startAutoScroll(){
    stopAutoScroll();
    var el = document.getElementById('stage');
    if(!el) return;
    var lastTs = null;
    // Float accumulator avoids sub-pixel rounding loss at slow speeds, but is
    // resynced to the real scrollTop whenever the user is touching the screen,
    // so manual scroll always wins and autoscroll resumes from there smoothly.
    var pos = el.scrollTop;
    function step(ts){
      if(!state.autoScroll){ return; }
      if(lastTs == null){ lastTs = ts; pos = el.scrollTop; scrollAnimId = requestAnimationFrame(step); return; }
      var dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if(userTouchingStage){
        // Fully hands-off while the user is scrolling manually.
        pos = el.scrollTop;
        scrollAnimId = requestAnimationFrame(step);
        return;
      }
      var pxPerSec = 4 + state.scrollSpeed * 4; // gentler range: ~8px/s to ~44px/s
      pos += pxPerSec * dt;
      el.scrollTop = pos;
      if(el.scrollTop + el.clientHeight >= el.scrollHeight - 2){
        state.autoScroll = false;
        renderToolbarOnly();
        return;
      }
      scrollAnimId = requestAnimationFrame(step);
    }
    scrollAnimId = requestAnimationFrame(step);
  }

  function toggleAutoScroll(){
    if(state.autoScroll){
      // Pausing keeps scrollStarted=true, so pressing play again just resumes.
      state.autoScroll = false;
      stopAutoScroll();
      renderToolbarOnly();
      return;
    }
    if(state.countdownRemaining != null){
      // Already counting down — treat a second click as cancel.
      stopCountdown();
      render();
      return;
    }
    if(state.scrollStarted){
      // Resuming after a pause — no need to count in again.
      state.autoScroll = true;
      startAutoScroll();
      renderToolbarOnly();
      return;
    }
    startCountdown();
  }

  function startCountdown(){
    stopCountdown();
    if(!state.countInSeconds || state.countInSeconds <= 0){
      state.autoScroll = true;
      state.scrollStarted = true;
      startAutoScroll();
      renderToolbarOnly();
      return;
    }
    state.countdownRemaining = state.countInSeconds;
    render();
    countdownTimerId = setInterval(function(){
      state.countdownRemaining -= 1;
      if(state.countdownRemaining <= 0){
        clearInterval(countdownTimerId);
        countdownTimerId = null;
        state.countdownRemaining = null;
        state.autoScroll = true;
        state.scrollStarted = true;
        render();
        startAutoScroll();
      } else {
        var numEl = document.getElementById('countdown-number');
        if(numEl) numEl.textContent = state.countdownRemaining;
      }
    }, 1000);
  }

  function stopCountdown(){
    if(countdownTimerId){ clearInterval(countdownTimerId); countdownTimerId = null; }
    state.countdownRemaining = null;
  }

    if(byId('btn-confirm-urlimport')) byId('btn-confirm-urlimport').onclick = handleImportFromUrl;
    if(byId('urlimport-overlay')) byId('urlimport-overlay').onclick = function(e){ if(e.target.id === 'urlimport-overlay') closeUrlImport(); };
    var urlImportInput = byId('url-import-input');
    if(urlImportInput){
      urlImportInput.onkeydown = function(e){
        if(e.key === 'Enter'){ e.preventDefault(); handleImportFromUrl(); }
        if(e.key === 'Escape') closeUrlImport();
      };
    }

    var fileInputJson = byId('file-input-json');
    if(fileInputJson) fileInputJson.onchange = handleImportJSONFile;
    if(byId('btn-backup-json')) byId('btn-backup-json').onclick = handleExportJSON;
    if(byId('btn-restore-json')) byId('btn-restore-json').onclick = function(){ fileInputJson.click(); };

    if(byId('btn-key-down')) byId('btn-key-down').onclick = function(){ state.transposeSteps -= 1; render(); };
    if(byId('btn-key-up')) byId('btn-key-up').onclick = function(){ state.transposeSteps += 1; render(); };
    if(byId('btn-key-reset')) byId('btn-key-reset').onclick = function(){ state.transposeSteps = 0; render(); };

    if(byId('btn-autoscroll')) byId('btn-autoscroll').onclick = toggleAutoScroll;
    if(byId('range-speed')) byId('range-speed').oninput = function(e){ state.scrollSpeed = Number(e.target.value); };
    if(byId('count-in-input')) byId('count-in-input').oninput = function(e){
      var v = Number(e.target.value);
      state.countInSeconds = isNaN(v) ? 0 : Math.max(0, Math.min(15, v));
    };
    if(byId('btn-cancel-countdown')) byId('btn-cancel-countdown').onclick = function(){ stopCountdown(); render(); };
    if(byId('countdown-overlay')) byId('countdown-overlay').onclick = function(e){ if(e.target.id === 'countdown-overlay'){ stopCountdown(); render(); } };
    if(byId('range-font')) byId('range-font').oninput = function(e){
      state.fontSize = Number(e.target.value);
      var chart = document.querySelector('.chart');
      if(chart) chart.style.fontSize = state.fontSize + 'px';
    };

    // Touch handling on the lyrics area does two things:
    // 1) Tracks whether the user currently has a finger down, so autoscroll
    //    (see startAutoScroll) steps aside and lets manual scrolling take over.
    // 2) Two-finger pinch resizes the font directly (native browser pinch-zoom
    //    is blocked via touch-action:pan-y in CSS, so this replaces it).
    var stageEl = byId('stage');
    if(stageEl){
      var pinchStartDist = null;
      var pinchStartFont = null;
      function touchDist(touches){
        var dx = touches[0].clientX - touches[1].clientX;
        var dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
      }
      stageEl.addEventListener('touchstart', function(e){
        userTouchingStage = true;
        if(e.touches.length === 2){
          e.preventDefault();
          pinchStartDist = touchDist(e.touches);
          pinchStartFont = state.fontSize;
        }
      }, { passive: false });
      stageEl.addEventListener('touchmove', function(e){
        if(e.touches.length === 2){
          e.preventDefault();
          if(!pinchStartDist){
            pinchStartDist = touchDist(e.touches);
            pinchStartFont = state.fontSize;
            return;
          }
          var newDist = touchDist(e.touches);
          var ratio = newDist / pinchStartDist;
          var newSize = Math.round(pinchStartFont * ratio);
          newSize = Math.max(12, Math.min(36, newSize));
          if(newSize !== state.fontSize){
            state.fontSize = newSize;
            var chart = document.querySelector('.chart');
            if(chart) chart.style.fontSize = state.fontSize + 'px';
            var slider = byId('range-font');
            if(slider) slider.value = state.fontSize;
          }
        }
      }, { passive: false });
      stageEl.addEventListener('touchend', function(e){
        if(e.touches.length < 2){ pinchStartDist = null; pinchStartFont = null; }
        if(e.touches.length === 0){ userTouchingStage = false; }
      }, { passive: true });
      stageEl.addEventListener('touchcancel', function(e){
        pinchStartDist = null; pinchStartFont = null; userTouchingStage = false;
      }, { passive: true });
    }

    if(byId('btn-toggle-mode')) byId('btn-toggle-mode').onclick = function(){
      state.mode = state.mode === 'edit' ? 'view' : 'edit';
      state.editorNewFolder = false;
      render();
      if(state.mode === 'edit') focusTitleInput();
    };

    if(byId('btn-export')) byId('btn-export').onclick = handleExport;
    if(byId('btn-delete')) byId('btn-delete').onclick = function(){ state.confirmDelete = state.activeId; render(); };
    if(byId('btn-cancel-delete')) byId('btn-cancel-delete').onclick = function(){ state.confirmDelete = null; render(); };
    if(byId('btn-confirm-delete')) byId('btn-confirm-delete').onclick = function(){ deleteSong(state.confirmDelete); };
    if(byId('confirm-overlay')) byId('confirm-overlay').onclick = function(e){ if(e.target.id === 'confirm-overlay'){ state.confirmDelete = null; render(); } };

    if(byId('btn-close-chord')) byId('btn-close-chord').onclick = function(){ state.chordModal = null; render(); };
    if(byId('chord-overlay')) byId('chord-overlay').onclick = function(e){ if(e.target.id === 'chord-overlay'){ state.chordModal = null; render(); } };

    var editTitle = byId('edit-title');
    if(editTitle){
      editTitle.oninput = function(e){ updateActiveSong({ title: e.target.value }); refreshSidebarLabelsSoft(); };
    }
    var editKey = byId('edit-key');
    if(editKey) editKey.oninput = function(e){ updateActiveSong({ key: e.target.value }); refreshSidebarLabelsSoft(); };
    var editBpm = byId('edit-bpm');
    if(editBpm) editBpm.oninput = function(e){
      updateActiveSong({ bpm: e.target.value });
      refreshSidebarLabelsSoft();
      var sp = computeScrollSpeedFromBpm(e.target.value);
      if(sp){
        state.scrollSpeed = sp;
        var slider = byId('range-speed');
        if(slider) slider.value = sp;
      }
    };
    var editFolder = byId('edit-folder');
    if(editFolder) editFolder.onchange = async function(e){
      var val = e.target.value;
      if(val === '__new__'){
        state.editorNewFolder = true;
        render();
        var nf = byId('edit-folder-new-input');
        if(nf) nf.focus();
        return;
      }
      val = val.trim() || 'Gig';
      await updateActiveSong({ folder: val });
      await ensureFolder(val);
      state.currentFolder = val;
      render();
    };
    var newFolderConfirmBtn = byId('btn-editor-newfolder-confirm');
    if(newFolderConfirmBtn) newFolderConfirmBtn.onclick = async function(){
      var inp = byId('edit-folder-new-input');
      var val = inp ? inp.value.trim() : '';
      if(!val){ state.editorNewFolder = false; render(); return; }
      await updateActiveSong({ folder: val });
      await ensureFolder(val);
      state.currentFolder = val;
      state.editorNewFolder = false;
      render();
      showToast('Folder "' + val + '" added');
    };
    var newFolderCancelBtn = byId('btn-editor-newfolder-cancel');
    if(newFolderCancelBtn) newFolderCancelBtn.onclick = function(){ state.editorNewFolder = false; render(); };
    var editFolderNewInput = byId('edit-folder-new-input');
    if(editFolderNewInput){
      editFolderNewInput.onkeydown = function(e){
        if(e.key === 'Enter'){ e.preventDefault(); newFolderConfirmBtn.click(); }
        if(e.key === 'Escape'){ state.editorNewFolder = false; render(); }
      };
    }
    var editBody = byId('edit-body');
    if(editBody) editBody.oninput = function(e){ updateActiveSong({ body: e.target.value }); };

    if(state.autoScroll) startAutoScroll();
  }

  function refreshSidebarLabelsSoft(){
    var song = getActiveSong();
    if(!song) return;
    var el = document.querySelector('.song-item[data-id="' + song.id + '"]');
    if(el){
      var t = el.querySelector('.t');
      var k = el.querySelector('.k');
      if(t) t.textContent = song.title || 'Untitled';
      if(k) k.textContent = 'Key ' + (song.key || '\u2014') + (song.bpm ? ' \u00b7 ' + song.bpm + ' bpm' : '');
    }
  }

  document.addEventListener('click', function(e){
    var el = e.target;
    if(el && el.classList && el.classList.contains('chord-tok')){
      state.chordModal = el.getAttribute('data-chord');
      render();
    }
  });

  loadSongs();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
