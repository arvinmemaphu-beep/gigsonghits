<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  :root{
    --bg: #0F0D0B;
    --surface: #1C1815;
    --surface-2: #251F1A;
    --line: #34291f;
    --gold: #E8A33D;
    --gold-dim: #8a662a;
    --teal: #4FA8A0;
    --text: #F2EDE4;
    --muted: #9a8f80;
    --danger: #c96256;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); height:100%; }
  body{
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% -10%, rgba(232,163,61,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(79,168,160,0.08), transparent 40%);
  }
  #root{ min-height:100vh; }
  ::selection{ background: var(--gold); color:#141210; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--surface); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--gold-dim); }

  .app{ display:grid; grid-template-columns: 280px 1fr; height:100vh; height:100dvh; }
  @media (max-width: 800px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ display:none; }
    .sidebar.open{ display:flex; position:fixed; inset:0; z-index:40; height:100vh; height:100dvh; width:100vw; }
  }

  .sidebar{ background: var(--surface); border-right: 1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  .brand{ padding: 18px 16px 14px 16px; border-bottom: 1px solid var(--line); }
  .brand-mark{ display:flex; align-items:baseline; gap:6px; }
  .brand-mark .bolt{ color:var(--gold); font-size:20px; }
  .brand h1{ margin:0; font-size:20px; letter-spacing:1px; font-weight:700; text-transform:uppercase; }
  .brand p{ margin:4px 0 0; font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
  .trademark{ position:fixed; bottom:8px; right:12px; font-size:10px; letter-spacing:2px; color:var(--gold-dim); text-transform:uppercase; z-index:5; pointer-events:none; opacity:0.85; }

  .setlist-head{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px 8px; }
  .setlist-head span{ font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  .new-btn{ background: var(--gold); color:#181410; border:none; border-radius:4px; width:24px; height:24px; font-size:16px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; }
  .new-btn:hover{ background:#f2b559; }

  .song-list{ overflow-y:auto; flex:1; padding: 4px 8px 12px; }
  .song-item{ padding:10px 10px; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; gap:2px; border:1px solid transparent; margin-bottom:3px; }
  .song-item:hover{ background: var(--surface-2); }
  .song-item.active{ background: rgba(232,163,61,0.10); border-color: var(--gold-dim); }
  .song-item .t{ font-size:14px; font-weight:500; color:var(--text); }
  .song-item .k{ font-size:11px; color:var(--teal); letter-spacing:1px; }
  .empty-hint{ padding: 20px 16px; color:var(--muted); font-size:12px; line-height:1.6; }

  .folder-card{ display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-bottom:5px; }
  .folder-card:hover{ background: var(--surface-2); border-color: var(--line); }
  .folder-card .ico{ font-size:18px; }
  .folder-card .info{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .folder-card .name{ font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-card .count{ font-size:11px; color:var(--muted); letter-spacing:0.5px; }
  .folder-card.all{ background: rgba(79,168,160,0.08); border-color: rgba(79,168,160,0.25); }
  .folder-card.all .ico{ color: var(--teal); }
  .folder-actions{ display:flex; gap:4px; flex-shrink:0; }
  .folder-action-btn{ background:transparent; border:1px solid var(--line); color:var(--muted); width:26px; height:26px; border-radius:5px; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .folder-action-btn:hover{ border-color: var(--gold-dim); color: var(--gold); background: rgba(232,163,61,0.08); }
  .folder-action-btn.danger:hover{ border-color: var(--danger); color: var(--danger); background: rgba(201,98,86,0.10); }
  .folder-card.renaming{ cursor:default; }
  .rename-folder-input{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); border-radius:5px; padding:6px 8px; font-size:13px; }
  .rename-folder-input:focus{ outline:none; border-color: var(--gold); }

  .search-row{ position:relative; padding: 8px 12px 6px; }
  .search-row input[type="search"]{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 30px 8px 10px; font-size:13px; }
  .search-row input[type="search"]::-webkit-search-cancel-button{ display:none; }
  .search-row input[type="search"]:focus{ outline:none; border-color:var(--gold-dim); }
  .search-row input[type="search"]::placeholder{ color:var(--muted); }
  .search-clear{ position:absolute; right:18px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); font-size:13px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .search-clear:hover{ color:var(--gold); background:rgba(232,163,61,0.12); }

  .folder-header{ display:flex; align-items:center; gap:8px; padding: 12px 12px 8px; }
  .back-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:28px; height:28px; border-radius:6px; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .back-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .folder-header .fname{ font-size:14px; font-weight:600; letter-spacing:0.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-header .fcount{ font-size:11px; color:var(--muted); }

  .add-folder-row{ display:flex; gap:6px; padding: 8px 10px 4px; }
  .add-folder-row input{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:7px 8px; font-size:12px; }
  .add-folder-row input:focus{ outline:none; border-color:var(--gold-dim); }
  .add-folder-row button{ background:var(--gold); color:#181410; border:none; border-radius:5px; padding:0 10px; font-size:11px; font-weight:700; }
  .add-folder-row .cancel-x{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }

  .sidebar-foot{ border-top:1px solid var(--line); padding:10px; display:flex; gap:8px; background:var(--surface); position:sticky; bottom:0; flex-shrink:0; }
  .foot-btn{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:9px 4px; border-radius:5px; }
  .foot-btn:hover{ border-color: var(--gold-dim); color:var(--gold); }

  .main{ display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding: 10px 18px; border-bottom:1px solid var(--line); background:var(--surface); }
  .mobile-toggle{ display:none; background:none; border:1px solid var(--line); color:var(--text); border-radius:5px; width:34px; height:34px; }
  @media (max-width:800px){ .mobile-toggle{ display:block; } }

  .tool-group{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px; }
  .tool-btn{ background:transparent; border:none; color:var(--text); width:30px; height:30px; border-radius:5px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .tool-btn:hover{ background: rgba(232,163,61,0.15); color:var(--gold); }
  .tool-btn.on{ background: var(--gold); color:#181410; }
  .tool-btn.wide{ width:auto; padding:0 10px; font-size:11px; letter-spacing:1px; }
  .key-display{ min-width:52px; text-align:center; font-family:'Courier New',monospace; font-weight:700; color:var(--gold); font-size:13px; letter-spacing:1px; }

  .spacer{ flex:1; }
  .label-sm{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-right:2px; }
  .speed-slider{ width:80px; accent-color: var(--gold); }
  .fontsize-slider{ width:70px; accent-color: var(--teal); }

  .icon-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 12px; font-size:11px; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .icon-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }

  .stage{ flex:1; overflow-y:auto; overflow-x:hidden; padding: 28px 40px 200px; touch-action: pan-y; }
  @media (max-width:800px){ .stage{ padding: 20px 16px 200px; } }

  .song-title-row{ display:flex; align-items:baseline; gap:14px; margin-bottom:4px; flex-wrap:wrap; }
  .main-title{ font-size:30px; font-weight:700; letter-spacing:0.5px; }
  input.title-input{ background:none; border:none; color:var(--text); font-family:inherit; font-size:30px; font-weight:700; letter-spacing:0.5px; padding:2px 0; border-bottom:2px solid transparent; max-width: 100%; width:100%; }
  input.title-input:focus{ outline:none; border-bottom-color: var(--gold-dim); }
  .song-meta{ display:flex; gap:16px; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin-bottom:22px; align-items:center; }
  .song-meta input{ background:none; border:none; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; width:60px; border-bottom:1px dashed var(--line); }
  .song-meta input:focus{ outline:none; color:var(--teal); }
  .bpm-input{ background: var(--surface-2) !important; border:1px solid var(--teal) !important; color: var(--teal) !important; border-radius:6px; padding:6px 8px !important; width:56px !important; }
  .bpm-input:focus{ outline:none; border-color: var(--teal) !important; color: var(--text) !important; }
  .folder-select{ background: var(--surface-2); border:1px solid var(--gold-dim); color: var(--gold); font-family:inherit; font-size:12px; letter-spacing:0.5px; text-transform:uppercase; padding:6px 8px; border-radius:6px; max-width:150px; }
  .folder-select:focus{ outline:none; border-color: var(--gold); }
  .folder-new-row{ display:inline-flex; gap:6px; align-items:center; }
  .folder-new-row input{ background:var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); border-radius:5px; padding:6px 8px; font-size:12px; text-transform:none; letter-spacing:normal; width:110px; }
  .folder-new-row button{ background:var(--gold); color:#181410; border:none; border-radius:5px; padding:6px 9px; font-size:11px; font-weight:700; }
  .folder-new-row .cancel-x{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); padding:6px 9px; }

  .chart{ font-family: 'Roboto Mono', 'DejaVu Sans Mono', 'Consolas', 'Menlo', monospace; line-height: 2.15; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
  .chord-line{ color: var(--gold); font-weight:700; letter-spacing:0.5px; }
  .lyric-line{ color: var(--text); }
  .chord-tok{ background: rgba(232,163,61,0.14); color:var(--gold); padding:1px 5px; border-radius:4px; display:inline-block; margin-right:2px; font-weight:700; cursor:pointer; transition: background 0.12s, transform 0.12s; }
  .chord-tok:hover{ background: rgba(232,163,61,0.32); transform: translateY(-1px); }
  .blank-line{ height: 0.6em; }

  .chord-modal{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 24px 18px; width:220px; text-align:center; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .chord-modal h3{ margin:0 0 2px; font-size:24px; color:var(--gold); letter-spacing:0.5px; }
  .chord-modal .approx-note{ margin:0 0 10px; font-size:10px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; }
  .chord-modal .diagram-wrap{ display:flex; justify-content:center; margin: 6px 0 14px; }
  .chord-modal .close-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:8px 20px; border-radius:6px; font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .chord-modal .close-btn:hover{ border-color:var(--gold-dim); color:var(--gold); }

  .editor-wrap{ display:flex; flex-direction:column; gap:10px; }
  .editor-highlight-wrap{ position:relative; width:100%; min-height:420px; }
  .editor-backdrop{ position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; box-sizing:border-box; margin:0; overflow:hidden; background: var(--surface); border:1px solid var(--line); border-radius:8px; color: var(--text); font-family:'Courier New',monospace; font-size:14px; line-height:1.8; padding:16px; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word; pointer-events:none; }
  .chord-tok-edit{ color: var(--gold); font-weight:700; }
  .editor{ position:relative; z-index:1; width:100%; height:100%; min-height:420px; box-sizing:border-box; background: transparent; border:1px solid transparent; border-radius:8px; color: transparent; caret-color: var(--text); font-family:'Courier New',monospace; font-size:14px; line-height:1.8; padding:16px; resize:vertical; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word; }
  .editor:focus{ outline:none; }
  .editor:focus ~ .editor-backdrop, .editor-highlight-wrap:focus-within .editor-backdrop{ border-color: var(--gold-dim); }
  .editor-hint{ color:var(--muted); font-size:12px; line-height:1.6; }
  .editor-hint code{ background:var(--surface-2); padding:1px 5px; border-radius:3px; color:var(--teal); }

  .empty-stage{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:14px; }
  .empty-stage .big{ font-size:44px; }
  .empty-stage h2{ margin:0; color:var(--text); font-weight:600; letter-spacing:1px; }
  .empty-stage p{ margin:0; font-size:13px; max-width:320px; line-height:1.6; }

  .file-input{ display:none; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background: var(--surface-2); border:1px solid var(--gold-dim); color:var(--text); padding: 10px 18px; border-radius:8px; font-size:13px; letter-spacing:0.5px; z-index:200; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:70; }
  .countdown-badge{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:70; background: var(--gold); border:2px solid #f2b559; border-radius:16px; padding:14px 28px; text-align:center; box-shadow: 0 12px 32px rgba(0,0,0,0.5); display:flex; align-items:center; gap:16px; animation: countdownPulse 1s ease-in-out infinite; }
  @keyframes countdownPulse{ 0%,100%{ transform:translateX(-50%) scale(1); } 50%{ transform:translateX(-50%) scale(1.04); } }
  .countdown-label{ font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:#4a3611; font-weight:700; }
  .countdown-number{ font-size:56px; font-weight:800; color:#181410; line-height:1; }
  .countdown-badge .close-btn{ background:#181410; border:1px solid #181410; color:var(--gold); padding:6px 14px; border-radius:6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  .countdown-badge .close-btn:hover{ background:#241c14; }
  .confirm-box{ background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px 22px; max-width:320px; text-align:center; }
  .confirm-box p{ margin:0 0 16px; font-size:14px; color:var(--text); line-height:1.5; }
  .confirm-row{ display:flex; gap:10px; }
  .confirm-row button{ flex:1; padding:9px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .confirm-row .danger-btn{ background:var(--danger); border-color:var(--danger); color:#fff; }
.shared-modal{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px; width:min(440px, 92vw); max-height:80vh; overflow-y:auto; text-align:left; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
.shared-modal h3{ margin:0 0 4px; font-size:18px; color:var(--gold); }
.shared-sub{ margin:0 0 14px; font-size:12px; color:var(--muted); line-height:1.5; }
.shared-list{ display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow-y:auto; margin-bottom:4px; }
.shared-item{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface-2); }
.shared-item-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.shared-item-title{ flex:1; text-align:left; background:none; border:none; color:var(--text); font-size:13px; font-weight:600; padding:2px 0; cursor:pointer; }
.shared-item-title .k{ color:var(--teal); font-weight:400; font-size:11px; }
.shared-import-btn{ flex:none; width:auto; padding:6px 10px; }
.shared-song-preview{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); max-height:180px; overflow-y:auto; }
.share-link-input{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 10px; font-size:12px; margin-bottom:10px; box-sizing:border-box; }
.folder-browse-path{ font-size:11px; color:var(--muted); letter-spacing:0.5px; margin: 0 0 10px; word-break:break-all; }
.folder-browse-list{ display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow-y:auto; margin-bottom:4px; }
.fb-entry{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface-2); }
.fb-entry .fb-ico{ font-size:16px; flex:none; }
.fb-entry .fb-name{ flex:1; min-width:0; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; background:none; border:none; cursor:pointer; }
.fb-entry .fb-name:hover{ color:var(--gold); }
.fb-up-row{ display:flex; align-items:center; gap:8px; padding: 4px 2px 8px; }
</style>
</head>

<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#9a8f80;">Loading your setlist…</div>
</div>
<div class="trademark">MEMAPHU™ · v11</div>

<script>
(function(){
  "use strict";

  var NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var FLAT_TO_SHARP = { Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#', Cb:'B', Fb:'E' };

  function normalizeRoot(root){ return FLAT_TO_SHARP[root] || root; }

  function transposeChordToken(token, steps){
    var m = token.match(/^([A-G](?:#|b)?)(.*)$/);
    if(!m) return token;
    var root = m[1], rest = m[2];
    var bass = '';
    var slashIdx = rest.indexOf('/');
    if(slashIdx !== -1){ bass = rest.slice(slashIdx); rest = rest.slice(0, slashIdx); }
    var norm = normalizeRoot(root);
    var idx = NOTES.indexOf(norm);
    if(idx === -1) return token;
    idx = (idx + steps % 12 + 12) % 12;
    var newRoot = NOTES[idx];
    var newBass = bass;
    if(bass){
      var bm = bass.match(/^\/([A-G](?:#|b)?)(.*)$/);
      if(bm){
        var bn = normalizeRoot(bm[1]);
        var bi = NOTES.indexOf(bn);
        if(bi !== -1){ bi = (bi + steps % 12 + 12) % 12; newBass = '/' + NOTES[bi] + bm[2]; }
      }
    }
    return newRoot + rest + newBass;
  }

  var CHORD_TOKEN_RE = /\[([^\]]+)\]/g;
  var CHORD_WORD_RE = /^[A-G](#|b)?[a-zA-Z0-9#b+\-]*(\/[A-G](#|b)?[a-zA-Z0-9#b+\-]*)?$/;
  var CHORD_WORD_GLOBAL_RE = /([A-G](?:#|b)?[a-zA-Z0-9#b+\-]*(?:\/[A-G](?:#|b)?[a-zA-Z0-9#b+\-]*)?)/g;
  // Tokens that commonly sit alongside chords in a chord line (bar separators like
  // "|", dashes, repeat counts like "x2"/"4x", or a section label like "Intro:")
  // shouldn't count against the line when deciding if it's a chord line.
  var FILLER_TOKEN_RE = /^[|xX\u00d7\-\u2013\u20140-9]+$/;
  var LABEL_TOKEN_RE = /^[A-Za-z]+:$/;

  function isLikelyChordLine(line){
    var trimmed = line.trim();
    if(!trimmed) return false;
    var tokens = trimmed.split(/\s+/);
    var relevant = 0;
    var chordish = 0;
    for(var i=0;i<tokens.length;i++){
      var tok = tokens[i];
      if(FILLER_TOKEN_RE.test(tok) || LABEL_TOKEN_RE.test(tok)) continue;
      relevant++;
      if(CHORD_WORD_RE.test(tok)) chordish++;
    }
    if(relevant === 0) return false;
    return (chordish / relevant) >= 0.6;
  }

  function transposeSongBody(body, steps){
    if(steps === 0) return body;
    var lines = body.split('\n');
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(/\[([^\]]+)\]/.test(line)){
        lines[i] = line.replace(/\[([^\]]+)\]/g, function(m, chord){ return '[' + transposeChordToken(chord, steps) + ']'; });
      } else if(isLikelyChordLine(line)){
        lines[i] = line.replace(CHORD_WORD_GLOBAL_RE, function(m){ return transposeChordToken(m, steps); });
      }
    }
    return lines.join('\n');
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderChartHtml(body){
    var lines = body.split('\n');
    var html = '';
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(line.trim() === ''){ html += '<div class="blank-line">&nbsp;</div>'; continue; }
      if(/\[([^\]]+)\]/.test(line)){
        var replaced = escapeHtml(line).replace(/\[([^\]]+)\]/g, function(m, chord){ return '<span class="chord-tok" data-chord="' + escapeHtml(chord) + '">' + chord + '</span>'; });
        html += '<div class="lyric-line">' + replaced + '</div>';
      } else if(isLikelyChordLine(line)){
        var replacedLine = escapeHtml(line).replace(CHORD_WORD_GLOBAL_RE, function(m){
          return '<span class="chord-tok" data-chord="' + escapeHtml(m) + '">' + m + '</span>';
        });
        html += '<div class="chord-line">' + replacedLine + '</div>';
      } else {
        html += '<div class="lyric-line">' + escapeHtml(line) + '</div>';
      }
    }
    return html;
  }

  // Same chord-detection logic as renderChartHtml, but for the raw editable text:
  // keeps every original character (brackets included) so this HTML lines up
  // character-for-character with the plain-text textarea it sits behind.
  function renderEditorHtml(body){
    var lines = body.split('\n');
    var out = [];
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(line.trim() === ''){ out.push(''); continue; }
      if(/\[([^\]]+)\]/.test(line)){
        out.push(escapeHtml(line).replace(/\[([^\]]+)\]/g, function(m, chord){
          return '<span class="chord-tok-edit">[' + escapeHtml(chord) + ']</span>';
        }));
      } else if(isLikelyChordLine(line)){
        out.push(escapeHtml(line).replace(CHORD_WORD_GLOBAL_RE, function(m){
          return '<span class="chord-tok-edit">' + escapeHtml(m) + '</span>';
        }));
      } else {
        out.push(escapeHtml(line));
      }
    }
    // Trailing newline so the backdrop's last line matches a textarea's rendering.
    return out.join('\n') + '\n';
  }

  // ---- Chord diagram engine ----
  // Hardcoded open-position shapes for natural roots (nicest, most familiar fingerings)
  var OPEN_SHAPES = {
    'C':      [-1,3,2,0,1,0],
    'Cmaj7':  [-1,3,2,0,0,0],
    'C7':     [-1,3,2,3,1,0],
    'D':      [-1,-1,0,2,3,2],
    'Dm':     [-1,-1,0,2,3,1],
    'D7':     [-1,-1,0,2,1,2],
    'E':      [0,2,2,1,0,0],
    'Em':     [0,2,2,0,0,0],
    'E7':     [0,2,0,1,0,0],
    'Emaj7':  [0,2,1,1,0,0],
    'Em7':    [0,2,0,0,0,0],
    'F':      [1,3,3,2,1,1],
    'Fmaj7':  [-1,-1,3,2,1,0],
    'G':      [3,2,0,0,0,3],
    'G7':     [3,2,0,0,0,1],
    'A':      [-1,0,2,2,2,0],
    'Am':     [-1,0,2,2,1,0],
    'A7':     [-1,0,2,0,2,0],
    'Am7':    [-1,0,2,0,1,0],
    'B':      [-1,2,4,4,4,2],
    'Bm':     [-1,2,4,4,3,2],
    'B7':     [-1,2,1,2,0,2]
  };
  // Movable E-shape barre templates (root note played on low-E string, open = E itself)
  var BARRE_TEMPLATES = {
    'maj':  [0,2,2,1,0,0],
    'm':    [0,2,2,0,0,0],
    '7':    [0,2,0,1,0,0],
    'maj7': [0,2,1,1,0,0],
    'm7':   [0,2,0,0,0,0],
    'sus4': [0,2,2,2,0,0],
    'sus2': [0,2,4,1,0,-1]
  };

  function normalizeQuality(rawSuffix){
    var s = (rawSuffix || '').toLowerCase();
    if(s === '') return { key: 'maj', exact: true };
    if(/^maj7/.test(s)) return { key: 'maj7', exact: true };
    if(/^(m7|min7|\-7)/.test(s)) return { key: 'm7', exact: true };
    if(/^sus4/.test(s)) return { key: 'sus4', exact: true };
    if(/^sus2/.test(s)) return { key: 'sus2', exact: true };
    if(/^(m|min)(?!aj)/.test(s)) return { key: 'm', exact: true };
    if(/^7/.test(s)) return { key: '7', exact: true };
    if(/^dim/.test(s)) return { key: 'm', exact: false };
    if(/^aug/.test(s)) return { key: 'maj', exact: false };
    if(/^m/.test(s)) return { key: 'm7', exact: false };
    return { key: '7', exact: false };
  }

  function getChordShape(chordToken){
    var m = chordToken.match(/^([A-G](?:#|b)?)(.*)$/);
    if(!m) return null;
    var rawRoot = m[1];
    var rest = m[2];
    // strip bass note for shape purposes
    var slashIdx = rest.indexOf('/');
    var suffix = slashIdx !== -1 ? rest.slice(0, slashIdx) : rest;
    var root = normalizeRoot(rawRoot);
    var q = normalizeQuality(suffix);

    // Try hardcoded open shape first (only for natural-letter roots without # )
    var naturalKey = rawRoot.length === 1 ? rawRoot : null;
    if(naturalKey){
      var tableKey = naturalKey + (q.key === 'maj' ? '' : q.key);
      if(OPEN_SHAPES[tableKey]){
        return { frets: OPEN_SHAPES[tableKey], exact: q.exact, label: chordToken };
      }
    }
    // Fallback: algorithmic barre chord (E-shape), shifted by semitone distance from E
    var template = BARRE_TEMPLATES[q.key] || BARRE_TEMPLATES['maj'];
    var idxRoot = NOTES.indexOf(root);
    var idxE = NOTES.indexOf('E');
    var offset = (idxRoot - idxE + 12) % 12;
    var frets = template.map(function(f){ return f === -1 ? -1 : f + offset; });
    return { frets: frets, exact: q.exact, label: chordToken };
  }

  function chordDiagramSVG(shape){
    var frets = shape.frets;
    var positives = frets.filter(function(f){ return f > 0; });
    var maxFret = positives.length ? Math.max.apply(null, positives) : 0;
    var startFret = (maxFret <= 4) ? 1 : Math.min.apply(null, positives);
    var numFretsShown = 4;
    var w = 160, h = 190;
    var leftPad = 26, topPad = 34, gridW = 108, gridH = 120;
    var stringGap = gridW / 5;
    var fretGap = gridH / numFretsShown;

    var svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

    // backing card
    svg += '<rect x="4" y="4" width="' + (w-8) + '" height="' + (h-8) + '" rx="10" fill="#251F1A" stroke="#3a2f24" stroke-width="1"></rect>';

    // faint fretboard wood-tone panel behind the grid
    svg += '<rect x="' + (leftPad-6) + '" y="' + (topPad-6) + '" width="' + (gridW+12) + '" height="' + (gridH+12) + '" rx="4" fill="#171310"></rect>';

    // string labels (x / o) above nut, only meaningful when showing from fret 1
    for(var s=0; s<6; s++){
      var x = leftPad + s * stringGap;
      var f = frets[s];
      var mark = '';
      if(startFret === 1){
        if(f === -1) mark = 'x';
        else if(f === 0) mark = 'o';
      } else if(f === -1){
        mark = 'x';
      }
      if(mark){
        svg += '<text x="' + x + '" y="' + (topPad - 10) + '" text-anchor="middle" font-size="12" fill="#9a8f80" font-family="Courier New, monospace">' + mark + '</text>';
      }
    }

    // position label if not starting at nut
    if(startFret !== 1){
      svg += '<text x="' + (leftPad - 18) + '" y="' + (topPad + fretGap/2 + 4) + '" text-anchor="middle" font-size="11" fill="#E8A33D" font-family="Courier New, monospace">' + startFret + 'fr</text>';
    }

    // nut or top line
    svg += '<rect x="' + leftPad + '" y="' + topPad + '" width="' + gridW + '" height="' + (startFret === 1 ? 4 : 2) + '" fill="' + (startFret === 1 ? '#F2EDE4' : '#5a5044') + '"></rect>';

    // fret lines
    for(var fr=0; fr<=numFretsShown; fr++){
      var y = topPad + fr * fretGap;
      svg += '<line x1="' + leftPad + '" y1="' + y + '" x2="' + (leftPad+gridW) + '" y2="' + y + '" stroke="#4a4034" stroke-width="1"></line>';
    }
    // string lines
    for(var st=0; st<6; st++){
      var sx = leftPad + st * stringGap;
      svg += '<line x1="' + sx + '" y1="' + topPad + '" x2="' + sx + '" y2="' + (topPad+gridH) + '" stroke="#4a4034" stroke-width="1"></line>';
    }

    // detect barre: same fret value repeated across 3+ adjacent strings (excluding -1)
    var barreFretVal = null, barreStart = -1, barreEnd = -1;
    for(var b=0;b<6;b++){
      if(frets[b] > 0){
        var runEnd = b;
        while(runEnd+1 < 6 && frets[runEnd+1] === frets[b]) runEnd++;
        if(runEnd - b >= 3){ barreFretVal = frets[b]; barreStart = b; barreEnd = runEnd; break; }
      }
    }
    if(barreFretVal !== null){
      var relFret = barreFretVal - startFret + 1;
      var by = topPad + (relFret - 0.5) * fretGap;
      var bx1 = leftPad + barreStart * stringGap;
      var bx2 = leftPad + barreEnd * stringGap;
      svg += '<line x1="' + bx1 + '" y1="' + by + '" x2="' + bx2 + '" y2="' + by + '" stroke="#E8A33D" stroke-width="10" stroke-linecap="round" opacity="0.85"></line>';
    }

    // dots for fretted notes
    for(var d=0; d<6; d++){
      var fv = frets[d];
      if(fv > 0){
        var isPartOfBarre = barreFretVal !== null && fv === barreFretVal && d >= barreStart && d <= barreEnd;
        if(isPartOfBarre) continue;
        var dx = leftPad + d * stringGap;
        var relF = fv - startFret + 1;
        var dy = topPad + (relF - 0.5) * fretGap;
        svg += '<circle cx="' + dx + '" cy="' + dy + '" r="9" fill="#181410" opacity="0.6"></circle>';
        svg += '<circle cx="' + dx + '" cy="' + dy + '" r="8" fill="#E8A33D"></circle>';
        svg += '<circle cx="' + (dx-2.5) + '" cy="' + (dy-2.5) + '" r="2" fill="#f7d9a3" opacity="0.7"></circle>';
      }
    }

    svg += '</svg>';
    return svg;
  }

  function uid(){ return 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  // Maps a song's BPM to a 1-10 auto-scroll speed so faster songs scroll faster
  // and ballads scroll slower, without the user having to set the slider by hand.
  function computeScrollSpeedFromBpm(bpmVal){
    var n = parseInt(bpmVal, 10);
    if(!n || isNaN(n) || n <= 0) return null;
    var speed = Math.round(n / 20);
    return Math.max(1, Math.min(10, speed));
  }

  var SAMPLE_BODY = "ATE\nby memaphu\n\nIntro: G - Bm7 - Em - Am7 - F - D7sus\n\nG          Bm7             Em      Am7                 F              D7sus\nTe, anong nangyayari? Bat tila tulala, at di ka mapakali?\nG          Bm7             Em      Am7                 F              D7sus\nTe, bat di ka magsabi, Kung may problema, sa aki'y tumabi.\n\nKORO\nC                          G        C                           G\nTenga koy nakaabang, Pwedeng ibulong, mo lang,\nBalikat koy nakaabang, yumakap ka, ang uloy isandal.\nEm                          Am7        F           D7sus\nWag kang mahihiya. O maiilang, ako ay andito lang\nG          Bm7             Em      Am7                 F              D7sus\nTe, kung nahihirapan, sayo ako ay laging, handang pumasan.\nG          Bm7             Em      Am7                 F              D7sus\nEy, wag ka ng malumbay, di bagay sayo, ang salubong na kilay.\n\n(Ulitin ang KORO)\n\nAdlib 2x: G - Bm7 - Em - Am7 - F - D7sus\n\n(Ulitin ang KORO)\n\nG          Bm7             Em      Am7                 F              D7sus\nGanyan nga, ngumiti wag humikbi, kunting relaks naman, maniwala at magtiwala.\nG          Bm7             Em      Am7                 F              D7sus\nDiba, lahat may problema, lahat ay makakaya, bastat manalig at wag mawalan ng pag asa.\n\n(Ulitin ang KORO 1x)\n(Adlib - koro)\n(Ulitin koro)";

  function getActiveSong(){
    if(!state.songs) return null;
    for(var i=0;i<state.songs.length;i++){ if(state.songs[i].id === state.activeId) return state.songs[i]; }

  // Local (device) storage: this is the primary store so the app works fully
  // offline / standalone (installed PWA or APK), where window.storage is not available.
  var LS_PREFIX = 'gigsonghits:';
  function lsGet(key){
    try{
      var raw = localStorage.getItem(LS_PREFIX + key);
      return raw === null ? null : { key: key, value: raw };
    }catch(e){ return null; }
  }
  function lsSet(key, value){
    try{ localStorage.setItem(LS_PREFIX + key, value); return { key: key, value: value }; }
    catch(e){ return null; }
  }
  function lsDelete(key){
    try{ localStorage.removeItem(LS_PREFIX + key); return { key: key, deleted: true }; }
    catch(e){ return null; }
  }

  // Claude-artifact storage (window.storage) is used opportunistically as an extra
  // sync layer when this file happens to run inside a Claude.ai preview; it is never
  // required, so the app works the same standalone (browser, PWA, APK).
  async function safeStorageGet(key){
    var local = lsGet(key);
    if(local) return local;
    try{
      if(window.storage){
        var r = await window.storage.get(key);
        if(r) return r;
      }
    }catch(e){}
    return null;
  }
  async function safeStorageSet(key, value){
    var res = lsSet(key, value);
    try{ if(window.storage) await window.storage.set(key, value); }catch(e){}
    return res;
  }
  async function safeStorageDelete(key){
    var res = lsDelete(key);
    try{ if(window.storage) await window.storage.delete(key); }catch(e){}
    return res;
  }

  async function persistIndex(list){
    await safeStorageSet('song-index', JSON.stringify(list.map(function(s){ return s.id; })));
  }
  async function persistSong(song){
    await safeStorageSet('song:' + song.id, JSON.stringify(song));
  }
  async function persistFolderList(){
    await safeStorageSet('folder-list', JSON.stringify(state.folderList));
  }

  // Union of the persisted folder list and any folder names in use by songs,
  // so a folder never "disappears" even if it wasn't explicitly created first.
  function getFolders(){
    var names = state.folderList.slice();
    state.songs.forEach(function(s){
      var f = s.folder || 'Gig';
      if(names.indexOf(f) === -1) names.push(f);
    });
    return names;
  }

  async function ensureFolder(name){
    var trimmed = (name || '').trim();
    if(!trimmed) return;
    if(state.folderList.indexOf(trimmed) === -1){
      state.folderList.push(trimmed);
      await persistFolderList();
    }
  }

  async function loadSongs(){
    var flRes = await safeStorageGet('folder-list');
    try{
      var fl = flRes && flRes.value ? JSON.parse(flRes.value) : null;
      if(fl && fl.length) state.folderList = fl;
      else await persistFolderList(); // seed defaults on first run
    }catch(e){ await persistFolderList(); }

    var idxRes = await safeStorageGet('song-index');
    var ids = [];
    try{ ids = idxRes && idxRes.value ? JSON.parse(idxRes.value) : []; }catch(e){ ids = []; }

    if(!ids || ids.length === 0){
      var id = uid();
      var song = { id: id, title: "Ate", key: "G", bpm: "", folder: "Gig", body: SAMPLE_BODY };
      await persistSong(song);
      await persistIndex([song]);
      state.songs = [song];
      state.activeId = id;
      render();
      return;
    }

    var loaded = [];
    for(var i=0;i<ids.length;i++){
      var r = await safeStorageGet('song:' + ids[i]);
      if(r && r.value){
        try{
          var parsed = JSON.parse(r.value);
          if(!parsed.folder) parsed.folder = 'Gig'; // migrate older songs saved before folders existed
          loaded.push(parsed);
        }catch(e){}
      }
    }
    if(loaded.length === 0){
      var id2 = uid();
      var song2 = { id: id2, title: "Ate", key: "G", bpm: "", folder: "Gig", body: SAMPLE_BODY };
      loaded = [song2];
      await persistSong(song2);
      await persistIndex(loaded);
    }
    state.songs = loaded;
    state.activeId = loaded[0].id;
    var initSpeed = computeScrollSpeedFromBpm(loaded[0].bpm);
    if(initSpeed) state.scrollSpeed = initSpeed;
    render();
  }

  function showToast(msg){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 2200);
  }

  async function updateActiveSong(patch){
    var song = getActiveSong();
    if(!song) return;
    Object.assign(song, patch);
    await persistSong(song);
  }

  async function createSong(){
    var wasAllSongs = state.currentFolder === null && state.sidebarView === 'folderSongs';
    var targetFolder = state.currentFolder || 'Gig';
    var song = { id: uid(), title: "Untitled Song", key: "C", bpm: "", folder: targetFolder, body: "[C]Type your lyrics and [G]chords here\nUse brackets like [Am] before the [F]syllable" };
    state.songs.unshift(song);
    state.activeId = song.id;
    state.mode = 'edit';
    state.transposeSteps = 0;
    state.sidebarView = 'folderSongs';
    if(!wasAllSongs) state.currentFolder = targetFolder;
    await ensureFolder(targetFolder);
    await persistSong(song);
    await persistIndex(state.songs);
    render();
    focusTitleInput();
  }

  async function deleteSong(id){
    state.songs = state.songs.filter(function(s){ return s.id !== id; });
    await safeStorageDelete('song:' + id);
    await persistIndex(state.songs);
    if(state.activeId === id){
      state.activeId = state.songs.length ? state.songs[0].id : null;
      state.transposeSteps = 0;
    }
    state.confirmDelete = null;
    render();
    showToast('Song removed');
  }

  function selectSong(id){
    state.activeId = id;
    state.mode = 'view';
    state.transposeSteps = 0;
    state.sidebarOpen = false;
    state.autoScroll = false;
    state.scrollStarted = false;
    state.editorNewFolder = false;
    stopAutoScroll();
    stopCountdown();
    var s = getActiveSong();
    var sp = s ? computeScrollSpeedFromBpm(s.bpm) : null;
    if(sp) state.scrollSpeed = sp;
    render();
  }

  function buildSidebarListHtml(){

          for(var i=0;i<matches.length;i++){
            var s = matches[i];
            html += '<div class="song-item' + (s.id === state.activeId ? ' active' : '') + '" data-id="' + s.id + '" data-search-folder="' + escapeHtml(s.folder || 'Gig') + '">';
            html += '  <span class="t">' + escapeHtml(s.title || 'Untitled') + '</span>';
            html += '  <span class="k">Key ' + escapeHtml(s.key || '\u2014') + ' \u00b7 \uD83D\uDCC1 ' + escapeHtml(s.folder || 'Gig') + '</span>';
            html += '</div>';
          }
        }
        return html;
      }
      var folders = getFolders();
      var totalCount = state.songs.length;
      html += '    <div class="folder-card all" data-folder="__all__"><span class="ico">\uD83C\uDFB5</span><div class="info"><span class="name">All Songs</span><span class="count">' + totalCount + ' song' + (totalCount===1?'':'s') + '</span></div></div>';
      folders.forEach(function(f){
        var count = state.songs.filter(function(s){ return (s.folder || 'Gig') === f; }).length;
        if(state.renamingFolder === f){
          html += '    <div class="folder-card renaming" data-folder="' + escapeHtml(f) + '"><span class="ico">\uD83D\uDCC1</span><input id="rename-folder-input" class="rename-folder-input" value="' + escapeHtml(f) + '" maxlength="40" /><div class="folder-actions"><button class="folder-action-btn" data-rename-confirm="' + escapeHtml(f) + '" title="Save">\u2713</button><button class="folder-action-btn" data-rename-cancel="1" title="Cancel">\u2715</button></div></div>';
        } else {
          html += '    <div class="folder-card" data-folder="' + escapeHtml(f) + '"><span class="ico">\uD83D\uDCC1</span><div class="info"><span class="name">' + escapeHtml(f) + '</span><span class="count">' + count + ' song' + (count===1?'':'s') + '</span></div><div class="folder-actions"><button class="folder-action-btn" data-rename="' + escapeHtml(f) + '" title="Rename">\u270E</button><button class="folder-action-btn danger" data-delfolder="' + escapeHtml(f) + '" title="Delete">\uD83D\uDDD1\uFE0F</button></div></div>';
        }
      });
      return html;
    }

    var folderSongs = state.currentFolder ? state.songs.filter(function(s){ return (s.folder || 'Gig') === state.currentFolder; }) : state.songs;
    if(q){
      folderSongs = folderSongs.filter(function(s){
        return (s.title || '').toLowerCase().indexOf(q) !== -1 || (s.key || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    if(folderSongs.length === 0){
      html += '<div class="empty-hint">' + (q ? 'Walang nahanap na kantang tugma sa \u201c' + escapeHtml(state.searchQuery.trim()) + '\u201d.' : 'Wala pang kanta dito. Pindutin ang + para gumawa, o mag-import ng file sa ibaba.') + '</div>';
    } else {
      for(var j=0;j<folderSongs.length;j++){
        var s2 = folderSongs[j];
        html += '<div class="song-item' + (s2.id === state.activeId ? ' active' : '') + '" data-id="' + s2.id + '">';
        html += '  <span class="t">' + escapeHtml(s2.title || 'Untitled') + '</span>';
        html += '  <span class="k">Key ' + escapeHtml(s2.key || '\u2014') + (s2.bpm ? ' \u00b7 ' + escapeHtml(s2.bpm) + ' bpm' : '') + '</span>';
        html += '</div>';
      }
    }
    return html;
  }

  // Rebuilds just the #sidebar-list contents (and the search box's clear
  // button + the folder header's song count) so typing in the search input
  // never re-renders the input itself and never loses focus/cursor position.
  function refreshSidebarList(){
    var listEl = document.getElementById('sidebar-list');
    if(!listEl) return;
    listEl.innerHTML = buildSidebarListHtml();
    bindSidebarListHandlers();

    var searchRow = document.querySelector('.search-row');
    if(searchRow){
      var existingClear = document.getElementById('btn-search-clear');
      var shouldHaveClear = !!(state.searchQuery && state.searchQuery.length);
      if(shouldHaveClear && !existingClear){
        var btn = document.createElement('button');
        btn.className = 'search-clear'; btn.id = 'btn-search-clear'; btn.title = 'I-clear'; btn.textContent = '\u2715';
        btn.onclick = function(){ state.searchQuery = ''; render(); var si = document.getElementById('sidebar-search'); if(si) si.focus(); };
        searchRow.appendChild(btn);
      } else if(!shouldHaveClear && existingClear){
        existingClear.remove();
      }
    }

    if(state.sidebarView === 'folderSongs'){
      var fcountEl = document.querySelector('.folder-header .fcount');
      if(fcountEl){
        var q = (state.searchQuery || '').trim().toLowerCase();
        var all = state.currentFolder ? state.songs.filter(function(s){ return (s.folder||'Gig')===state.currentFolder; }) : state.songs;
        var shown = q ? all.filter(function(s){ return (s.title||'').toLowerCase().indexOf(q)!==-1 || (s.key||'').toLowerCase().indexOf(q)!==-1; }) : all;
        fcountEl.textContent = shown.length;
      }
    }
  }

  // Click handlers for elements inside #sidebar-list — split out from
  // attachHandlers() so refreshSidebarList() can rebind after a soft update.
  function bindSidebarListHandlers(){
    var byId = function(id){ return document.getElementById(id); };

    var folderCards = document.querySelectorAll('.folder-card');
    folderCards.forEach(function(el){
      if(el.classList.contains('renaming')) return;
      el.onclick = function(){ openFolder(el.getAttribute('data-folder')); };
    });

    var renameBtns = document.querySelectorAll('[data-rename]');
    renameBtns.forEach(function(btn){
      btn.onclick = function(e){ e.stopPropagation(); startRenameFolder(btn.getAttribute('data-rename')); };
    });
    var delFolderBtns = document.querySelectorAll('[data-delfolder]');
    delFolderBtns.forEach(function(btn){
      btn.onclick = function(e){ e.stopPropagation(); requestDeleteFolder(btn.getAttribute('data-delfolder')); };
    });
    var renameConfirmBtns = document.querySelectorAll('[data-rename-confirm]');
    renameConfirmBtns.forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var inp = byId('rename-folder-input');
        renameFolder(btn.getAttribute('data-rename-confirm'), inp ? inp.value : '');
      };
    });
    var renameCancelBtns = document.querySelectorAll('[data-rename-cancel]');
    renameCancelBtns.forEach(function(btn){
      btn.onclick = function(e){ e.stopPropagation(); cancelRenameFolder(); };
    });
    var renameFolderInput = byId('rename-folder-input');
    if(renameFolderInput){
      renameFolderInput.onclick = function(e){ e.stopPropagation(); };
      renameFolderInput.onkeydown = function(e){
        if(e.key === 'Enter'){ e.preventDefault(); renameFolder(state.renamingFolder, renameFolderInput.value); }
        if(e.key === 'Escape'){ cancelRenameFolder(); }
      };
    }

    var items = document.querySelectorAll('.song-item');
    items.forEach(function(el){
      el.onclick = function(){
        var sf = el.getAttribute('data-search-folder');
        if(sf) selectSongFromSearch(el.getAttribute('data-id'), sf);
        else selectSong(el.getAttribute('data-id'));
      };
    });
  }

  // Renaming updates the folder-list entry (or merges into an existing folder of
  // the target name) and re-tags every song currently filed under the old name.
  async function renameFolder(oldName, newName){
    var trimmed = (newName || '').trim();
    if(!trimmed || trimmed === oldName){ state.renamingFolder = null; render(); return; }

    var idx = state.folderList.indexOf(oldName);
    if(idx !== -1){
      if(state.folderList.indexOf(trimmed) === -1){
        state.folderList[idx] = trimmed;
      } else {
        // Target name already exists as a folder — merge by dropping the old entry.
        state.folderList.splice(idx, 1);
      }
    } else {
      await ensureFolder(trimmed);
    }
    await persistFolderList();

    for(var i=0;i<state.songs.length;i++){
      var s = state.songs[i];
      if((s.folder || 'Gig') === oldName){
        s.folder = trimmed;
        await persistSong(s);
      }
    }
    if(state.currentFolder === oldName) state.currentFolder = trimmed;
    state.renamingFolder = null;
    render();
    showToast('Napalitan ang pangalan sa "' + trimmed + '"');
  }

  function requestDeleteFolder(name){
    state.confirmDeleteFolder = name;
    render();
  }

  function cancelDeleteFolder(){
    state.confirmDeleteFolder = null;
    render();

  // Deleting a folder never deletes songs — any song still filed under it gets
  // moved to "Gig" so nothing accidentally disappears.
  async function deleteFolderConfirmed(){
    var name = state.confirmDeleteFolder;
    if(!name) return;
    var moved = 0;
    for(var i=0;i<state.songs.length;i++){
      var s = state.songs[i];
      if((s.folder || 'Gig') === name && name !== 'Gig'){
        s.folder = 'Gig';
        moved++;
        await persistSong(s);
      }
    }
    state.folderList = state.folderList.filter(function(f){ return f !== name; });
    await persistFolderList();
    if(state.currentFolder === name) state.currentFolder = null;
    state.confirmDeleteFolder = null;
    render();
    showToast(moved > 0 ? ('Tinanggal ang folder. ' + moved + ' kanta inilipat sa "Gig"') : 'Tinanggal ang folder');
  }

  async function handleImportFile(e){
    var file = e.target.files[0];
    if(!file) return;
    var name = file.name || '';
    var targetFolder = state.currentFolder || 'Gig';

    try{
      if(/\.json$/i.test(name)){
        var jsonText = await file.text();
        var jsonResult = await importContentAsSong(jsonText, name, 'application/json', state.currentFolder);
        if(jsonResult.kind === 'multi' && jsonResult.firstId){
          state.activeId = jsonResult.firstId; state.mode = 'view'; state.transposeSteps = 0;
        }
        state.sidebarView = 'folderSongs';
        state.currentFolder = targetFolder;
        render();
        showToast('\u2713 Na-import ang ' + jsonResult.count + ' kanta mula sa JSON');
      } else if(/\.(docx|pptx)$/i.test(name)){
        var buf = await file.arrayBuffer();
        var parsed = await parseOfficeBuffer(buf, name);
        var officeTitle = parsed.title || name.replace(/\.(docx|pptx)$/i, '');
        var officeResult = await addSingleSongToApp(officeTitle, parsed.text, null, state.currentFolder);
        state.activeId = officeResult.id; state.mode = 'view'; state.transposeSteps = 0;
        state.sidebarView = 'folderSongs';
        state.currentFolder = targetFolder;
        render();
        showToast('\u2713 Na-import na: "' + officeTitle + '"');
      } else if(/\.html?$/i.test(name)){
        var htmlText = await file.text();
        var extracted = extractTextFromHtml(htmlText);
        var htmlTitle = extracted.title || name.replace(/\.html?$/i, '');
        if(!extracted.text || !extracted.text.trim()) throw new Error('empty');
        var htmlResult = await addSingleSongToApp(htmlTitle, extracted.text, null, state.currentFolder);
        state.activeId = htmlResult.id; state.mode = 'view'; state.transposeSteps = 0;
        state.sidebarView = 'folderSongs';
        state.currentFolder = targetFolder;
        render();
        showToast('\u2713 Na-import na: "' + htmlTitle + '"');
      } else {
        // Plain text / chord-sheet fallback: .txt, .cho, .chopro, .crd, or unknown.
        var text = await file.text();
        var title = name.replace(/\.(txt|cho|chopro|crd)$/i, '');
        var result = await addSingleSongToApp(title, text, null, state.currentFolder);
        state.activeId = result.id; state.mode = 'view'; state.transposeSteps = 0;
        state.sidebarView = 'folderSongs';
        state.currentFolder = targetFolder;
        render();
        showToast('\u2713 Na-import na: "' + title + '"');
      }
    }catch(err){
      var msg = 'Hindi ma-import ang file.';
      if(err && err.message === 'jszip-missing') msg = 'Hindi pa handa ang Word/PowerPoint reader, subukan ulit pagkatapos ng ilang segundo.';
      else if(err && err.message === 'bad-office-file') msg = 'Hindi ma-basa ang Word file na ito, baka sira o hindi tunay na .docx.';
      else if(err && err.message === 'unsupported-office') msg = 'Hindi supported ang file type na ito.';
      else if(err && err.message === 'empty') msg = 'Walang laman ang file na ito.';
      else if(err && err.message === 'invalid-json') msg = 'Hindi valid na JSON setlist ang file na ito.';
      showToast(msg);
    }
    e.target.value = '';
  }

  function filenameFromUrl(url){
    try{
      var urlObj = new URL(url);
      var parts = urlObj.pathname.split('/').filter(Boolean);
      if(parts.length){
        var last = decodeURIComponent(parts[parts.length - 1]).replace(/\.(txt|cho|chopro|crd|html?)$/i, '');
        if(last) return last;
      }
    }catch(e){}
    return 'Imported Song';
  }

  function decodeHtmlEntities(str){
    var ta = document.createElement('textarea');
    ta.innerHTML = str;
    return ta.value;
  }

  function extractTextFromHtml(html){
    var titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    var pageTitle = titleMatch ? decodeHtmlEntities(titleMatch[1]).trim() : null;
    var cleaned = html
      .replace(/<head[\s\S]*?<\/head>/i, '')
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<style[\s\S]*?<\/style>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '');
    // Preserve line breaks for block-level elements before stripping tags
    cleaned = cleaned.replace(/<br\s*\/?>/gi, '\n');
    cleaned = cleaned.replace(/<\/(p|div|li|tr|h[1-6]|pre|section|article)>/gi, '\n');
    cleaned = cleaned.replace(/<[^>]+>/g, '');
    cleaned = decodeHtmlEntities(cleaned);
    cleaned = cleaned.replace(/\r\n/g, '\n');
    cleaned = cleaned.split('\n').map(function(l){ return l.replace(/[ \t]+$/, ''); }).join('\n');
    cleaned = cleaned.replace(/[ \t]{2,}/g, ' ');
    cleaned = cleaned.replace(/\n{3,}/g, '\n\n').trim();
    return { text: cleaned, title: pageTitle };
  }

  async function addSingleSongToApp(title, bodyText, sourceUrl, targetFolderOverride){
    var targetFolder = (targetFolderOverride !== undefined ? targetFolderOverride : state.currentFolder) || 'Gig';
    var song = { id: uid(), title: title, key: "C", bpm: "", folder: targetFolder, body: bodyText.replace(/\s+$/, ''), sourceUrl: sourceUrl };
    state.songs.push(song);
    await ensureFolder(targetFolder);
    await persistSong(song);
    await persistIndex(state.songs);
    return { kind: 'single', title: title, id: song.id };
  }

  // Shared import logic: given fetched text + the URL/content-type it came from,
  // adds either a whole setlist (JSON) or a single song (txt/html) to state.songs.
  // Used by both the direct URL importer and the GitHub folder browser below.
  async function importContentAsSong(text, url, contentTypeHeader, targetFolderOverride){
    var looksLikeJson = /\.json(\?|#|$)/i.test(url) || /^\s*[\{\[]/.test(text);
    if(looksLikeJson){
      var data = null;
      try{ data = JSON.parse(text); }catch(e){ data = null; }
      if(data){
        var incomingSongs = Array.isArray(data.songs) ? data.songs : (Array.isArray(data) ? data : null);
        if(incomingSongs && incomingSongs.length){
          var targetFolder = targetFolderOverride !== undefined ? targetFolderOverride : state.currentFolder;
          var addedCount = 0;
          var firstAddedId = null;
          for(var i=0;i<incomingSongs.length;i++){
            var s = incomingSongs[i];
            if(!s || !s.title) continue;
            var folderForSong = targetFolder || s.folder || 'Gig';
            var song = { id: uid(), title: s.title || 'Untitled', key: s.key || 'C', bpm: s.bpm || '', folder: folderForSong, body: s.body || '' };
            state.songs.push(song);
            await ensureFolder(folderForSong);
            await persistSong(song);
            if(!firstAddedId) firstAddedId = song.id;
            addedCount++;
          }
          if(Array.isArray(data.folderList)){
            data.folderList.forEach(function(f){ if(state.folderList.indexOf(f) === -1) state.folderList.push(f); });
            await persistFolderList();
          }
          await persistIndex(state.songs);
          return { kind: 'multi', count: addedCount, firstId: firstAddedId };
        }
      }
      if(/\.json(\?|#|$)/i.test(url)) throw new Error('invalid-json');
    }

    var contentType = contentTypeHeader || '';
    var looksLikeHtml = /\.html?(\?|#|$)/i.test(url) || /text\/html/i.test(contentType) || /^\s*<!doctype html|^\s*<html/i.test(text);
    var title = filenameFromUrl(url);
    var bodyText = text;
    if(looksLikeHtml){
      var extracted = extractTextFromHtml(text);
      bodyText = extracted.text;
      if(extracted.title) title = extracted.title;
      if(!bodyText || !bodyText.trim()) throw new Error('empty');
    }
    return addSingleSongToApp(title, bodyText, url, targetFolderOverride);
  }

  // ---- Word (.docx) / PowerPoint (.pptx) reading ----
  function xmlUnescape(str){
    return str.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  }

  function docxXmlToText(xml){
    var s = xml
      .replace(/<w:tab\s*\/?>/gi, '\t')
      .replace(/<w:br\s*\/?>/gi, '\n')
      .replace(/<\/w:p>/gi, '\n');
    s = s.replace(/<[^>]+>/g, '');
    s = xmlUnescape(s);
    s = s.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    return s;
  }

  function pptxXmlToText(xml){
    var s = xml.replace(/<\/a:p>/gi, '\n');
    s = s.replace(/<[^>]+>/g, '');
    s = xmlUnescape(s);
    s = s.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    return s;
  }

  // Core parser: given raw bytes + a filename/URL (used only to tell docx vs
  // pptx apart), returns { text, title }. Works the same whether the bytes
  // came from fetch() or from a local file picker.
  async function parseOfficeBuffer(buf, nameOrUrl){
    if(typeof window.JSZip === 'undefined'){
      throw new Error('jszip-missing');
    }
    var zip = await window.JSZip.loadAsync(buf);
    var isDocx = /\.docx(\?|#|$)/i.test(nameOrUrl);
    var isPptx = /\.pptx(\?|#|$)/i.test(nameOrUrl);
    var text = '';
    var title = null;

    if(isDocx){
      var docFile = zip.file('word/document.xml');
      if(!docFile) throw new Error('bad-office-file');
      var docXml = await docFile.async('string');
      text = docxXmlToText(docXml);
      var coreFile = zip.file('docProps/core.xml');
      if(coreFile){
        var coreXml = await coreFile.async('string');
        var m = coreXml.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i);
        if(m && m[1].trim()) title = xmlUnescape(m[1].trim());
      }
    } else if(isPptx){
      var slideNames = Object.keys(zip.files).filter(function(name){ return /^ppt\/slides\/slide\d+\.xml$/.test(name); });
      slideNames.sort(function(a, b){
        var na = parseInt(a.match(/slide(\d+)\.xml/)[1], 10);
        var nb = parseInt(b.match(/slide(\d+)\.xml/)[1], 10);
        return na - nb;
      });
      var slideTexts = [];
      for(var i=0;i<slideNames.length;i++){
        var sXml = await zip.file(slideNames[i]).async('string');
        var t = pptxXmlToText(sXml);
        if(t.trim()) slideTexts.push(t.trim());
      }
      text = slideTexts.join('\n\n');
    } else {
      throw new Error('unsupported-office');
    }

    if(!text || !text.trim()) throw new Error('empty');
    return { text: text, title: title };
  }

  async function importOfficeFileFromUrl(url, targetFolderOverride){
    var res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var buf = await res.arrayBuffer();
    var parsed = await parseOfficeBuffer(buf, url);
    var title = parsed.title || filenameFromUrl(url);
    return addSingleSongToApp(title, parsed.text, url, targetFolderOverride);
  }

  // ---- GitHub "browse a folder, pick what to import" ----
  function encodeApiPath(path){
    return path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  }

  // Recognizes GitHub folder links in either form:
  //   https://github.com/{owner}/{repo}/tree/{branch}/{path...}
  //   https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path.../ or no extension}
  function parseGithubFolderUrl(url){
    try{
      var u = new URL(url);
      if(u.hostname === 'github.com'){
        var parts = u.pathname.split('/').filter(Boolean);
        if(parts.length >= 2){
          var owner = parts[0], repo = parts[1];
          if(parts.length === 2){
            return { owner: owner, repo: repo, branch: null, path: '' };
          }
          if(parts[2] === 'tree' && parts.length >= 4){
            return { owner: owner, repo: repo, branch: parts[3], path: parts.slice(4).join('/') };
          }
        }
        return null;
      }
      if(u.hostname === 'raw.githubusercontent.com'){
        var rparts = u.pathname.split('/').filter(Boolean);
        if(rparts.length >= 3){
          var rowner = rparts[0], rrepo = rparts[1], rbranch = rparts[2];
          var rpathParts = rparts.slice(3);
          var endsWithSlash = /\/$/.test(u.pathname);
          var lastSeg = rpathParts.length ? rpathParts[rpathParts.length - 1] : '';
          var hasExtension = /\.[a-z0-9]{1,6}$/i.test(lastSeg);
          if(endsWithSlash || !hasExtension){
            return { owner: rowner, repo: rrepo, branch: rbranch, path: rpathParts.join('/') };
          }
        }
        return null;
      }
      return null;
    }catch(e){ return null; }
  }

  async function fetchGithubFolder(owner, repo, branch, path){
    var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + encodeApiPath(path) + (branch ? ('?ref=' + encodeURIComponent(branch)) : '');
    var res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
    if(!res.ok){
      if(res.status === 404) throw new Error('not-found');
      throw new Error('HTTP ' + res.status);
    }
    var data = await res.json();
    if(!Array.isArray(data)) throw new Error('not-a-folder');
    // Folders first, then files, alphabetically within each group.
    data.sort(function(a, b){
      if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    return data;
  }

  async function openFolderBrowse(owner, repo, branch, path){
    state.folderBrowseOpen = true;
    state.folderBrowseBusy = true;
    state.folderBrowseError = null;
    state.folderBrowseOwner = owner;
    state.folderBrowseRepo = repo;
    state.folderBrowseBranch = branch;
    state.folderBrowsePath = path || '';
    state.folderBrowseEntries = null;
    render();

  async function handleImportFromUrl(){
    var input = document.getElementById('url-import-input');
    var url = input ? input.value.trim() : '';
    if(!url){ state.urlImportError = 'Maglagay muna ng link.'; render(); focusUrlInput(); return; }
    if(!/^https?:\/\//i.test(url)){ state.urlImportError = 'Kailangan magsimula sa http:// o https://'; render(); focusUrlInput(); return; }

    // If this looks like a link to a GitHub *folder* rather than a single file,
    // open the folder browser (list + pick) instead of trying to fetch it directly.
    var folderRef = parseGithubFolderUrl(url);
    if(folderRef){
      state.urlImportOpen = false;
      state.urlImportBusy = false;
      state.urlImportValue = '';
      state.urlImportError = null;
      openFolderBrowse(folderRef.owner, folderRef.repo, folderRef.branch, folderRef.path);
      return;
    }

    state.urlImportValue = url;
    state.urlImportBusy = true;
    state.urlImportError = null;
    render();

    var isOfficeFile = /\.(docx|pptx)(\?|#|$)/i.test(url);

    try{
      var result;
      if(isOfficeFile){
        result = await importOfficeFileFromUrl(url, state.currentFolder);
      } else {
        var res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        var text = await res.text();
        if(!text || !text.trim()) throw new Error('empty');
        var contentType = '';
        try{ contentType = (res.headers && res.headers.get) ? (res.headers.get('content-type') || '') : ''; }catch(e){}
        result = await importContentAsSong(text, url, contentType, state.currentFolder);
      }

      if(result.kind === 'single'){ state.activeId = result.id; state.mode = 'view'; state.transposeSteps = 0; }
      else if(result.firstId){ state.activeId = result.firstId; state.mode = 'view'; state.transposeSteps = 0; }
      state.sidebarView = 'folderSongs';

      state.urlImportOpen = false;
      state.urlImportBusy = false;
      state.urlImportValue = '';
      render();
      showToast(result.kind === 'multi' ? ('\u2713 Na-import ang ' + result.count + ' kanta mula sa link!') : ('\u2713 Na-import mula sa link: "' + result.title + '"'));
    }catch(err){
      state.urlImportBusy = false;
      var msg = 'Hindi ma-fetch ang link.';
      if(err && err.message === 'empty'){
        msg = 'Walang laman ang file sa link na ibinigay.';
      } else if(err && err.message === 'invalid-json'){
        msg = 'Mukhang JSON file ito pero hindi ito valid na setlist (walang "songs" list).';
      } else if(err && err.message === 'jszip-missing'){
        msg = 'Hindi pa handa ang Word/PowerPoint reader, subukan ulit pagkatapos ng ilang segundo.';
      } else if(err && err.message === 'bad-office-file'){
        msg = 'Hindi ma-basa ang Word file na ito, baka sira o hindi tunay na .docx.';
      } else if(err && err.message === 'unsupported-office'){
        msg = 'Hindi supported ang file type na ito.';
      } else if(err && /Failed to fetch|NetworkError|TypeError/i.test(err.message || '')){
        msg = 'Hindi ma-access ang link. Baka naka-block ng CORS ang website, private ang file, o walang internet.';
      } else if(err && err.message){
        msg = 'Hindi ma-fetch: ' + err.message;
      }
      state.urlImportError = msg;
      render();
      focusUrlInput();
    }
  }

  function handleExport(){
    var song = getActiveSong();
    if(!song) return;
    var body = transposeSongBody(song.body, state.transposeSteps);

    var header = song.title + (keyDisp ? ' - Key of ' + keyDisp : '') + '\n\n';
    var blob = new Blob([header + body], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (song.title || 'song').replace(/[^a-z0-9\-_ ]/gi,'').trim() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Exported as .txt');
  }

  function handleImportJSONFile(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        var incomingSongs = Array.isArray(data.songs) ? data.songs : (Array.isArray(data) ? data : null);
        if(!incomingSongs) throw new Error('invalid');
        var addedCount = 0;
        for(var i=0;i<incomingSongs.length;i++){
          var s = incomingSongs[i];
          if(!s || !s.title) continue;
          var song = {
            id: uid(),
            title: s.title || 'Untitled',
            key: s.key || 'C',
            bpm: s.bpm || '',
            folder: s.folder || 'Gig',
            body: s.body || ''
          };
          state.songs.push(song);
          await ensureFolder(song.folder);
          await persistSong(song);
          addedCount++;
        }
        if(Array.isArray(data.folderList)){
          data.folderList.forEach(function(f){ if(state.folderList.indexOf(f) === -1) state.folderList.push(f); });
          await persistFolderList();
        }
        await persistIndex(state.songs);
        render();
        showToast('Na-import ang ' + addedCount + ' kanta mula sa JSON');
      }catch(err){
        showToast('Hindi ma-import: invalid JSON file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ---- Share-a-folder-via-link ----
  function b64EncodeUnicode(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(_, p1){ return String.fromCharCode('0x' + p1); }));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(Array.prototype.map.call(atob(str), function(c){ return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
  }

  function parseSharedFromUrl(){
    try{
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('share');
      if(!raw) return null;
      var json = b64DecodeUnicode(raw);
      var data = JSON.parse(json);
      if(!data || !Array.isArray(data.songs) || !data.songs.length) return null;
      return { folder: data.folder || 'Shared', songs: data.songs };
    }catch(e){ return null; }
  }

  function buildShareUrlForFolder(folderName){
    var songsToShare = folderName === null
      ? state.songs
      : state.songs.filter(function(s){ return (s.folder || 'Gig') === folderName; });
    if(!songsToShare.length) return null;
    var payload = {
      folder: folderName || 'All Songs',
      songs: songsToShare.map(function(s){ return { title: s.title, key: s.key, bpm: s.bpm, body: s.body }; })
    };
    var encoded = b64EncodeUnicode(JSON.stringify(payload));
    var base = window.location.origin + window.location.pathname;
    return base + '?share=' + encoded;
  }

  function stopAutoScroll(){
    if(scrollAnimId) cancelAnimationFrame(scrollAnimId);
    scrollAnimId = null;
  }

  var userTouchingStage = false;

  function startAutoScroll(){
    stopAutoScroll();
    var el = document.getElementById('stage');
    if(!el) return;
    var lastTs = null;
    // Float accumulator avoids sub-pixel rounding loss at slow speeds, but is
    // resynced to the real scrollTop whenever the user is touching the screen,
    // so manual scroll always wins and autoscroll resumes from there smoothly.
    var pos = el.scrollTop;
    function step(ts){
      if(!state.autoScroll){ return; }
      if(lastTs == null){ lastTs = ts; pos = el.scrollTop; scrollAnimId = requestAnimationFrame(step); return; }
      var dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if(userTouchingStage){
        // Fully hands-off while the user is scrolling manually.
        pos = el.scrollTop;
        scrollAnimId = requestAnimationFrame(step);
        return;
      }
      var pxPerSec = 4 + state.scrollSpeed * 4; // gentler range: ~8px/s to ~44px/s
      pos += pxPerSec * dt;
      el.scrollTop = pos;
      if(el.scrollTop + el.clientHeight >= el.scrollHeight - 2){
        state.autoScroll = false;
        renderToolbarOnly();
        return;
      }
      scrollAnimId = requestAnimationFrame(step);
    }
    scrollAnimId = requestAnimationFrame(step);
  }

  function toggleAutoScroll(){
    if(state.autoScroll){
      // Pausing keeps scrollStarted=true, so pressing play again just resumes.
      state.autoScroll = false;
      stopAutoScroll();
      renderToolbarOnly();
      return;
    }
    if(state.countdownRemaining != null){
      // Already counting down — treat a second click as cancel.
      stopCountdown();
      render();
      return;
    }
    if(state.scrollStarted){
      // Resuming after a pause — no need to count in again.
      state.autoScroll = true;
      startAutoScroll();
      renderToolbarOnly();
      return;
    }
    startCountdown();
  }

  function startCountdown(){
    stopCountdown();
    if(!state.countInSeconds || state.countInSeconds <= 0){
      state.autoScroll = true;
      state.scrollStarted = true;
      startAutoScroll();
      renderToolbarOnly();
      return;
    }
    state.countdownRemaining = state.countInSeconds;
    render();
    countdownTimerId = setInterval(function(){
      state.countdownRemaining -= 1;
      if(state.countdownRemaining <= 0){
        clearInterval(countdownTimerId);
        countdownTimerId = null;
        state.countdownRemaining = null;
        state.autoScroll = true;
        state.scrollStarted = true;
        render();
        startAutoScroll();
      } else {
        var numEl = document.getElementById('countdown-number');
        if(numEl) numEl.textContent = state.countdownRemaining;
      }
    }, 1000);
  }

  function stopCountdown(){
    if(countdownTimerId){ clearInterval(countdownTimerId); countdownTimerId = null; }
    state.countdownRemaining = null;
  }

  // ---- Mobile/PWA back-button handling ----
  // Without this, an installed PWA (or in-app webview) has no browser history
  // of its own, so the very first hardware "back" press closes the whole app
  // no matter where the user is in the UI. We push one history entry per
  // "level" the user is nested into (a folder opened, edit mode, a modal, the
  // mobile sidebar overlay) and pop the matching UI state back off on
  // popstate, so back only exits the app once you're already at the root.
  var _navLevel = 0;
  var _navReady = false;
  var _inPopstate = false;

  function hasOverlayOpen(){
    return !!(state.chordModal || state.confirmDelete || state.confirmDeleteFolder ||
      state.urlImportOpen || state.sharedModalOpen || state.shareModalOpen ||
      state.folderBrowseOpen || state.editorNewFolder || state.renamingFolder || state.addingFolder);
  }

  function computeNavLevel(){
    var c = hasOverlayOpen() ? 1 : 0;
    var d = state.sidebarOpen ? 1 : 0;
    var b = state.mode === 'edit' ? 1 : 0;
    var a = state.sidebarView === 'folderSongs' ? 1 : 0;
    return c + d + b + a;
  }

  // Closes exactly one "level", in the same priority used by computeNavLevel()
  // (overlay > mobile sidebar > edit mode > folder view), so a single back
  // press always undoes a single visible change.
  function closeTopOverlay(){
    if(state.chordModal){ state.chordModal = null; return; }
    if(state.confirmDelete){ state.confirmDelete = null; return; }
    if(state.confirmDeleteFolder){ state.confirmDeleteFolder = null; return; }
    if(state.urlImportOpen){ state.urlImportOpen = false; state.urlImportBusy = false; state.urlImportError = null; return; }
    if(state.sharedModalOpen){ state.sharedModalOpen = false; return; }
    if(state.shareModalOpen){ state.shareModalOpen = false; return; }
    if(state.folderBrowseOpen){ state.folderBrowseOpen = false; return; }
    if(state.editorNewFolder){ state.editorNewFolder = false; return; }
    if(state.renamingFolder){ state.renamingFolder = null; return; }
    if(state.addingFolder){ state.addingFolder = false; return; }
    if(state.sidebarOpen){ state.sidebarOpen = false; return; }
    if(state.mode === 'edit'){ state.mode = 'view'; return; }
    if(state.sidebarView === 'folderSongs'){ state.sidebarView = 'folders'; return; }
  }

  function syncNavHistory(){
    var newLevel = computeNavLevel();
    if(!_navReady){
      _navLevel = newLevel;
      _navReady = true;
      try{ history.replaceState({ gsh: newLevel }, ''); }catch(e){}
      return;
    }
    if(_inPopstate){ _navLevel = newLevel; return; }
    var diff = newLevel - _navLevel;
    if(diff > 0){
      for(var i=0;i<diff;i++){ try{ history.pushState({ gsh: _navLevel + i + 1 }, ''); }catch(e){} }
      _navLevel = newLevel;
    } else if(diff < 0){
      _navLevel = newLevel;
      for(var j=0;j<-diff;j++){ try{ history.back(); }catch(e){} }
    }
  }

  window.addEventListener('popstate', function(){
    _inPopstate = true;
    closeTopOverlay();
    _navLevel = computeNavLevel();
    render();
    _inPopstate = false;
  });

  // ---- Rendering ----
  function render(){
    syncNavHistory();
    renderInner();
  }

    } else {

      html += '  <div class="folder-header"><button class="back-btn" id="btn-back-folders">\u2190</button><span class="fname">' + escapeHtml(state.currentFolder || 'All Songs') + '</span><span class="fcount">' + folderSongsAll.length + '</span><button class="new-btn" id="btn-share-folder" title="Share link ng folder" style="background:var(--teal);color:#0f1f1e;">\uD83D\uDD17</button><button class="new-btn" id="btn-new" title="New song">+</button></div>';
