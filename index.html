  // Lightweight re-render for toolbar-only changes (autoscroll toggle) to avoid disrupting scroll position
  function renderToolbarOnly(){
    var btn = document.getElementById('btn-autoscroll');
    if(btn){
      btn.className = 'tool-btn wide' + (state.autoScroll ? ' on' : '');
      btn.textContent = state.autoScroll ? '\u23F8 SCROLLING' : '\u25B6 SCROLL';
    }
  }

  function attachHandlers(){
    var byId = function(id){ return document.getElementById(id); };

    if(byId('btn-new')) byId('btn-new').onclick = createSong;
    if(byId('btn-new-empty')) byId('btn-new-empty').onclick = createSong;
    if(byId('btn-import-empty')) byId('btn-import-empty').onclick = function(){ var fi = byId('file-input'); if(fi) fi.click(); };
    if(byId('btn-import-url-empty')) byId('btn-import-url-empty').onclick = openUrlImport;
    if(byId('btn-toggle-sidebar')) byId('btn-toggle-sidebar').onclick = function(){ state.sidebarOpen = !state.sidebarOpen; render(); };
    if(byId('btn-close-side')) byId('btn-close-side').onclick = function(){ state.sidebarOpen = false; render(); };

    bindSidebarListHandlers();

    if(byId('btn-cancel-delete-folder')) byId('btn-cancel-delete-folder').onclick = cancelDeleteFolder;
    if(byId('btn-confirm-delete-folder')) byId('btn-confirm-delete-folder').onclick = deleteFolderConfirmed;
    if(byId('confirm-overlay-folder')) byId('confirm-overlay-folder').onclick = function(e){ if(e.target.id === 'confirm-overlay-folder') cancelDeleteFolder(); };

    if(byId('btn-back-folders')) byId('btn-back-folders').onclick = backToFolders;
    if(byId('btn-add-folder-toggle')) byId('btn-add-folder-toggle').onclick = function(){
      state.addingFolder = !state.addingFolder;
      render();
      if(state.addingFolder){ var inp = byId('new-folder-input'); if(inp) inp.focus(); }
    };
    if(byId('btn-add-folder-confirm')) byId('btn-add-folder-confirm').onclick = confirmAddFolder;
    if(byId('btn-add-folder-cancel')) byId('btn-add-folder-cancel').onclick = function(){ state.addingFolder = false; render(); };
    var newFolderInput = byId('new-folder-input');
    if(newFolderInput) newFolderInput.onkeydown = function(e){ if(e.key === 'Enter') confirmAddFolder(); if(e.key === 'Escape'){ state.addingFolder = false; render(); } };

    var searchInput = byId('sidebar-search');
    if(searchInput){
      searchInput.oninput = function(e){ state.searchQuery = e.target.value; refreshSidebarList(); };
      searchInput.onkeydown = function(e){ if(e.key === 'Escape'){ state.searchQuery = ''; searchInput.value = ''; refreshSidebarList(); } };
    }
    var searchClearBtn = byId('btn-search-clear');
    if(searchClearBtn) searchClearBtn.onclick = function(){ state.searchQuery = ''; render(); var si = byId('sidebar-search'); if(si) si.focus(); };

    var fileInput = byId('file-input');
    if(fileInput) fileInput.onchange = handleImportFile;
    if(byId('btn-import-side')) byId('btn-import-side').onclick = function(){ fileInput.click(); };
    if(byId('btn-import-top')) byId('btn-import-top').onclick = function(){ fileInput.click(); };

    if(byId('btn-import-url-side')) byId('btn-import-url-side').onclick = openUrlImport;
    if(byId('btn-import-url-top')) byId('btn-import-url-top').onclick = openUrlImport;
    if(byId('btn-cancel-urlimport')) byId('btn-cancel-urlimport').onclick = closeUrlImport;
    if(byId('btn-confirm-urlimport')) byId('btn-confirm-urlimport').onclick = handleImportFromUrl;
    if(byId('urlimport-overlay')) byId('urlimport-overlay').onclick = function(e){ if(e.target.id === 'urlimport-overlay') closeUrlImport(); };
    var urlImportInput = byId('url-import-input');
    if(urlImportInput){
      urlImportInput.onkeydown = function(e){
        if(e.key === 'Enter'){ e.preventDefault(); handleImportFromUrl(); }
        if(e.key === 'Escape') closeUrlImport();
      };
    }

    var fileInputJson = byId('file-input-json');
    if(fileInputJson) fileInputJson.onchange = handleImportJSONFile;
    if(byId('btn-backup-json')) byId('btn-backup-json').onclick = handleExportJSON;
    if(byId('btn-restore-json')) byId('btn-restore-json').onclick = function(){ fileInputJson.click(); };

    if(byId('btn-key-down')) byId('btn-key-down').onclick = function(){ state.transposeSteps -= 1; render(); };
    if(byId('btn-key-up')) byId('btn-key-up').onclick = function(){ state.transposeSteps += 1; render(); };
    if(byId('btn-key-reset')) byId('btn-key-reset').onclick = function(){ state.transposeSteps = 0; render(); };

    if(byId('btn-autoscroll')) byId('btn-autoscroll').onclick = toggleAutoScroll;
    if(byId('range-speed')) byId('range-speed').oninput = function(e){ state.scrollSpeed = Number(e.target.value); };
    if(byId('count-in-input')) byId('count-in-input').oninput = function(e){
      var v = Number(e.target.value);
      state.countInSeconds = isNaN(v) ? 0 : Math.max(0, Math.min(15, v));
    };
    if(byId('btn-cancel-countdown')) byId('btn-cancel-countdown').onclick = function(){ stopCountdown(); render(); };
    if(byId('countdown-overlay')) byId('countdown-overlay').onclick = function(e){ if(e.target.id === 'countdown-overlay'){ stopCountdown(); render(); } };
    if(byId('range-font')) byId('range-font').oninput = function(e){
      state.fontSize = Number(e.target.value);
      var chart = document.querySelector('.chart');
      if(chart) chart.style.fontSize = state.fontSize + 'px';
    };

    // Touch handling on the lyrics area does two things:
    // 1) Tracks whether the user currently has a finger down, so autoscroll
    //    (see startAutoScroll) steps aside and lets manual scrolling take over.
    // 2) Two-finger pinch resizes the font directly (native browser pinch-zoom
    //    is blocked via touch-action:pan-y in CSS, so this replaces it).
    var stageEl = byId('stage');
    if(stageEl){
      var pinchStartDist = null;
      var pinchStartFont = null;
      function touchDist(touches){
        var dx = touches[0].clientX - touches[1].clientX;
        var dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
      }
      stageEl.addEventListener('touchstart', function(e){
        userTouchingStage = true;
        if(e.touches.length === 2){
          e.preventDefault();
          pinchStartDist = touchDist(e.touches);
          pinchStartFont = state.fontSize;
        }
      }, { passive: false });
      stageEl.addEventListener('touchmove', function(e){
        if(e.touches.length === 2){
          e.preventDefault();
          if(!pinchStartDist){
            pinchStartDist = touchDist(e.touches);
            pinchStartFont = state.fontSize;
            return;
          }
          var newDist = touchDist(e.touches);
          var ratio = newDist / pinchStartDist;
          var newSize = Math.round(pinchStartFont * ratio);
          newSize = Math.max(12, Math.min(36, newSize));
          if(newSize !== state.fontSize){
            state.fontSize = newSize;
            var chart = document.querySelector('.chart');
            if(chart) chart.style.fontSize = state.fontSize + 'px';
            var slider = byId('range-font');
            if(slider) slider.value = state.fontSize;
          }
        }
      }, { passive: false });
      stageEl.addEventListener('touchend', function(e){
        if(e.touches.length < 2){ pinchStartDist = null; pinchStartFont = null; }
        if(e.touches.length === 0){ userTouchingStage = false; }
      }, { passive: true });
      stageEl.addEventListener('touchcancel', function(e){
        pinchStartDist = null; pinchStartFont = null; userTouchingStage = false;
      }, { passive: true });
    }

    if(byId('btn-toggle-mode')) byId('btn-toggle-mode').onclick = function(){
      state.mode = state.mode === 'edit' ? 'view' : 'edit';
      state.editorNewFolder = false;
      render();
      if(state.mode === 'edit') focusTitleInput();
    };

    if(byId('btn-share-folder')) byId('btn-share-folder').onclick = openShareFolder;
    if(byId('btn-share-close')) byId('btn-share-close').onclick = closeShareModal;
    if(byId('btn-share-copy')) byId('btn-share-copy').onclick = copyShareLink;
    if(byId('share-overlay')) byId('share-overlay').onclick = function(e){ if(e.target.id === 'share-overlay') closeShareModal(); };

    if(byId('btn-shared-close')) byId('btn-shared-close').onclick = closeSharedModal;
    if(byId('btn-shared-importall')) byId('btn-shared-importall').onclick = openConfirmImportAllShared;
    if(byId('shared-overlay')) byId('shared-overlay').onclick = function(e){ if(e.target.id === 'shared-overlay') closeSharedModal(); };
    var sharedImportBtns = document.querySelectorAll('.shared-import-btn');
    sharedImportBtns.forEach(function(btn){
      btn.onclick = function(){ importSharedSong(parseInt(this.getAttribute('data-import'), 10)); };
    });
    var sharedTitleBtns = document.querySelectorAll('.shared-item-title');
    sharedTitleBtns.forEach(function(btn){
      btn.onclick = function(){ previewSharedSong(parseInt(this.getAttribute('data-preview'), 10)); };
    });

    if(byId('btn-fb-close')) byId('btn-fb-close').onclick = closeFolderBrowse;
    if(byId('btn-fb-up')) byId('btn-fb-up').onclick = folderBrowseGoUp;
    if(byId('btn-fb-importall')) byId('btn-fb-importall').onclick = openConfirmImportAllFolder;
    if(byId('folderbrowse-overlay')) byId('folderbrowse-overlay').onclick = function(e){ if(e.target.id === 'folderbrowse-overlay') closeFolderBrowse(); };

    if(byId('btn-fb-confirmall-cancel')) byId('btn-fb-confirmall-cancel').onclick = cancelConfirmImportAllFolder;
    if(byId('btn-fb-confirmall-yes')) byId('btn-fb-confirmall-yes').onclick = confirmImportAllFolder;
    if(byId('fb-confirmall-overlay')) byId('fb-confirmall-overlay').onclick = function(e){ if(e.target.id === 'fb-confirmall-overlay') cancelConfirmImportAllFolder(); };

    if(byId('btn-shared-confirmall-cancel')) byId('btn-shared-confirmall-cancel').onclick = cancelConfirmImportAllShared;
    if(byId('btn-shared-confirmall-yes')) byId('btn-shared-confirmall-yes').onclick = confirmImportAllShared;
    if(byId('shared-confirmall-overlay')) byId('shared-confirmall-overlay').onclick = function(e){ if(e.target.id === 'shared-confirmall-overlay') cancelConfirmImportAllShared(); };
    var fbNavBtns = document.querySelectorAll('[data-navdir]');
    fbNavBtns.forEach(function(btn){
      btn.onclick = function(){
        var path = this.getAttribute('data-navdir');
        var entry = state.folderBrowseEntries.filter(function(e){ return e.path === path; })[0];
        if(entry) folderBrowseNavigateInto(entry);
      };
    });
    var fbImportBtns = document.querySelectorAll('.fb-import-btn');
    fbImportBtns.forEach(function(btn){
      btn.onclick = function(){
        var path = this.getAttribute('data-importfile');
        var entry = state.folderBrowseEntries.filter(function(e){ return e.path === path; })[0];
        if(entry) importFolderFileEntry(entry);
      };
    });

    if(byId('btn-export')) byId('btn-export').onclick = handleExport;
    if(byId('btn-delete')) byId('btn-delete').onclick = function(){ state.confirmDelete = state.activeId; render(); };
    if(byId('btn-cancel-delete')) byId('btn-cancel-delete').onclick = function(){ state.confirmDelete = null; render(); };
    if(byId('btn-confirm-delete')) byId('btn-confirm-delete').onclick = function(){ deleteSong(state.confirmDelete); };
    if(byId('confirm-overlay')) byId('confirm-overlay').onclick = function(e){ if(e.target.id === 'confirm-overlay'){ state.confirmDelete = null; render(); } };

    if(byId('btn-close-chord')) byId('btn-close-chord').onclick = function(){ state.chordModal = null; render(); };
    if(byId('chord-overlay')) byId('chord-overlay').onclick = function(e){ if(e.target.id === 'chord-overlay'){ state.chordModal = null; render(); } };

    var editTitle = byId('edit-title');
    if(editTitle){
      editTitle.oninput = function(e){ updateActiveSong({ title: e.target.value }); refreshSidebarLabelsSoft(); };
    }
    var editKey = byId('edit-key');
    if(editKey) editKey.oninput = function(e){ updateActiveSong({ key: e.target.value }); refreshSidebarLabelsSoft(); };
    var editBpm = byId('edit-bpm');
    if(editBpm) editBpm.oninput = function(e){
      updateActiveSong({ bpm: e.target.value });
      refreshSidebarLabelsSoft();
      var sp = computeScrollSpeedFromBpm(e.target.value);
      if(sp){
        state.scrollSpeed = sp;
        var slider = byId('range-speed');
        if(slider) slider.value = sp;
      }
    };
    var editFolder = byId('edit-folder');
    if(editFolder) editFolder.onchange = async function(e){
      var val = e.target.value;
      if(val === '__new__'){
        state.editorNewFolder = true;
        render();
        var nf = byId('edit-folder-new-input');
        if(nf) nf.focus();
        return;
      }
      val = val.trim() || 'Gig';
      await updateActiveSong({ folder: val });
      await ensureFolder(val);
      state.currentFolder = val;
      render();
    };
    var newFolderConfirmBtn = byId('btn-editor-newfolder-confirm');
    if(newFolderConfirmBtn) newFolderConfirmBtn.onclick = async function(){
      var inp = byId('edit-folder-new-input');
      var val = inp ? inp.value.trim() : '';
      if(!val){ state.editorNewFolder = false; render(); return; }
      await updateActiveSong({ folder: val });
      await ensureFolder(val);
      state.currentFolder = val;
      state.editorNewFolder = false;
      render();
      showToast('Folder "' + val + '" added');
    };
    var newFolderCancelBtn = byId('btn-editor-newfolder-cancel');
    if(newFolderCancelBtn) newFolderCancelBtn.onclick = function(){ state.editorNewFolder = false; render(); };
    var editFolderNewInput = byId('edit-folder-new-input');
    if(editFolderNewInput){
      editFolderNewInput.onkeydown = function(e){
        if(e.key === 'Enter'){ e.preventDefault(); newFolderConfirmBtn.click(); }
        if(e.key === 'Escape'){ state.editorNewFolder = false; render(); }
      };
    }
    var editBody = byId('edit-body');
    var editBodyBackdrop = byId('edit-body-backdrop');
    if(editBody){
      editBody.oninput = function(e){
        updateActiveSong({ body: e.target.value });
        if(editBodyBackdrop) editBodyBackdrop.innerHTML = renderEditorHtml(e.target.value);
      };
      editBody.onscroll = function(){
        if(editBodyBackdrop){
          editBodyBackdrop.scrollTop = editBody.scrollTop;
          editBodyBackdrop.scrollLeft = editBody.scrollLeft;
        }
      };
      // Keep the backdrop's box the same size as the textarea as the user drags its resize handle.
      if(editBodyBackdrop && window.ResizeObserver){
        var editBodyResizeObs = new ResizeObserver(function(){
          editBodyBackdrop.style.height = editBody.offsetHeight + 'px';
        });
        editBodyResizeObs.observe(editBody);
      }
    }

    if(state.autoScroll) startAutoScroll();
  }

  function refreshSidebarLabelsSoft(){
    var song = getActiveSong();
    if(!song) return;
    var el = document.querySelector('.song-item[data-id="' + song.id + '"]');
    if(el){
      var t = el.querySelector('.t');
      var k = el.querySelector('.k');
      if(t) t.textContent = song.title || 'Untitled';
      if(k) k.textContent = 'Key ' + (song.key || '\u2014') + (song.bpm ? ' \u00b7 ' + song.bpm + ' bpm' : '');
    }
  }

  document.addEventListener('click', function(e){
    var el = e.target;
    if(el && el.classList && el.classList.contains('chord-tok')){
      state.chordModal = el.getAttribute('data-chord');
      render();
    }
  });

  var _sharedFromUrl = parseSharedFromUrl();
  if(_sharedFromUrl){
    state.sharedPreview = _sharedFromUrl;
    state.sharedModalOpen = true;
  }

  loadSongs();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
